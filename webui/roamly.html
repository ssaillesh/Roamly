<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Roamly — your night, planned</title>
<meta name="description" content="Tell Roamly what you're after — it plans a real outing of places near you, and you stay in control of every detail." />
<meta name="theme-color" content="#fbf8f4" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://trekrank.onrender.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/roamly.css" />
<script src="/config.js"></script>
<style>
  /* ================= planner page: layout on top of roamly.css ================= */
  .views{flex:1; min-height:0; position:relative; display:flex; flex-direction:column;}
  .view{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;}
  .view[hidden]{display:none;}
  .page{max-width:760px; margin:0 auto; padding:20px 16px 32px;}
  .page-head{margin:4px 0 18px;}
  .page-head .t-meta{margin:4px 0 0;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---- top bar (hidden on the home screen: the hero carries its own) ---- */
  .top{display:flex; align-items:center; gap:10px; min-height:62px; padding:8px 14px 8px 12px; background:var(--bg);
    border-bottom:1px solid var(--line-2); position:relative; z-index:12;}
  .tt{min-width:0;}
  .tt b{display:block; font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.2;}
  .tt small{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-3); font-weight:600;}
  .tt small::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--mint);}
  body:not([data-view="chat"]) .tt small::before{display:none;}
  .top-acts{margin-left:auto; display:flex; gap:8px; align-items:center;}
  body[data-view="home"] .top,body[data-view="events"] .top,body[data-view="saved"] .top{display:none;}
  .page-head{display:flex; align-items:flex-start; gap:12px;}
  .page-head > div{flex:1; min-width:0;}
  @media (min-width:760px){ .page-head .avatar{display:none;} }
  body:not([data-view="chat"]) #backBtn, body:not([data-view="chat"]) #newChatBtn{display:none;}
  body:not([data-view="chat"]) .tt{padding-left:6px;}
  @media (min-width:760px){ .top .avatar{display:none;} }
  @media (max-width:420px){ #newChatBtn span{display:none;} #newChatBtn{padding:0 12px;} }

  /* ---- "Planning around" chips (shared: home card, chat bar) ---- */
  .ctx-chips{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; min-width:0; padding:2px 0;}
  .ctx-chips::-webkit-scrollbar{display:none;}
  .ctx-chips.wrap{flex-wrap:wrap; overflow:visible;}
  .cx{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 13px 0 11px;
    border:1px solid var(--line); background:var(--surface); border-radius:var(--r-pill); font-size:13.5px; font-weight:700;
    color:var(--ink); cursor:pointer; white-space:nowrap; transition:border-color .2s, transform .15s var(--ease);}
  .cx .ic{color:var(--primary-ink);}
  .cx:hover{border-color:rgba(106,76,240,.5);}
  .cx:active{transform:scale(.96);}
  .cx.need{border-color:var(--danger); color:var(--danger); background:var(--danger-soft);}
  .cx.need .ic{color:var(--danger);}
  .cx.flash{animation:cxflash 1.3s var(--ease) 1;}
  @keyframes cxflash{0%{background:var(--primary-soft-2); border-color:var(--primary); transform:scale(1.07);} 100%{transform:none;}}

  .ctxbar{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 16px; background:var(--bg); border-bottom:1px solid var(--line-2);}
  .ctxbar .ctx-chips{flex:1;}
  .ctxbar .link{flex:0 0 auto; padding:10px 8px;}
  body:not([data-view="chat"]) .ctxbar{display:none;}
  @media (max-width:560px){ .ctxbar .t-label{display:none;} .ctxbar{padding-left:12px;} }

  /* ================= HOME ================= */
  .home-hero{padding:0 20px 104px; border-radius:0 0 32px 32px;}
  .hero-bar{display:flex; align-items:center; justify-content:space-between; min-height:62px; padding-top:env(safe-area-inset-top);}
  .hero-copy{padding:10px 2px 0; max-width:36ch;}
  .hello{margin:0 0 6px; font-size:14.5px; font-weight:700; color:rgba(255,255,255,.92);}
  .hero-sub{margin:10px 0 0; font-size:14.5px; color:rgba(255,255,255,.9); max-width:34ch;}
  .hero .skyline{height:118px;}
  .home-body{padding:0 16px 28px; margin-top:-72px; position:relative; display:flex; flex-direction:column; gap:18px;}
  .home.anim .home-body > *{animation:rise .45s var(--ease) both;}
  .home.anim .home-body > *:nth-child(2){animation-delay:.05s;} .home.anim .home-body > *:nth-child(3){animation-delay:.1s;}
  .home.anim .home-body > *:nth-child(4){animation-delay:.15s;}

  .plan-around{padding:14px 16px 12px;}
  .pa-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .pa-head .link{padding:6px 2px;}
  .loc-note{margin:10px 0 0; font-size:13px; color:var(--ink-3); font-weight:550; display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px;}
  .loc-note .link{padding:4px 0; font-size:13px;}

  .acts{display:flex; flex-direction:column; gap:12px;}
  .act{position:relative; display:flex; border:0; cursor:pointer; text-align:left; font:inherit; color:var(--ink);
    border-radius:var(--r-lg); transition:transform .18s var(--pop), box-shadow .2s var(--ease);}
  .act:hover{transform:translateY(-2px);}
  .act:active{transform:scale(.98);}
  .act:disabled{opacity:.6; cursor:default; transform:none;}
  .act b{font-size:15.5px; font-weight:800; letter-spacing:-.015em; line-height:1.25;}
  .act small{font-size:12.5px; font-weight:600; color:var(--ink-2); line-height:1.3;}
  .act-ic{width:44px; height:44px; flex:0 0 auto; border-radius:15px; display:grid; place-items:center;}
  .act-primary{align-items:center; gap:14px; padding:18px 18px 18px 16px; background:var(--grad); color:#fff; box-shadow:var(--sh-cta);}
  .act-primary .act-ic{background:rgba(255,255,255,.2); color:#fff; width:52px; height:52px; border-radius:18px;}
  .act-primary b{font-size:18px;}
  .act-primary small{color:rgba(255,255,255,.92);}
  .act-primary .act-t{display:flex; flex-direction:column; gap:2px; flex:1;}
  .act-primary .act-go{width:40px; height:40px; border-radius:50%; background:#fff; color:var(--primary-ink); display:grid; place-items:center;}
  .act-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .act-row .act{flex-direction:column; gap:10px; padding:14px 12px 14px; min-height:132px; box-shadow:var(--sh-1);}
  .act-pink{background:var(--pink-soft);}  .act-pink .act-ic{background:var(--pink); color:#fff;}
  .act-sun{background:var(--sun-soft);}    .act-sun .act-ic{background:var(--sun); color:var(--ink);}
  .act-mint{background:var(--mint-soft);}  .act-mint .act-ic{background:var(--mint-ink); color:#fff;}
  @media (max-width:440px){ .act-row .act small{display:none;} .act-row .act{min-height:112px; padding:14px 12px;} .act-row .act b{font-size:14.5px;} }

  .ask{display:flex; align-items:center; gap:8px; padding:6px 6px 6px 16px; border-radius:var(--r-pill);}
  .ask .ask-ic{color:var(--primary-ink); display:grid;}
  .ask-input{flex:1; min-width:0; border:0; outline:none; background:none; font:inherit; font-size:15.5px; font-weight:550;
    color:var(--ink); min-height:44px;}
  .ask-input::placeholder{color:#8d8aa6;}
  .ask:focus-within{box-shadow:0 0 0 4px rgba(106,76,240,.14), var(--sh-2); border-color:rgba(106,76,240,.5);}
  .send{width:44px; height:44px; flex:0 0 auto; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer;
    background:var(--ink); color:#fff; transition:transform .15s var(--pop), opacity .2s;}
  .send:hover{transform:scale(1.06);} .send:active{transform:scale(.94);} .send:disabled{opacity:.45; transform:none;}
  .examples{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:-6px -16px 0; padding:2px 16px 4px;}
  .examples::-webkit-scrollbar{display:none;}
  .examples .chip{background:var(--surface-2); border-color:transparent; font-size:13.5px;}

  .sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:6px 2px -6px;}
  .sec-h .link{padding:4px 0;}
  .continue{display:flex; align-items:center; gap:14px; padding:14px 14px 14px 16px; cursor:pointer; border:1px solid var(--line-2);
    font:inherit; color:var(--ink); text-align:left; width:100%; transition:transform .15s var(--ease);}
  .continue:hover{transform:translateY(-1px);}
  .continue .c-ic{width:44px; height:44px; flex:0 0 auto; border-radius:15px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary-ink);}
  .continue .c-t{flex:1; min-width:0;}
  .continue b{display:block; font-size:15px;}
  .continue .t-meta{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-row{display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:4px 16px 8px; scroll-snap-type:x proximity;}
  .mini-row::-webkit-scrollbar{display:none;}
  .mini{flex:0 0 200px; scroll-snap-align:start; border:1px solid var(--line-2); padding:0; overflow:hidden; cursor:pointer;
    font:inherit; color:var(--ink); text-align:left; transition:transform .18s var(--ease);}
  .mini:hover{transform:translateY(-2px);}
  .mini .m-art{height:92px; display:grid; place-items:center; font-size:34px; position:relative; overflow:hidden;}
  .mini .m-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .mini .m-b{padding:10px 12px 12px;}
  .mini b{display:block; font-size:14px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .taste-card{display:flex; align-items:center; gap:14px; padding:16px; background:var(--grad-soft); border:1px solid rgba(106,76,240,.12);}
  .taste-card .tc-ic{width:48px; height:48px; flex:0 0 auto; border-radius:16px; display:grid; place-items:center; font-size:24px; background:#fff; box-shadow:var(--sh-1);}
  .taste-card .tc-t{flex:1; min-width:0;}
  .taste-card b{display:block; font-size:15px;}
  .taste-card p{margin:2px 0 0; font-size:13.5px; color:var(--ink-2);}

  /* ================= CHAT ================= */
  .thread{max-width:760px; margin:0 auto; padding:20px 16px 16px; display:flex; flex-direction:column; gap:14px;}
  .msg{display:flex; gap:10px; max-width:88%; animation:rise .35s var(--ease) both;}
  .msg .av{width:32px; height:32px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:var(--surface);
    border:1px solid var(--line-2); box-shadow:var(--sh-1);}
  .msg .av .logo-mark{width:18px; height:18px;}
  .bubble{padding:12px 16px; border-radius:22px; font-size:15px; line-height:1.5; overflow-wrap:anywhere;}
  .msg.bot .bubble{background:var(--surface); border:1px solid var(--line-2); border-top-left-radius:8px; box-shadow:var(--sh-1);}
  .msg.me{align-self:flex-end;}
  .msg.me .bubble{background:var(--ink); color:#fff; font-weight:600; border-top-right-radius:8px;}
  .msg.me .bubble .sub{display:block; margin-top:4px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.78);}
  .heard{align-self:flex-end; display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:6px; max-width:92%; margin-top:-6px;
    animation:rise .35s var(--ease) both;}
  .heard-l{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:750; color:var(--primary-ink);}
  .hchip{display:inline-flex; align-items:center; min-height:32px; padding:0 11px; border-radius:var(--r-pill); border:1px solid transparent;
    background:var(--primary-soft); color:var(--primary-ink); font-size:12.5px; font-weight:750; cursor:pointer;}
  .hchip:hover{border-color:rgba(106,76,240,.45);}
  .quick{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 2px 42px;}
  .wait .wait-row{display:flex; align-items:center; gap:10px;}
  .dots{display:inline-flex; gap:4px;}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--primary); opacity:.35; animation:bl 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);}}
  .wait-note{font-size:13.5px; color:var(--ink-2); font-weight:600;}
  .wait-late{margin:6px 0 0; font-size:12.5px; color:var(--ink-3);}
  .skel-plan{margin-top:12px; width:min(420px,62vw); display:flex; flex-direction:column; gap:10px;}
  .skel-row{display:flex; gap:10px; align-items:center;}
  .chat-notice{margin-left:42px; max-width:560px; animation:rise .35s var(--ease) both;}

  .composer{padding:8px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg);}
  .composer .row{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 18px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-pill); box-shadow:var(--sh-2);}
  .composer .row:focus-within{border-color:rgba(106,76,240,.5); box-shadow:0 0 0 4px rgba(106,76,240,.14), var(--sh-2);}
  .composer input{flex:1; min-width:0; min-height:44px; border:0; outline:none; background:none; font:inherit; font-size:15.5px; font-weight:550; color:var(--ink);}
  .composer input::placeholder{color:#8d8aa6;}
  body:not([data-view="chat"]) .composer{display:none;}
  body[data-view="chat"] .bnav{display:none;}

  /* ---- plan card: the centrepiece ---- */
  .plan{margin-left:42px; overflow:hidden; animation:rise .5s var(--ease) both;}
  .plan-head{padding:20px 20px 14px;}
  .plan-eyebrow{display:flex; align-items:center; gap:8px; color:var(--primary-ink);}
  .plan-eyebrow .t-label{color:var(--primary-ink);}
  .plan-title{margin:6px 0 12px; font-size:23px; font-weight:800; letter-spacing:-.03em; line-height:1.2;}
  .plan-stats{display:flex; flex-wrap:wrap; gap:6px;}
  .stat{display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 11px; border-radius:var(--r-pill);
    background:var(--surface-2); font-size:13px; font-weight:600; color:var(--ink-2);}
  .stat b{color:var(--ink); font-weight:800;}
  .stat .ic{color:var(--primary-ink);}
  .plan-map{height:190px; margin:0 14px; border-radius:20px; overflow:hidden; background:var(--surface-3); position:relative; z-index:0;}
  .tl{list-style:none; margin:0; padding:10px 14px 2px;}
  .tl-stop{display:grid; grid-template-columns:48px 1fr; gap:10px; position:relative; padding:8px 0;}
  .tl-stop:not(:last-child)::before{content:''; position:absolute; left:23px; top:60px; bottom:-8px; width:2px; border-radius:2px;
    background:linear-gradient(var(--primary-soft-2),rgba(226,217,255,.2));}
  .tl-rail{display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:4px;}
  .tl-ico{width:46px; height:46px; border-radius:16px; display:grid; place-items:center; font-size:22px; position:relative; z-index:1;}
  .tone-pink{background:var(--pink-soft);} .tone-sun{background:var(--sun-soft);} .tone-violet{background:var(--primary-soft);}
  .tone-mint{background:var(--mint-soft);} .tone-indigo{background:#e6e4ff;} .tone-peach{background:#ffe9d9;}
  .tl-time{font-size:11.5px; font-weight:800; color:var(--primary-ink); white-space:nowrap; background:var(--surface); position:relative; z-index:1; padding:1px 0;}
  .tl-card{display:flex; gap:12px; padding:12px 14px; border-radius:18px; background:var(--surface-2); min-width:0;}
  .tl-info{flex:1; min-width:0;}
  .tl-top{display:flex; align-items:baseline; gap:8px;}
  .tl-kicker{font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
  .tl-cost{margin-left:auto; font-size:14px; font-weight:800; white-space:nowrap;}
  .tl-cost small{font-size:11.5px; font-weight:650; color:var(--ink-3);}
  .tl-name{margin:3px 0 4px; font-size:16.5px; font-weight:750; letter-spacing:-.015em; line-height:1.3;}
  .tl-meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12.5px; color:var(--ink-3); font-weight:600;}
  .tl-addr{font-size:12.5px; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-why{margin:8px 0 0; font-size:13.5px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .tl-acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .tl-img{width:84px; height:84px; flex:0 0 auto; border-radius:14px; object-fit:cover; background:var(--surface-3);}
  @media (max-width:420px){ .tl-img{width:64px; height:64px;} }
  .fits{margin:8px 14px 0; padding:14px 16px; border-radius:18px; background:var(--grad-soft);}
  .fits ul{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:7px;}
  .fits li{display:flex; gap:9px; align-items:flex-start; font-size:14px; font-weight:600; color:var(--ink);}
  .fits li .ic{color:var(--mint-ink); margin-top:1px;}
  .fits li.warn .ic{color:var(--warning);}
  .plan-tip{display:flex; gap:10px; margin:10px 14px 0; padding:12px 14px; border-radius:16px; border:1px dashed var(--line); font-size:14px; color:var(--ink-2);}
  .plan-foot{display:flex; flex-wrap:wrap; gap:10px; padding:16px 14px 18px;}
  .plan-foot .btn{flex:1 1 140px;}
  .more{margin:-2px 0 4px 42px; animation:rise .45s var(--ease) both;}
  .more-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .num-marker{background:var(--grad); color:#fff; width:26px; height:26px; border-radius:50%; border:2px solid #fff;
    display:grid; place-items:center; font-weight:800; font-size:12.5px; box-shadow:0 3px 10px rgba(23,21,58,.35); font-family:var(--font);}
  .leaflet-container{background:var(--surface-3); font-family:var(--font);}
  .leaflet-control-attribution{font-size:10px;}

  /* ---- events (chat list + What's on) ---- */
  .evc{display:grid; grid-template-columns:92px 1fr; column-gap:14px; padding:12px; border-radius:var(--r-md); background:var(--surface);
    border:1px solid var(--line-2); box-shadow:var(--sh-1); animation:rise .4s var(--ease) both;}
  .evc-acts,.evc-src{grid-column:2;}
  .evc-art{position:relative; width:92px; height:92px; flex:0 0 auto; border-radius:16px; overflow:hidden; display:grid; place-items:center; font-size:34px;}
  .evc-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .evc-body{flex:1; min-width:0;}
  .evc-when{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; color:var(--primary-ink);}
  .evc-when.live{color:var(--danger);}
  .evc-name{margin:3px 0 3px; font-size:16px; font-weight:750; letter-spacing:-.01em; line-height:1.3;}
  .evc-meta{font-size:13px; color:var(--ink-3); font-weight:600;}
  .evc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .evc-tags:empty{display:none;}
  .evc-acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .evc-src{margin-top:8px; font-size:11.5px; color:var(--ink-3);}
  .evc-src:empty{display:none;}
  @media (max-width:560px){
    .evc{grid-template-columns:72px 1fr;} .evc-art{width:72px; height:72px; font-size:28px;}
    .evc-acts,.evc-src{grid-column:1 / -1;}
    .evc-acts .btn{flex:1 1 auto;} .evc-acts [data-plan]{flex-basis:100%;}
  }
  .evlist{display:flex; flex-direction:column; gap:10px; margin-left:42px; max-width:600px;}

  .seg{display:flex; padding:4px; gap:4px; border-radius:var(--r-pill); background:var(--surface-3);}
  .seg button{flex:1; min-height:40px; border:0; border-radius:var(--r-pill); background:none; cursor:pointer; font-size:14px;
    font-weight:700; color:var(--ink-2); transition:background-color .2s, color .2s, box-shadow .2s;}
  .seg button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh-1);}
  .ev-where{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin:12px 2px 0; font-size:13.5px; color:var(--ink-2); font-weight:600;}
  .ev-where .ic{color:var(--primary-ink);}
  .ev-where .link{padding:6px 0; font-size:13.5px;}
  .ev-filters{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:14px -16px 0; padding:2px 16px 4px;}
  .ev-filters::-webkit-scrollbar{display:none;}
  .ev-filters:empty{display:none;}
  .ev-summary{margin:16px 2px 10px;}
  .ev-items{display:flex; flex-direction:column; gap:10px;}
  .ev-note{margin:18px 2px 0; font-size:12.5px; color:var(--ink-3);}
  .skel-ev{display:flex; gap:14px; padding:12px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line-2);}

  /* ---- picker (build your own) ---- */
  .picker{margin-left:42px; animation:rise .45s var(--ease) both;}
  .psec{margin-bottom:18px;}
  .psec-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin-bottom:10px;}
  .psec-h b{font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .cards{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity;}
  .cards::-webkit-scrollbar{height:6px;} .cards::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  .ocard{flex:0 0 184px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--line-2); border-radius:20px;
    overflow:hidden; cursor:pointer; position:relative; box-shadow:var(--sh-1); transition:transform .18s var(--pop), box-shadow .2s, border-color .2s;}
  .ocard:hover{transform:translateY(-3px); box-shadow:var(--sh-2);}
  .ocard:active{transform:scale(.98);}
  .ocard.sel{border-color:transparent; box-shadow:0 0 0 3px var(--primary), var(--sh-2);}
  .ocard .ph{width:100%; height:96px; object-fit:cover; background:var(--grad-soft); display:block;}
  .ocard .noph{width:100%; height:96px; display:grid; place-items:center; font-size:30px; background:var(--grad-soft);}
  .ocard .bd{padding:10px 12px 12px;}
  .ocard .nm{font-weight:750; font-size:13.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .ocard .mt{font-size:12px; color:var(--ink-3); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-weight:600;}
  .ocard .tg{position:absolute; top:8px; left:8px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:var(--r-pill);
    background:rgba(255,255,255,.95); color:var(--ink); box-shadow:var(--sh-1);}
  .ocard .chk{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    background:rgba(255,255,255,.9); border:2px solid rgba(23,21,58,.12); color:transparent; transition:.15s;}
  .ocard.sel .chk{background:var(--primary); border-color:transparent; color:#fff;}
  .buildbar{position:sticky; bottom:0; padding:10px 0 4px; background:linear-gradient(to top,var(--bg) 70%,rgba(251,248,244,0));}

  /* ---- saved ---- */
  .saved-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px;}
  .scard{position:relative; display:flex; align-items:stretch; background:var(--surface); border:1px solid var(--line-2);
    border-radius:var(--r-md); box-shadow:var(--sh-1); overflow:hidden; transition:transform .18s var(--ease), box-shadow .2s; animation:rise .35s var(--ease) both;}
  .scard:hover{transform:translateY(-2px); box-shadow:var(--sh-2);}
  .scard-open{flex:1; min-width:0; display:flex; align-items:center; gap:14px; padding:12px 52px 12px 12px; border:0; background:none;
    cursor:pointer; text-align:left; font:inherit; color:var(--ink);}
  .scard-art{position:relative; width:84px; height:84px; flex:0 0 auto; border-radius:16px; overflow:hidden; display:grid; place-items:center; font-size:32px;}
  .scard-art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .scard-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .scard-body b{font-size:15.5px; font-weight:750; letter-spacing:-.01em; line-height:1.3;}
  .scard-tags{display:flex; gap:6px; margin-top:4px;}
  .scard-date{position:absolute; top:12px; right:12px; width:40px; padding:4px 0; border-radius:12px; background:var(--surface-2);
    text-align:center; line-height:1.1;}
  .scard-date small{display:block; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase;}
  .scard-date b{font-size:16px; font-weight:800;}
  .scard-del{position:absolute; right:10px; bottom:8px; width:38px; height:38px; color:var(--ink-3);}
  .scard-del:hover{color:var(--danger); background:var(--danger-soft);}

  /* ---- settings: bottom sheet on phones, persistent panel on desktop ---- */
  .rail{flex:0 0 0; width:0;}
  .sheet-sub{margin:0; padding:0 20px 4px; font-size:13.5px; color:var(--ink-3); font-weight:550;}
  .sec{padding:16px 0; border-bottom:1px solid var(--line-2); border-radius:14px;}
  .sec:last-child{border-bottom:0;}
  .sec h3{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:14.5px; font-weight:800;}
  .sec h3 .ic{color:var(--primary-ink);}
  .sec.hl{animation:sechl 1.4s var(--ease) 1;}
  @keyframes sechl{0%{background:var(--primary-soft);} 100%{background:transparent;}}
  .sec-body{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .sec .row{display:flex; align-items:center; gap:12px; flex-basis:100%; font-size:14px; color:var(--ink-2);}
  .sec .row b{min-width:56px; color:var(--ink); font-size:15px; font-weight:800;}
  .sec .hint{flex-basis:100%; font-size:12.5px; color:var(--ink-3); font-weight:550;}
  .sec .row .hint{flex-basis:auto;}
  .sec .need{flex-basis:100%; padding:10px 12px; border-radius:12px; background:var(--danger-soft); font-size:13.5px; font-weight:700; color:var(--danger);}
  .sec input[type=range]{flex:1; accent-color:var(--primary); min-height:44px;}
  .money{display:inline-flex; align-items:center; gap:2px; min-height:44px; border:1.5px solid var(--line); border-radius:var(--r-pill);
    padding:0 16px; background:var(--surface); font-weight:800; color:var(--ink);}
  .money:focus-within{border-color:var(--primary); box-shadow:0 0 0 4px rgba(106,76,240,.14);}
  .money input{border:0; width:92px; font:inherit; font-size:15px; padding:8px 2px; outline:none; background:transparent; color:var(--ink);}
  .stepper button{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    font-size:20px; font-weight:700; color:var(--ink); cursor:pointer;}
  .stepper button:hover{border-color:rgba(106,76,240,.5);}
  .stepper b{min-width:28px !important; text-align:center;}
  .switch-row{display:flex; align-items:center; gap:12px; flex-basis:100%; padding:12px 14px; border-radius:16px; background:var(--surface-2);}
  .switch-row > div{flex:1;}
  .switch-row b{font-size:14.5px; font-weight:750;} .switch-row small{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; font-weight:550;}
  .sec .field{flex-basis:100%; margin-top:6px;}
  #railPlan{display:none;}
  @media (max-width:560px){
    .plan,.more,.quick,.evlist,.picker,.chat-notice{margin-left:0;}
    .msg{max-width:94%;}
    .plan-head{padding:18px 16px 12px;} .plan-map{margin:0 10px;} .tl{padding:8px 10px 2px;}
    .fits,.plan-tip{margin-left:10px; margin-right:10px;} .plan-foot{padding:14px 10px 16px;}
    .tl-stop{grid-template-columns:44px 1fr; gap:8px;} .tl-stop:not(:last-child)::before{left:21px;}
    .tl-ico{width:42px; height:42px; font-size:20px; border-radius:14px;} .tl-card{padding:12px;}
  }

  @media (min-width:760px){
    .page{padding:28px 28px 40px;}
    .thread{padding:24px 28px 16px;}
    .home{max-width:800px; margin:0 auto; padding:24px 28px 8px;}
    .home-hero{border-radius:32px; padding:0 32px 108px;}
    .hero-bar{display:none;}
    .hero-copy{padding-top:36px;}
    .home-body{padding:0 20px 32px;}
    .act-row .act{min-height:120px;}
    .examples,.mini-row,.ev-filters{margin-left:0; margin-right:0; padding-left:0; padding-right:0;}
    .composer{padding:10px 28px 18px;}
  }
  @media (min-width:1120px){
    .rail{display:flex; flex-direction:column; width:380px; flex:0 0 380px; border-left:1px solid var(--line-2); background:var(--surface);}
    .rail .sheet{position:static; transform:none; animation:none; width:auto; left:auto; top:auto; max-height:none; height:100%;
      border-radius:0; box-shadow:none;}
    .rail .sheet-grab,.rail #sheetClose,.rail #sheetDone{display:none;}
    .rail .sheet-head{padding:22px 22px 4px;}
    .rail .sheet-sub{padding:0 22px 4px;}
    .rail .sheet-body{flex:1; padding:2px 22px 10px;}
    .rail .sheet-foot{padding:14px 22px 18px;}
    #railPlan{display:inline-flex;}
    .ctxbar{display:none !important;}
    .home .plan-around{display:none;}
    .home-body{margin-top:-64px;}
  }
</style>

<script>
const API = window.API_BASE;
const $ = id => document.getElementById(id);
// The planner is members-only: requires the account token from auth.html.
const token = () => localStorage.getItem('trek_token');
const authHeaders = () => token() ? { 'Authorization': 'Bearer ' + token() } : {};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const thread = $('thread'), chat = $('chat');
let messages = [];           // {role, content}
let userLoc = null;
let mapSeq = 0;
let maps = [];               // drawn route maps — re-fitted when the chat is shown again
let me = null;               // {display_name, username}
let lastUserEl = null;
let lastAskText = '';         // what the user last asked (for Home's "pick up where you left off")
let convoStart = 0;          // typed turns send only the messages since the last plan/events result
const seenVenues = new Set();   // venues already suggested — sent as `exclude` so re-rolls never repeat
const wideMq = matchMedia('(min-width:1120px)');
const wide = () => wideMq.matches;

/* ================= views: Home · Chat · What's on · Saved ================= */
const VIEWS = { home:'v-home', chat:'chat', events:'v-events', saved:'v-saved' };
const TITLES = { chat:['Roamly','AI outing planner'], events:["What's on",'Live events near you'], saved:['Saved plans','Kept on this device'] };
let view = null, chatScroll = 0;
function showView(v, o = {}){
  if (!VIEWS[v]) v = 'home';
  if (view === 'chat') chatScroll = chat.scrollTop;
  const prev = view; view = v;
  document.body.dataset.view = v;
  Object.entries(VIEWS).forEach(([k, id]) => { $(id).hidden = k !== v; });
  document.querySelectorAll('[data-nav]').forEach(b => {
    (b.dataset.nav === v || (v === 'chat' && b.dataset.nav === 'home')) ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  const t = TITLES[v];
  if (t){ $('topTitle').querySelector('b').textContent = t[0]; $('topTitle').querySelector('small').textContent = t[1]; }
  closeMenu(); $('toast').classList.remove('on');
  if (v === 'home') renderHome(prev === null);
  if (v === 'saved') renderSavedView();
  if (v === 'events') openEvents(o.window);
  if (v === 'chat') requestAnimationFrame(() => { chat.scrollTop = o.bottom ? chat.scrollHeight : chatScroll; refitMaps(); });
  else $(VIEWS[v]).scrollTop = 0;
  // Phone back button: Home ↔ everything else.
  if (!o.fromPop && prev !== null && prev !== v){
    if (v === 'home') history.replaceState({ v }, '');
    else if (prev === 'home') history.pushState({ v }, '');
    else history.replaceState({ v }, '');
  }
}
window.addEventListener('popstate', e => showView((e.state && e.state.v) || 'home', { fromPop:true }));
function goHome(){ (history.state && history.state.v && history.state.v !== 'home') ? history.back() : showView('home'); }

/* ---------- location: explicit on/off, shown in the Planning-around bar ---------- */
let locState = 'off';                     // off | busy | on | unsupported
function getLoc(){
  if (!navigator.geolocation){ locState = 'unsupported'; syncLoc(); return; }
  locState = 'busy'; syncLoc();
  navigator.geolocation.getCurrentPosition(
    p => { userLoc = {lat:p.coords.latitude, lng:p.coords.longitude}; locState = 'on'; needWhere = false; syncLoc();
           if (!sheetOpen || wide()) resumePending(); },
    () => { userLoc = null; locState = 'off'; syncLoc(); if (!sheetOpen) pending = null; },
    { enableHighAccuracy:true, timeout:10000, maximumAge:300000 }
  );
}
function toggleLoc(){
  if (userLoc || locState === 'busy'){ userLoc = null; locState = 'off'; syncLoc(); }   // off: stop sending it
  else getLoc();
}
function syncLoc(){
  if (!ready) return;
  renderCtx();
  if (sheetOpen) renderSection('location');
}
function locNote(){
  if (locState === 'on' && !ready.location) return `${ic('pin','sm')} Using your approximate current location`;
  if (locState === 'busy') return 'Finding your location…';
  if (ready.location) return `Planning around “${esc(ready.location)}” — your live location isn't being used`;
  if (locState === 'unsupported') return "This browser can't share location — set a place instead.";
  return `Your live location isn't being used. <button class="link" data-loc-on>Use my location</button> or <button class="link" data-set-place>set a place</button>`;
}

/* ---------- messages ---------- */
const AV_BOT = `<div class="av" aria-hidden="true"><svg class="logo-mark"><use href="#i-logo"/></svg></div>`;
function addMsg(role, html){
  const m = document.createElement('div');
  m.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
  m.innerHTML = role === 'user' ? `<div class="bubble">${html}</div>` : `${AV_BOT}<div class="bubble">${html}</div>`;
  thread.appendChild(m); scrollDown(role === 'user');
  if (role === 'user'){
    lastUserEl = m;
    const sub = m.querySelector('.sub');                // "✨ Plan my night — Date · Chill · $100…"
    lastAskText = sub ? `${m.querySelector('.bubble').firstChild.textContent.trim()} — ${sub.textContent}` : m.textContent.trim();
  }
  return m;
}
function addQuick(replies){
  if (!replies || !replies.length) return;
  const q = document.createElement('div'); q.className = 'quick';
  replies.forEach(r => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = r;
    b.onclick = () => { q.remove(); send(r); }; q.appendChild(b); });
  thread.appendChild(q); scrollDown();
}
function appendFoot(buttons){
  const q = document.createElement('div'); q.className = 'quick';
  buttons.forEach(b => { const el = document.createElement('button'); el.className = b.cls || 'chip';
    el.innerHTML = b.html || esc(b.label); el.onclick = b.onclick; q.appendChild(el); });
  thread.appendChild(q); scrollDown();
  return q;
}
function announce(text){ const sr = $('sr'); sr.textContent = ''; setTimeout(() => { sr.textContent = 'Roamly: ' + text; }, 60); }

/* Waiting feedback: status lines that describe what the planner is doing (no
   made-up progress counts), then an honest "taking longer" note. */
const WAIT = {
  chat:   ['Reading your request…', "Checking what's nearby…", 'Finding places that fit…', 'Putting everything together…'],
  plan:   ["Checking what's nearby…", 'Finding places that fit…', 'Putting everything together…'],
  pick:   ["Checking what's nearby…", 'Gathering the best spots…'],
  events: ["Checking what's on near you…"],
};
let waitTimers = [];
function typing(on, kind = 'chat'){
  let t = $('typing');
  if (on && !t){
    const lines = WAIT[kind] || WAIT.chat;
    const skel = kind === 'plan' ? `<div class="skel-plan skel-wrap" aria-hidden="true">
        ${[0,1,2].map(() => `<div class="skel-row"><div class="skel" style="width:36px;height:36px;border-radius:12px"></div>
          <div style="flex:1;display:grid;gap:6px"><div class="skel" style="height:11px;width:72%"></div><div class="skel" style="height:9px;width:45%"></div></div></div>`).join('')}
      </div>` : '';
    const m = document.createElement('div'); m.className = 'msg bot'; m.id = 'typing';
    m.innerHTML = `${AV_BOT}<div class="bubble wait"><div class="wait-row"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="wait-note" role="status">${esc(lines[0])}</span></div>${skel}</div>`;
    thread.appendChild(m); scrollDown();
    const note = m.querySelector('.wait-note'); let k = 1;
    waitTimers.push(setTimeout(function next(){
      if (k < lines.length){ note.textContent = lines[k++]; waitTimers.push(setTimeout(next, 2800)); }
    }, 2400));
    waitTimers.push(setTimeout(() => {
      const late = document.createElement('p'); late.className = 'wait-late';
      late.textContent = 'Taking longer than usual — venue search can be slow the first time in a new area.';
      m.querySelector('.bubble').appendChild(late); scrollDown();
    }, 15000));
  }
  else if (!on && t){ waitTimers.forEach(clearTimeout); waitTimers = []; t.remove(); }
}

/* Native error card. Your settings live in the bar, so nothing needs retyping —
   Retry re-runs exactly the same request (no duplicate message bubble). */
function addNotice({ kind = 'err', title, text, actions = [] }){
  const el = document.createElement('div'); el.className = 'chat-notice';
  el.innerHTML = `<div class="notice ${kind}"><span class="n-ic">${ic('alert')}</span><div><b>${esc(title)}</b><p>${esc(text)}</p>
    <div class="n-acts"></div></div></div>`;
  const acts = el.querySelector('.n-acts');
  actions.forEach(a => { const b = document.createElement('button');
    b.className = 'btn btn-sm ' + (a.primary ? 'btn-dark' : 'btn-ghost');
    b.innerHTML = (a.icon ? ic(a.icon, 'sm') + ' ' : '') + esc(a.label); b.onclick = () => a.onclick(el); acts.appendChild(b); });
  thread.appendChild(el); scrollDown();
  return el;
}
function retryAction(retry, kind){
  return { label:'Try again', icon:'refresh', primary:true, onclick: el => { el.remove(); typing(true, kind); retry(); } };
}
function failed(e, retry, kind = 'plan'){
  typing(false); busy = false;
  const slow = /too long/i.test((e && e.message) || '');
  addNotice({ title: slow ? 'Hmm — that took longer than usual' : "Couldn't reach Roamly",
    text: slow ? 'Venue search can be slow right now. Your settings are kept, so nothing needs retyping.'
               : 'Check your connection and try again. Your settings are kept.',
    actions: [retryAction(retry, kind), { label:'Adjust settings', icon:'sliders', onclick: () => openSheet() }] });
}
function offerRetry(retry){
  const q = appendFoot([
    { html:`${ic('refresh','sm')} Try again`, cls:'btn btn-dark btn-sm', onclick: () => { q.remove(); typing(true, 'plan'); retry(); } },
    { html:`${ic('sliders','sm')} Adjust settings`, cls:'btn btn-ghost btn-sm', onclick: () => openSheet() },
  ]);
}
/* Sticky autoscroll: follow new messages only while the user is at the bottom,
   so scrolling up to reread never gets yanked back down. */
let stickBottom = true;
chat.addEventListener('scroll', () => {
  stickBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 140;
});
function scrollDown(force){
  if (force) stickBottom = true;
  if (stickBottom) requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}
/* Streaming feel: type the assistant's reply in instead of dumping it at once. */
function addMsgTyped(text){
  const m = addMsg('assistant', '');
  const b = m.querySelector('.bubble');
  const chars = [...String(text)];
  const step = Math.max(1, Math.round(chars.length / 70));   // ~1.1s regardless of length
  let i = 0;
  (function tick(){
    i = Math.min(chars.length, i + step);
    b.textContent = chars.slice(0, i).join('');
    scrollDown();
    if (i < chars.length) setTimeout(tick, 16);
  })();
  return m;
}

let toastT;
function toast(msg, action){
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('on'); action.onclick(); };
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 5500 : 2600);
}

/* ================= plan card ================= */
// Links from third parties (OSM website tags, organizer-submitted listings) only
// get http(s) — a javascript: URL in an href would run code on tap.
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : null;
const USER_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ return null; } })();
const SLOT_TONE = { dinner:'pink', lunch:'pink', cafe:'sun', activity:'violet', scenic:'mint', leisure:'indigo', drinks:'indigo', dessert:'peach', event:'pink' };
const WHEN_TITLE = { morning:'Your day out', afternoon:'This afternoon', evening:"Tonight's plan", night:'Late-night plan' };
const VIBE_NAME = { chill:'Chill', romantic:'Romantic', adventurous:'Adventurous', extravagant:'Fancy', night_out:'Night-out' };
const VIBE_ART = {
  chill:       { emoji:'😌', bg:'linear-gradient(135deg,#d9f5e8,#dfe9ff)' },
  romantic:    { emoji:'🌹', bg:'linear-gradient(135deg,#ffe0ea,#ffe8d6)' },
  adventurous: { emoji:'🧗', bg:'linear-gradient(135deg,#fff0c7,#ffdcd0)' },
  extravagant: { emoji:'🥂', bg:'linear-gradient(135deg,#ece4ff,#ffdcec)' },
  night_out:   { emoji:'🎉', bg:'linear-gradient(135deg,#e2ddff,#f5d9ff)' },
};
const GROUP_TITLE = { date:'date', friends:'outing with friends', family:'family outing', solo:'solo outing' };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function planTitle(plan){
  const m = plan._meta || {};
  return `${(VIBE_ART[plan.vibe] || {}).emoji || '✨'} ${VIBE_NAME[plan.vibe] || 'Your'} ${GROUP_TITLE[m.group] || 'outing'}`;
}
/* What Roamly can honestly say about why this plan fits — every line is checked
   against the plan's own numbers, nothing is invented. */
function fitsFor(plan){
  const m = plan._meta || {}, out = [], pp = Math.max(1, plan.party_size || 1);
  const who = pp === 1 ? 'you' : `${pp}`;
  if (plan.budget){
    const over = plan.estimated_cost - plan.budget;
    out.push(over <= 0
      ? { ok:true, t:`~$${plan.estimated_cost} for ${who} — within your $${Math.round(plan.budget)} budget` }
      : { ok:false, t:`~$${plan.estimated_cost} for ${who} — about $${Math.round(over)} over your $${Math.round(plan.budget)} (estimates are rough)` });
  }
  if (plan.walk_km != null && plan.stops.length > 1)
    out.push({ ok:true, t: plan.walk_km < 0.4 ? 'Every stop is steps from the next' : `All stops within ~${plan.walk_km} km of each other` });
  if (m.interests){
    const hay = plan.stops.map(s => [s.name, ...(s.categories || [])].join(' ').toLowerCase()).join(' | ');
    const hit = m.interests.split(/[,;]/).map(w => w.trim()).filter(w => w && hay.includes(w.toLowerCase().replace(/s$/, '')));
    if (hit.length) out.push({ ok:true, t:`Includes what you asked for: ${hit.join(', ')}` });
  }
  if (plan.weather) out.push({ ok:true, t:`Weather checked — ${plan.weather}` });
  if (m.taste) out.push({ ok:true, t:'Tuned to your taste profile' });
  return out.slice(0, 4);
}

function stopHtml(s, i, pp){
  const tone = SLOT_TONE[s.slot] || 'violet';
  const cat = s.categories && s.categories[0] ? cap(String(s.categories[0]).replace(/_/g, ' ')) : '';
  const meta = [cat ? `<span>${esc(cat)}</span>` : '', s.price ? `<span>${esc(s.price)}</span>` : '',
                s.rating ? `<span class="tag star">★ ${esc(s.rating)}</span>` : ''].filter(Boolean).join('');
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name + ' ' + (s.address || ''))}`;
  const site = safeUrl(s.url);
  return `<li class="tl-stop">
    <div class="tl-rail"><span class="tl-ico tone-${tone}" aria-hidden="true">${esc(s.icon || '📍')}</span>${s.time ? `<span class="tl-time">${esc(s.time)}</span>` : ''}</div>
    <div class="tl-card">
      <div class="tl-info">
        <div class="tl-top"><span class="tl-kicker">${esc(s.label)}</span><span class="tl-cost">~$${esc(s.est_cost)}${pp > 1 ? '<small> each</small>' : ''}</span></div>
        <h4 class="tl-name">${esc(s.name)}</h4>
        ${meta ? `<div class="tl-meta">${meta}</div>` : ''}
        ${s.address ? `<div class="tl-addr">${esc(s.address)}</div>` : ''}
        ${s.why ? `<p class="tl-why">${esc(s.why)}</p>` : ''}
        <div class="tl-acts"><a class="btn btn-ghost btn-sm" href="${gmaps}" target="_blank" rel="noopener">${ic('nav','sm')} Directions</a>${
          site ? `<a class="btn btn-ghost btn-sm" href="${esc(site)}" target="_blank" rel="noopener">${s.source === 'yelp' ? 'Yelp' : 'Website'} ${ic('external','sm')}</a>` : ''}</div>
      </div>
      ${s.image && safeUrl(s.image) ? `<img class="tl-img" src="${esc(s.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    </div></li>`;
}

function appendPlanCard(plan, dayLabel, o = {}){
  plan.stops.forEach(s => seenVenues.add(s.name));   // never suggest these again
  const id = 'map' + (++mapSeq), pp = Math.max(1, plan.party_size || 1), m = plan._meta || {};
  const fits = fitsFor(plan);
  const el = document.createElement('article'); el.className = 'plan card';
  el.innerHTML = `
    <header class="plan-head">
      <div class="plan-eyebrow">${ic('sparkle','sm')}<span class="t-label">${esc(dayLabel || WHEN_TITLE[m.when] || 'Your plan')}</span></div>
      <h3 class="plan-title">${esc(planTitle(plan))}</h3>
      <div class="plan-stats">
        <span class="stat">${ic('wallet','sm')}<b>~$${esc(plan.estimated_cost)}</b>${pp > 1 ? ` for ${pp}` : ''}</span>
        <span class="stat">${ic('pin','sm')}<b>${plan.stops.length}</b> stop${plan.stops.length === 1 ? '' : 's'}</span>
        ${plan.walk_km ? `<span class="stat">${ic('route','sm')}<b>${esc(plan.walk_km)} km</b> route</span>` : ''}
      </div>
    </header>
    <div class="plan-map" id="${id}"></div>
    <ol class="tl">${plan.stops.map((s, i) => stopHtml(s, i, pp)).join('')}</ol>
    ${fits.length ? `<div class="fits"><span class="t-label">Why this fits</span><ul>${fits.map(f =>
      `<li class="${f.ok ? '' : 'warn'}">${ic(f.ok ? 'check' : 'alert','sm')}<span>${esc(f.t)}</span></li>`).join('')}</ul></div>` : ''}
    ${plan.tip ? `<div class="plan-tip"><span aria-hidden="true">💡</span><span>${esc(plan.tip)}</span></div>` : ''}
    ${o.foot === false ? '<div style="height:16px"></div>' : `<footer class="plan-foot">
      <button class="btn btn-dark" data-save>${ic('heart','sm')} Save plan</button>
      <button class="btn btn-ghost" data-again>${ic('refresh','sm')} Try another</button></footer>`}`;
  thread.appendChild(el);
  const save = el.querySelector('[data-save]');
  if (save) save.onclick = () => saveItin({ title: planTitle(plan), plan }, save);
  const again = el.querySelector('[data-again]');
  if (again) again.onclick = () => reroll();
  scrollDown(); setTimeout(() => drawMap(id, plan), 60);
  return el;
}

/* "Make it more…": each chip changes the shared planning state (the bar
   flashes) and re-plans from it — the same state a tap or a typed message sets. */
const round5 = n => Math.max(5, Math.round(n / 5) * 5);
const TWEAKS = [
  { label:'💵 Cheaper', show: () => ready.budget > 20,
    apply: () => { ready.budget = Math.max(20, round5(ready.budget * 0.65)); budgetTouched = true; }, say: () => `Cheaper — $${ready.budget} budget` },
  { label:'📍 Closer', show: () => ready.radius_km > RADIUS_MIN,
    apply: () => { ready.radius_km = clamp(Math.round(ready.radius_km) / 2 || RADIUS_MIN, RADIUS_MIN, RADIUS_MAX); radiusTouched = true; },
    say: () => `Closer — within ${fmtKm(ready.radius_km)}` },
  { label:'🥂 Fancier', show: () => ready.vibe !== 'extravagant',
    apply: () => { ready.vibe = 'extravagant'; ready.budget = Math.min(BUDGET_MAX, round5(Math.max(ready.budget * 1.5, ready.budget + 50))); budgetTouched = true; },
    say: () => `Fancier — $${ready.budget} budget` },
  { label:'😌 More relaxed', vibe:'chill' },
  { label:'🤠 More adventurous', vibe:'adventurous' },
  { label:'🌹 More romantic', vibe:'romantic' },
  { label:'🎉 More social', vibe:'night_out' },
];
let lastMore = null;
function appendMore(){
  if (lastMore) lastMore.remove();
  const el = document.createElement('div'); el.className = 'more';
  el.innerHTML = `<span class="t-label">Make it more…</span><div class="more-row"></div>`;
  const row = el.querySelector('.more-row');
  TWEAKS.filter(t => t.vibe ? ready.vibe !== t.vibe : t.show()).forEach(t => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = t.label;
    b.onclick = () => tweak(t); row.appendChild(b);
  });
  const s = document.createElement('button'); s.className = 'chip'; s.textContent = '🎲 Surprise me';
  s.onclick = () => planIt({ surprise:true }); row.appendChild(s);
  thread.appendChild(el); lastMore = el; scrollDown();
}
function tweak(t){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  if (t.vibe) ready.vibe = t.vibe; else t.apply();
  edited = true; if (wide()) renderSheet(); renderCtx();
  const said = t.vibe ? `${t.label.slice(t.label.indexOf(' ') + 1)}` : t.say();
  addMsg('user', `${esc(t.label.split(' ')[0])} ${esc(said)}<span class="sub">${esc(readySummary())}</span>`);
  typing(true, 'plan');
  const prev = lastItin && lastItin.plan ? lastItin.plan.stops.map(x => x.name).sort().join('|') : null;
  runPlan(readyPrefs(), { keepVenues:true, prev });   // new constraints → new picks; no need to ban the old ones
}
function reroll(){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  if (!userLoc && !ready.location){ needLocation(reroll); return; }
  addMsg('user', `🔄 Try another<span class="sub">${esc(readySummary())}</span>`);
  typing(true, 'plan');
  runPlan(readyPrefs(), {});
}

function renderPlan(plan, o = {}){
  appendPlanCard({ ...plan, events: [] });   // events come as a question, not a strip
  lastItin = { title: planTitle(plan), plan };
  if (o.saved){ if (lastMore){ lastMore.remove(); lastMore = null; } return; }
  appendMore();
  suggestEvents(plan);
}

/* ---------- event opt-in: suggest what's on nearby, add only on a "yes" ---------- */
function evWhen(ev){
  const parts = [];
  if (ev.date){ const d = new Date(ev.date + 'T00:00'); parts.push(d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'})); }
  if (ev.time) parts.push(ev.time.slice(0, 5));
  return parts.join(' · ');
}
function suggestEvents(plan, idx = 0){
  const evs = plan.events || [];
  if (idx >= evs.length || idx >= 2) return;         // suggest at most two
  const ev = evs[idx];
  const when = evWhen(ev);
  const price = ev.free ? ' It\'s free.' : ev.price_min
    ? ` Tickets run $${Math.round(ev.price_min)}${ev.price_max && ev.price_max !== ev.price_min ? `–$${Math.round(ev.price_max)}` : '+'}.`
    : ` The organizer hasn't published pricing — the tickets page has current prices.`;
  addMsg('assistant', esc(`One more thing — ${ev.name}${ev.venue ? ` at ${ev.venue}` : ''}${when ? `, ${when}` : ''} is on nearby.${price} Want me to add it to your plan?`));
  const q = document.createElement('div'); q.className = 'quick';
  const yes = document.createElement('button'); yes.className = 'chip'; yes.textContent = '🎟️ Yes, add it';
  const no  = document.createElement('button'); no.className = 'chip'; no.textContent = '🙅 No thanks';
  const link = safeUrl(ev.url);
  if (link){
    const tix = document.createElement('button'); tix.className = 'chip'; tix.textContent = '🎫 Check price & tickets';
    tix.onclick = () => window.open(link, '_blank', 'noopener');
    q.appendChild(tix);
  }
  const done = took => {
    q.remove();
    if (took){
      addEventToPlan(plan, ev);
      addMsg('assistant', esc(`Done — ${ev.name} is in. Here's the updated plan:`));
      appendPlanCard({ ...plan, events: [] });
      lastItin = { title: planTitle(plan), plan };
      appendMore();
    } else {
      addMsg('assistant', idx + 1 < Math.min(evs.length, 2) ? 'No problem.' : 'No problem — the plan stays as is.');
      suggestEvents(plan, idx + 1);                  // offer the next one
    }
  };
  yes.onclick = () => done(true); no.onclick = () => done(false);
  q.appendChild(yes); q.appendChild(no); thread.appendChild(q); scrollDown();
}

function addEventToPlan(plan, ev){
  const cost = ev.free ? 0 : Math.round(ev.price_min || 40);
  plan.stops.push({
    slot:'event', label:'Live event', icon:'🎟️',
    name: ev.name, lat: ev.lat, lng: ev.lng,
    rating: null, price: null,
    address: ev.venue || null, image: ev.image || null,
    url: safeUrl(ev.url), source: ev.source || 'ticketmaster',
    est_cost: cost, categories: [ev.category].filter(Boolean),
    time: ev.time ? ev.time.slice(0, 5) : null,
    why: `${ev.free ? 'Free ' : 'Live '}${ev.category ? ev.category.split(',')[0].toLowerCase() : 'event'}${evWhen(ev) ? ' · ' + evWhen(ev) : ''} — locked in.`,
  });
  plan.estimated_cost = (plan.estimated_cost || 0) + cost * Math.max(1, plan.party_size || 1);
  plan.events = (plan.events || []).filter(e => e !== ev);   // no longer just "nearby" — it's in the plan
}

function renderTrip(days, title, o = {}){
  days.forEach(d => appendPlanCard(d, `Day ${d.day} — ~$${d.estimated_cost}`, { foot:false }));
  lastItin = { title: title || 'Your trip', days };
  if (lastMore){ lastMore.remove(); lastMore = null; }
  const it = lastItin;
  const q = appendFoot([
    { html:`${ic('heart','sm')} Save trip`, cls:'btn btn-dark btn-sm', onclick: e => saveItin(it, e.currentTarget) },
    ...(o.saved ? [] : [{ html:`${ic('refresh','sm')} Try another`, cls:'btn btn-ghost btn-sm', onclick: () => send('plan a different trip') }]),
  ]);
  return q;
}

/* ---------- saving (localStorage, no account needed) ---------- */
const SAVED_KEY = 'wander_saved';
let lastItin = null;
function getSaved(){ try{ return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; }catch(e){ return []; } }
function setSaved(a){ localStorage.setItem(SAVED_KEY, JSON.stringify(a)); syncSavedCount(); }
function syncSavedCount(){
  const n = getSaved().length;
  document.querySelectorAll('[data-saved-count]').forEach(el => { el.textContent = n || ''; el.dataset.n = n; });
}
function saveItin(itin, btn){
  if (!itin || (btn && btn.classList.contains('done'))) return;
  const a = getSaved();
  a.unshift({ id:Date.now(), title:itin.title, ts:new Date().toISOString(), plan:itin.plan || null, days:itin.days || null });
  setSaved(a);
  if (btn){ btn.classList.add('done'); btn.innerHTML = `${ic('check','sm')} Saved`; }
  toast('Saved to your plans', { label:'View', onclick: () => showView('saved') });
}
function savedArt(it){
  const plan = it.plan || (it.days && it.days[0]) || { stops: [] };
  const img = ((plan.stops || []).find(s => s.image && safeUrl(s.image)) || {}).image;
  const art = it.days ? { emoji:'🧳', bg:'linear-gradient(135deg,#dff1ff,#e9e2ff)' } : (VIBE_ART[plan.vibe] || VIBE_ART.chill);
  return `<span class="scard-art" style="background:${art.bg}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span aria-hidden="true">${art.emoji}</span></span>`;
}
function savedSub(it){
  const plan = it.plan || (it.days && it.days[0]) || {};
  const n = it.days ? it.days.reduce((s, d) => s + d.stops.length, 0) : (it.plan ? it.plan.stops.length : 0);
  const cost = it.days ? it.days.reduce((s, d) => s + (d.estimated_cost || 0), 0) : (it.plan ? it.plan.estimated_cost : 0);
  const where = plan._meta && plan._meta.where;
  return [it.days ? `${it.days.length}-day trip` : null, `${n} stop${n === 1 ? '' : 's'}`, cost ? `~$${cost}` : null, where].filter(Boolean).join(' · ');
}
function renderSavedView(){
  const a = getSaved(), el = $('v-saved');
  el.innerHTML = `<div class="page">
    <header class="page-head"><div><h1 class="t-title" id="savedTitle">Saved plans</h1>
      <p class="t-meta">${a.length ? `${a.length} plan${a.length === 1 ? '' : 's'} · kept on this device` : 'Kept on this device'}</p></div>${AVATAR_BTN()}</header>
    ${a.length ? `<div class="saved-grid">${a.map(it => {
      const d = new Date(it.ts);
      return `<article class="scard">
        <button class="scard-open" data-open="${it.id}">${savedArt(it)}
          <span class="scard-body"><b>${esc(it.title)}</b><span class="t-meta">${esc(savedSub(it))}</span>
            ${(it.plan && VIBE_NAME[it.plan.vibe]) ? `<span class="scard-tags"><span class="tag violet">${esc(VIBE_NAME[it.plan.vibe])}</span></span>` : ''}</span></button>
        <span class="scard-date" aria-hidden="true"><small>${esc(d.toLocaleDateString(undefined, { month:'short' }))}</small><b>${d.getDate()}</b></span>
        <button class="icon-btn plain scard-del" data-del="${it.id}" aria-label="Delete ${esc(it.title)}">${ic('trash')}</button>
      </article>`; }).join('')}</div>`
    : `<div class="empty"><div class="e-art" aria-hidden="true">🔖</div><h3>No saved plans yet</h3>
        <p>Make a plan you like, then tap “Save plan” — it'll wait for you here.</p>
        <button class="btn btn-primary" data-empty-plan>${ic('sparkle','sm')} Plan my night</button></div>`}
  </div>`;
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => loadSaved(+b.dataset.open));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteSaved(+b.dataset.del));
  const ep = el.querySelector('[data-empty-plan]'); if (ep) ep.onclick = () => planIt();
}
function deleteSaved(id){
  const a = getSaved(), idx = a.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [gone] = a.splice(idx, 1); setSaved(a);
  if (view === 'saved') renderSavedView();
  toast('Plan deleted', { label:'Undo', onclick: () => { const b = getSaved(); b.splice(Math.min(idx, b.length), 0, gone); setSaved(b);
    if (view === 'saved') renderSavedView(); } });
}
function loadSaved(id){
  const it = getSaved().find(x => x.id === id); if (!it) return;
  showView('chat', { bottom:true });
  const d = new Date(it.ts).toLocaleDateString(undefined, { month:'short', day:'numeric' });
  addMsg('assistant', `📌 <b>${esc(it.title)}</b> — saved ${esc(d)}`);
  if (it.days) renderTrip(it.days, it.title, { saved:true }); else if (it.plan) renderPlan(it.plan, { saved:true });
}

function drawMap(id, plan){
  // Static route thumbnail — no dragging/zooming, so scrolling the chat never gets
  // captured by the map. OpenStreetMap tiles are free but require the credit.
  const box = $(id); if (!box || !window.L) return;
  const map = L.map(id, { zoomControl:false, scrollWheelZoom:false,
    dragging:false, touchZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false, tap:false });
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  const pts = plan.stops.map(s => [s.lat, s.lng]);
  plan.stops.forEach((s, i) => L.marker([s.lat, s.lng], { icon:L.divIcon({ className:'', html:`<div class="num-marker">${i + 1}</div>`, iconSize:[26,26], iconAnchor:[13,13] }) }).addTo(map));
  if (pts.length > 1) L.polyline(pts, { color:'#6a4cf0', weight:3, opacity:.6, dashArray:'2 7', lineCap:'round' }).addTo(map);
  map.fitBounds(L.latLngBounds(pts).pad(0.35));
  maps.push({ map, pts });
}
function refitMaps(){        // maps drawn while the chat was hidden have no size yet
  maps = maps.filter(m => m.map.getContainer().isConnected);
  maps.forEach(m => { m.map.invalidateSize(); m.map.fitBounds(L.latLngBounds(m.pts).pad(0.35)); });
}

/* ================= picker (build your own itinerary) ================= */
let picker = null;
const SECTION_LIMIT = { activity:2, cafe:1, lunch:1, dinner:1, leisure:1, dessert:1, events:1 };
const SEC_EMOJI = { activity:'🎡', cafe:'☕', lunch:'🥗', dinner:'🍽️', leisure:'🎶', dessert:'🍰', events:'🎟️' };
const oid = (sec, name) => sec + '::' + name;

function eventToOption(ev){
  const when = [ev.date, (ev.time || '').slice(0, 5)].filter(Boolean).join(' ');
  return { slot:'event', name:ev.name, lat:ev.lat, lng:ev.lng, categories:[ev.category].filter(Boolean),
    address:ev.venue, image:ev.image, url:safeUrl(ev.url), source:ev.source || 'ticketmaster',
    est_cost: ev.free ? 0 : ev.price_min ? Math.round(ev.price_min) : 40, arousal:3.5, tag:'🎟️', tag_label:when };
}
function optionCard(secKey, o){
  const id = oid(secKey, o.name), emoji = SEC_EMOJI[secKey] || '📍';
  const el = document.createElement('div'); el.className = 'ocard';
  el.setAttribute('role', 'button'); el.tabIndex = 0; el.setAttribute('aria-pressed', 'false');
  el.innerHTML = `${o.image && safeUrl(o.image) ? '<img class="ph" alt="">' : `<div class="noph" aria-hidden="true">${emoji}</div>`}
    ${o.tag ? `<span class="tg">${esc(o.tag)} ${esc(o.tag_label || '')}</span>` : ''}
    <span class="chk" aria-hidden="true">${ic('check','sm')}</span>
    <div class="bd"><div class="nm">${esc(o.name)}</div>
      <div class="mt">${o.rating ? `<span>★ ${esc(o.rating)}</span>` : ''}${o.price ? `<span>${esc(o.price)}</span>` : ''}<span>~$${esc(o.est_cost)}</span></div></div>`;
  if (o.image && safeUrl(o.image)){ const img = el.querySelector('img'); img.src = o.image; img.onerror = () => { img.outerHTML = `<div class="noph" aria-hidden="true">${emoji}</div>`; }; }
  picker.els.set(id, el);
  el.onclick = () => toggleSelect(secKey, id, o, el);
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } };
  return el;
}
function toggleSelect(secKey, id, o, el){
  if (picker.sel.has(id)){ picker.sel.delete(id); el.classList.remove('sel'); el.setAttribute('aria-pressed', 'false'); }
  else {
    const inSec = [...picker.sel.keys()].filter(k => k.startsWith(secKey + '::'));
    if (inSec.length >= (SECTION_LIMIT[secKey] || 1)){
      const drop = inSec[0]; picker.sel.delete(drop);
      const de = picker.els.get(drop); if (de){ de.classList.remove('sel'); de.setAttribute('aria-pressed', 'false'); }
    }
    picker.sel.set(id, { ...o, slot: secKey === 'events' ? 'event' : (o.slot || secKey) });
    el.classList.add('sel'); el.setAttribute('aria-pressed', 'true');
  }
  updateBuildBar();
}
function updateBuildBar(){
  const sels = [...picker.sel.values()], ppl = picker.ctx.party_size || 2;
  const total = sels.reduce((s, o) => s + (o.est_cost || 0), 0) * ppl;
  picker.bar.disabled = !sels.length;
  picker.bar.textContent = sels.length
    ? `Build my itinerary · ~$${total} · ${sels.length} spot${sels.length > 1 ? 's' : ''}`
    : 'Pick a few spots to build';
}
function renderPicker(data){
  picker = { ctx:data.context || {}, loc:data.location || {}, sel:new Map(), els:new Map(), bar:null };
  const wrap = document.createElement('div'); wrap.className = 'picker';
  const sections = (data.sections || []).slice();
  if (data.events && data.events.length)
    sections.push({ key:'events', label:'Live events', icon:'🎟️', hint:'optional', options: data.events.map(eventToOption) });
  sections.forEach(sec => {
    const secEl = document.createElement('div'); secEl.className = 'psec';
    secEl.innerHTML = `<div class="psec-h"><b>${esc(sec.icon)} ${esc(sec.label)}</b><span class="t-meta">${esc(sec.hint)}</span></div>`;
    const row = document.createElement('div'); row.className = 'cards';
    sec.options.forEach(o => row.appendChild(optionCard(sec.key, o)));
    secEl.appendChild(row); wrap.appendChild(secEl);
  });
  const barWrap = document.createElement('div'); barWrap.className = 'buildbar';
  barWrap.innerHTML = `<button class="btn btn-primary btn-lg btn-block" disabled>Pick a few spots to build</button>`;
  picker.bar = barWrap.querySelector('button');
  picker.bar.onclick = buildItinerary;
  wrap.appendChild(barWrap);
  thread.appendChild(wrap); scrollDown();
}
async function buildItinerary(){
  const sels = [...picker.sel.values()]; if (!sels.length) return;
  const c = picker.ctx, loc = picker.loc;
  picker.bar.disabled = true; picker.bar.textContent = 'Building…';
  try{
    const res = await apiFetch(`${API}/plan/build`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ selections:sels, lat:loc.lat, lng:loc.lng, party_size:c.party_size || 2,
        budget:c.budget || 0, vibe:c.vibe || 'romantic', interests:c.interests || '', group_type:c.group_type || null,
        time_of_day:c.time_of_day || null, dietary:c.dietary || '' }) }).then(r => r.json());
    if (res.type === 'itinerary' && res.plan){
      addMsg('assistant', esc(res.message || "Here's your itinerary:"));
      res.plan._meta = metaNow(); renderPlan(res.plan);
    }
    else addMsg('assistant', esc(res.message || 'Could not build that.'));
  }catch(e){ addNotice({ title:"Couldn't build that just now", text:'Your picks are still selected — try again.', actions:[] }); }
  finally{ updateBuildBar(); }
}
async function fetchOptions(prefs){
  busy = true;
  try{
    const r = await apiFetch(`${API}/plan/options`, {
      method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages:[], prefs, lat:userLoc && userLoc.lat, lng:userLoc && userLoc.lng })
    });
    if (r.status === 401){ typing(false); requireSignIn(); return; }
    const res = await r.json();
    typing(false);
    if (!res.ok){ addMsg('assistant', esc(res.message || "Turn on location or name a city, and I'll pull spots near you.")); return; }
    addMsg('assistant', "Here are the best spots near you — tap the ones you're feeling, then build your itinerary. ✨");
    renderPicker(res);
  }catch(e){ failed(e, () => fetchOptions(prefs), 'pick'); }
  finally{ busy = false; }
}

function requireSignIn(){
  // Session expired mid-chat — a soft inline nudge (not a hard redirect) so the
  // conversation already on screen isn't lost.
  typing(false);
  if (view !== 'chat') showView('chat', { bottom:true });
  addMsg('assistant', "Looks like you got signed out — sign back in and I'll pick up right where we left off.");
  appendFoot([{ html:`Sign in again`, cls:'btn btn-dark btn-sm', onclick:() => { localStorage.removeItem('trek_token'); location.href = 'auth.html?redirect=roamly.html'; } }]);
}

/* ================= chat: typed requests ================= */
function send(text, display, o = {}){
  text = (text || '').trim(); if (!text) return;
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last one.'); return; }
  if (view !== 'chat') showView('chat', { bottom:true });
  $('input').value = ''; const ask = $('askInput'); if (ask) ask.value = '';
  addMsg('user', esc(display || text));
  messages.push({ role:'user', content:text });
  typing(true, 'chat');
  requestChat(o);
}
async function requestChat(o = {}){
  busy = true; $('send').disabled = true;
  const again = () => requestChat(o);
  try{
    const r = await apiFetch(`${API}/plan/chat`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages: messages.slice(convoStart), lat:userLoc && userLoc.lat, lng:userLoc && userLoc.lng, tz: USER_TZ,
        defaults: readyPrefs(),                        // the bar fills whatever the message doesn't say
        exclude:[...seenVenues], seed: Math.floor(Math.random() * 1e9), surprise: !!o.surprise }) });
    if (r.status === 401){ typing(false); requireSignIn(); return; }
    const res = await r.json();
    busy = false;
    showChatResponse(res, again, { typed:true });
  }catch(e){ failed(e, again, 'chat'); }
  finally{ busy = false; $('send').disabled = false; if (view === 'chat' && matchMedia('(hover:hover)').matches) $('input').focus(); }
}

function metaNow(){
  return { when: ready.time_of_day, group: ready.group_type, where: ready.location || (userLoc ? 'Near you' : ''),
           interests: ready.interests || '', taste: !!(profile && profile.completed) };
}
function showChatResponse(res, retry, o = {}){
  typing(false);
  applyUnderstood(res.understood, o.typed);           // the bar mirrors what Roamly took from this
  const bot = res.message || '…';
  addMsgTyped(bot); messages.push({ role:'assistant', content:bot }); announce(bot);
  if (res.type === 'itinerary' || res.type === 'events') convoStart = messages.length;   // a result closes the turn
  if (res.type === 'itinerary' && res.days && res.days.length) renderTrip(res.days, res.title);
  else if (res.type === 'itinerary' && res.plan){
    res.plan._meta = metaNow(); renderPlan(res.plan);
    if (o.prev && res.plan.stops.map(x => x.name).sort().join('|') === o.prev)
      addMsg('assistant', esc('Same spots came out on top — they\'re already the best fit nearby. Prices are typical estimates, so try a different mood or a wider radius for new picks.'));
  }
  else if (res.type === 'events') renderEventsInline(res);                  // what's happening
  else if (retry && /overloaded|too slow|took too long/i.test(bot)) offerRetry(retry);   // venue search struggling
  else if (/^Tell me where/i.test(bot) && retry){                          // no place yet — ask, then carry on
    const q = appendFoot([{ html:`${ic('pin','sm')} Set a place`, cls:'btn btn-dark btn-sm',
      onclick: () => needLocation(() => { q.remove(); if (view !== 'chat') showView('chat'); typing(true, 'chat'); retry(); }) }]);
  }
  else addQuick(res.quick_replies);                                        // follow-up question
}

/* ================= planning state: the single source of truth ================= */
// Stable traits come from the taste profile (profile.html); the bar/sheet hold what
// is different *this time*. Every tap, every typed message (via the server's
// `understood`) and every "make it more" writes here, and every plan reads from here.
const READY = {
  group_type: { options:[['solo','🧍 Solo'],['date','💘 Date'],['friends','🎉 Friends'],['family','👨‍👩‍👧 Family']] },
  vibe:       { options:[['chill','😌 Chill'],['romantic','🌹 Romantic'],['adventurous','🤠 Adventurous'],['extravagant','🥂 Fancy'],['night_out','🎊 Night out']] },
  budget:     { options:[[50,'$50'],[100,'$100'],[200,'$200'],[500,'$500']] },
  time_of_day:{ options:[['morning','☀️ Full day'],['afternoon','🌤️ Afternoon'],['evening','🌆 Tonight'],['night','🌙 Late night']] },
  transport:  { options:[['walk','🚶 Walk'],['transit','🚇 Transit'],['car','🚗 Car']] },
};
const PARTY = { solo:1, date:2, friends:4, family:4 };
// Radius slider: 1-20 km; each mode of transport has a sensible starting reach.
const RADIUS_MIN = 1, RADIUS_MAX = 20;
const TRANSPORT_KM = { walk:2, transit:7, car:15 };
const BUDGET_MAX = 10000, PARTY_MAX = 20;
const SECTION = { location:['pin','Where'], radius_km:['radius','How far'], budget:['wallet','Budget'], time_of_day:['clock','When'],
                  group_type:['users','Who'], vibe:['sparkle','Mood'], transport:['route','Getting there'], interests:['search','Looking for'] };
const CTX_ORDER = ['location','radius_km','budget','time_of_day','group_type','vibe','transport','interests'];
const PLAIN = {
  time_of_day:{ morning:'Full day', afternoon:'Afternoon', evening:'Tonight', night:'Late night' },
  group_type:{ solo:'Solo', date:'Date', friends:'Friends', family:'Family' },
  vibe:{ chill:'Chill', romantic:'Romantic', adventurous:'Adventurous', extravagant:'Fancy', night_out:'Night out' },
  transport:{ walk:'Walking', transit:'Transit', car:'Driving' },
};
let profile = null, ready = null, budgetTouched = false, radiusTouched = false, sheetOpen = false, busy = false,
    needWhere = false, edited = false, pending = null;
let shownLabels = {};
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const fmtKm = km => (Math.round(km * 10) / 10) + ' km';

function ctxText(key){
  const v = ready[key];
  if (key === 'location'){
    if (v) return v;
    return { on:'Near you', busy:'Finding you…', unsupported:'Set a place' }[locState] || 'Set location';
  }
  if (key === 'budget') return `$${Math.round(v).toLocaleString()}`;
  if (key === 'radius_km') return fmtKm(v);
  if (key === 'interests') return v || '';
  const base = (PLAIN[key] || {})[v] || 'Any';
  // show the head-count once it's a group, or whenever it isn't the crew's usual size
  if (key === 'group_type' && (ready.party_size > 2 || ready.party_size !== (PARTY[v] || 2))) return `${base} · ${ready.party_size}`;
  return base;
}
function readySummary(){
  return ['group_type','vibe','budget','time_of_day','radius_km','interests','location']
    .filter(k => k !== 'interests' || ready.interests).filter(k => k !== 'location' || ready.location)
    .map(ctxText).join(' · ');
}

/* Settings start from the taste profile when there is one. */
function defaultsFrom(p){
  const d = (p && p.defaults) || {};
  const st = { group_type: d.group_type || 'date', vibe: d.vibe || 'chill', time_of_day: d.time_of_day || 'evening',
               transport: d.transport || 'transit', location: '', interests: '' };
  st.party_size = d.party_size || PARTY[st.group_type] || 2;
  st.budget = Math.round(d.budget || 100);
  st.radius_km = clamp(d.radius_km || TRANSPORT_KM[st.transport] || 7, RADIUS_MIN, RADIUS_MAX);
  return st;
}
function startHome(p){
  profile = p;
  ready = defaultsFrom(p);
  applyWide();
  renderCtx();
}

/* The "Planning around" chips: what Roamly is working with, rendered into every
   [data-ctx] box (home card, chat bar) from the same state. A chip whose value
   changed flashes once so the change is visible. */
function renderCtx(){
  if (!ready) return;
  const keys = CTX_ORDER.filter(k => k !== 'interests' || ready.interests);
  const labels = {}; keys.forEach(k => labels[k] = ctxText(k));
  const changed = new Set(keys.filter(k => shownLabels[k] !== undefined && shownLabels[k] !== labels[k]));
  const need = needWhere && !ready.location && !userLoc;
  document.querySelectorAll('[data-ctx]').forEach(box => {
    box.innerHTML = keys.map(k => `<button class="cx${changed.has(k) ? ' flash' : ''}${k === 'location' && need ? ' need' : ''}" data-k="${k}"
      aria-label="${esc(SECTION[k][1])}: ${esc(labels[k])}. Change">${ic(SECTION[k][0], 'sm')}<span>${esc(labels[k])}</span></button>`).join('');
    box.querySelectorAll('.cx').forEach(b => b.onclick = () => openSheet(b.dataset.k));
  });
  shownLabels = labels;
  document.querySelectorAll('[data-locnote]').forEach(el => {
    el.innerHTML = locNote();
    const on = el.querySelector('[data-loc-on]'); if (on) on.onclick = () => getLoc();
    const sp = el.querySelector('[data-set-place]'); if (sp) sp.onclick = () => openSheet('location');
  });
  if (wide() && changed.size && sheetOpen) changed.forEach(k => flashSec($('sec-' + k)));
  if (view === 'events') queueEventsRefresh();
}
function updateCtxChip(k){      // live text while dragging/typing — no flash, no re-render
  document.querySelectorAll(`[data-ctx] .cx[data-k="${k}"] span`).forEach(s => { s.textContent = ctxText(k); });
  shownLabels[k] = ctxText(k);
}

/* Budget stays a per-person spend when the crew size changes — unless the

function rescaleBudget(){

function chipsFor(key, box, after){

function renderSection(k){

/* Settings Roamly understood from a typed message ("cheap sushi date in Kensington")
   become the bar's values — the changed chips flash, and a "Roamly heard" strip
   under the message shows exactly what was picked up (tap one to correct it). */
function applyUnderstood(u, showHeard){
  if (!u || !ready) return;
  const before = {}; CTX_ORDER.forEach(k => before[k] = ctxText(k));
  ['group_type','vibe','time_of_day','transport'].forEach(k => { if (u[k]) ready[k] = u[k]; });
  if (u.party_size) ready.party_size = clamp(u.party_size, 1, PARTY_MAX);
  if (u.budget){ ready.budget = Math.round(u.budget); budgetTouched = true; }
  if (u.radius_km){ ready.radius_km = clamp(u.radius_km, RADIUS_MIN, RADIUS_MAX); radiusTouched = true; }
  if (u.location){ ready.location = u.location; needWhere = false; }
  if (typeof u.interests === 'string') ready.interests = u.interests;
  if (wide()) renderSheet();
  renderCtx();
  if (showHeard){
    const changed = CTX_ORDER.filter(k => ctxText(k) && ctxText(k) !== before[k]);
    if (changed.length) addHeard(changed);
  }
}
function addHeard(keys){
  const el = document.createElement('div'); el.className = 'heard';
  el.innerHTML = `<span class="heard-l">${ic('sparkle','sm')} Roamly heard</span>` + keys.map(k =>
    `<button class="hchip" data-k="${k}" aria-label="${esc(SECTION[k][1])}: ${esc(ctxText(k))}. Change">${esc(ctxText(k))}</button>`).join('');
  el.querySelectorAll('.hchip').forEach(b => b.onclick = () => openSheet(b.dataset.k));
  if (lastUserEl && lastUserEl.isConnected) lastUserEl.after(el); else thread.appendChild(el);
}

function readyPrefs(){
