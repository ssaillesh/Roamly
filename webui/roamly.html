  let html = '';
  if (feed.search){
    html += `<div class="lh"><div class="lh-row"><span class="kicker acc">Results</span><button class="link" data-clear-search>Back to ${esc(WINDOW_TEXT[feed.win])}</button></div>
      <h2>${esc(feed.search.q)}</h2></div>`;
  } else {
    const n = vis.length, nEv = vis.filter(i => i.type === 'event').length;
    const what = nEv === n ? (n === 1 ? 'thing on' : 'things on') : nEv ? 'open or on' : (n === 1 ? 'place open' : 'places open');
    const title = loading ? 'Looking around…' : at ? `${n} ${what}` : feed.win === 'weekend' ? 'Worth it this weekend' : 'Worth it tonight';
    html += `<div class="lh"><span class="kicker${at ? ' acc' : ''}">${at ? `At ${esc(fmtClock(minOfDay(at)))}` : esc(cap(WINDOW_TEXT[feed.win]))}</span><h2>${esc(title)}</h2></div>`;
    if (feed.day){
      const d = feed.day;
      html += `<div class="day-note" role="note"><b>${esc(d.today ? `${d.name} is today` : d.days_until === 1 ? `${d.name} is tomorrow` : `${d.name} in ${d.days_until} days`)}</b> · ${esc(d.blurb || '')}</div>`;
    }
    const opts = [['all','All'], ...((feed.events || []).length ? [['events','Events']] : []), ...feed.kinds.map(k => [k.key, k.label])];
    if (!loading && opts.length > 2)
      html += `<div class="filters" role="group" aria-label="Filter">${opts.map(([k, l]) => `<button class="chip" data-f="${esc(k)}" aria-pressed="${feed.filter === k}">${esc(l)}</button>`).join('')}</div>`;
  }
  if (loading && !srcItems().length) html += skeletonRows();
  else {
    if (feed.err.events && feed.err.spots && !srcItems().length){
      const slow = /too long/i.test((feed.err.events && feed.err.events.message) || '');
      html += `<div class="notice">${ic('warning-circle')}<div><b>${slow ? 'That took longer than usual' : "Couldn't reach Roamly"}</b>
        <p>${slow ? 'Search can be slow the first time in a new area.' : 'Check your connection and try again.'}</p>
        <div class="acts"><button class="btn btn-secondary" data-retry>${ic('arrow-clockwise')} Try again</button></div></div></div>`;
    } else if (!vis.length && !loading){
      const wider = clamp(ready.radius_km * 2, RADIUS_MIN, RADIUS_MAX);
      html += `<div class="empty"><span class="e-ic">${ic(at ? 'clock' : 'calendar-blank')}</span>
        <h3>${at ? `Nothing open or on at ${esc(fmtClock(minOfDay(at)))}` : `Nothing listed within ${fmtKm(ready.radius_km)}`}</h3>
        <p>${at ? 'Drag the dial to another hour, or look at any time tonight.' : 'Roamly checks ticketed events, the city calendar and its club guide, so small pop-ups can be missing.'}</p>
        <div class="acts">${at ? `<button class="btn btn-secondary" data-any>Any time</button>` : ''}
          ${wider > ready.radius_km ? `<button class="btn btn-secondary" data-wider>${ic('circle-dashed')} Search ${fmtKm(wider)}</button>` : ''}
          <button class="btn btn-primary" data-plan-me>${ic('sparkle')} Plan it for me</button></div></div>`;
    } else {
      html += vis.slice(0, feed.page).map(it => rowHtml(it, at)).join('');
      if (vis.length > feed.page) html += `<div class="more"><button class="btn btn-secondary" data-more>Show ${Math.min(LIST_PAGE, vis.length - feed.page)} more</button></div>`;
      if (loading) html += skeletonRows(2);
    }
    if (!feed.search && !loading){
      const notes = [];
      if (feed.evType && feed.evType !== 'events' && feed.evMsg) notes.push(esc(feed.evMsg));
      if (!feed.covered) notes.push("The club guide covers Toronto for now — club nights still show wherever Ticketmaster lists them.");
      if (feed.err.spots && !feed.err.events) notes.push("The club guide didn't load just now.");
      notes.push(`Ticketed events via Ticketmaster${(feed.events || []).some(e => e.source === 'seatgeek') ? ' and SeatGeek' : ''}; free festivals from the City of Toronto calendar. Run a night? <a href="submit-event.html">List it on Roamly</a>.`);

function wireList(body, vis){

    const it = srcItems().find(i => i.id === row.dataset.id); if (!it) return;

  const on = (sel, fn) => { const el = body.querySelector(sel); if (el) el.onclick = fn; };
  on('[data-more]', () => { feed.page += LIST_PAGE; renderList(); });
  on('[data-retry]', () => loadFeed(true));
  on('[data-any]', () => { dial.on = false; renderList(); renderDial(); });
  on('[data-wider]', () => { ready.radius_km = clamp(ready.radius_km * 2, RADIUS_MIN, RADIUS_MAX); radiusTouched = edited = true; renderCtx(); });
  on('[data-plan-me]', () => planIt());
  on('[data-clear-search]', () => { feed.search = null; rebuildItems(); syncMarkers(); renderList(); });
}
function setHot(id, o = {}){

  [prev, id].forEach(k => { const it = k && srcItems().find(i => i.id === k); if (it) paintPin(it); });
  if (o.fromMap) document.querySelectorAll('#pbody .row').forEach(r => r.classList.toggle('sel', r.dataset.id === id || (selected && r.dataset.id === selected.id)));

/* ================= the selected place ================= */
function select(it, o = {}){

function renderPop(){

    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.name + ' ' + (it.raw.address || it.raw.venue || ''))}`;

  const at = dialActive() ? atDial(dial.v) : null;
  if (it.type === 'event'){

    kicker = [st.live ? 'On now' : cap(WINDOW_TEXT[feed.win]), st.live ? '' : st.text].filter(Boolean).join(' · ');
    body = ev.description || [ev.venue, ev.distance_km != null ? `${ev.distance_km} km away` : ''].filter(Boolean).join(' · ');
    if (evPrice(ev)) tags.push(evPrice(ev));

      n.innerHTML = `<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>&nbsp; ${esc(lines[k++])}`; waitTimers.push(setTimeout(next, 2800));
    }, 2400));
    waitTimers.push(setTimeout(() => {
      const n = $('waitNote'); if (!n) return;
      n.insertAdjacentHTML('afterend', '<p class="wait-late">Taking longer than usual — venue search can be slow the first time in a new area.</p>');
    }, 15000));
  } else if (planUi.state === 'error'){
    const e = planUi.err, slow = /too long/i.test((e && e.message) || '');
    scroll = `${top}<div class="plan-h"><span class="kicker">${esc(dateK)}</span><h2>Your night</h2></div>
      <div class="notice" style="margin:20px 0 0">${ic('warning-circle')}<div><b>${esc(e && e.title || (slow ? 'Hmm — that took longer than usual' : "Couldn't reach Roamly"))}</b>
        <p>${esc(e && e.text || (slow ? 'Venue search can be slow right now. Your settings are kept, so nothing needs retyping.' : 'Check your connection and try again. Your settings are kept.'))}</p>
        <div class="acts">${planUi.retry ? `<button class="btn btn-secondary" data-retry>${ic('arrow-clockwise')} Try again</button>` : ''}
          <button class="btn btn-ghost" data-settings>${ic('sliders-horizontal')} Adjust settings</button></div></div></div>`;
  } else if (lastItin && lastItin.days){
    scroll = `${top}<div class="plan-h"><span class="kicker">${lastItin.days.length}-day trip</span><h2>${esc(lastItin.title)}</h2>${planUi.intro ? `<p class="intro" style="margin:4px 0 0">${esc(planUi.intro)}</p>` : ''}</div>
      ${lastItin.days.map(day => `<h3 class="day-h">Day ${esc(day.day)} <span class="muted" style="font-size:14px">· ~$${esc(day.estimated_cost)}</span></h3>${planBody(day)}`).join('')}`;
    foot = `<button class="btn btn-secondary btn-lg" data-again>${ic('arrows-clockwise')} Another</button>
      <button class="btn btn-primary btn-lg${planUi.saved ? ' done' : ''}" data-save>${planUi.saved ? `${ic('check')} Saved` : `${ic('bookmark-simple')} Save this trip`}</button>`;
  } else if (lastItin && lastItin.plan){
    const plan = lastItin.plan;
    const tweaks = TWEAKS.filter(t => t.vibe ? ready.vibe !== t.vibe : t.show()).slice(0, 5);
    const also = (plan.events || []).filter(e => e.source !== 'seatgeek').slice(0, 2);
    scroll = `${top}<div class="plan-h"><span class="kicker">${esc(dateK)}${plan.quick ? ' · quick version' : ''}</span><h2>${esc(planName(plan))}</h2>
        <p class="ctxline" data-ctxline></p></div>
      ${planBody(plan, { intro: planUi.intro })}
      ${also.length ? `<div class="sub-h kicker">Also on nearby</div><div class="also">${also.map((e, i) => `<div class="also-row">
          ${artHtml({ icon:'ticket', img:safeUrl(e.image) })}<div><b>${esc(e.name)}</b><small>${esc([e.venue, evWhen(e), evPrice(e)].filter(Boolean).join(' · '))}</small></div>
          <button class="btn btn-secondary" data-also="${i}">${ic('plus')} Add</button></div>`).join('')}</div>` : ''}
      ${planUi.saved ? '' : `<div class="sub-h kicker">Make it more…</div><div class="tweaks">${tweaks.map((t, i) => `<button class="chip" data-tw="${i}">${esc(t.label)}</button>`).join('')}
        <button class="chip" data-again>${ic('arrows-clockwise')} Try another</button><button class="chip" data-surprise>${ic('shuffle')} Surprise me</button></div>`}`;
    foot = `<button class="btn btn-secondary btn-lg" data-share>${ic('share-network')} Share</button>
      <button class="btn btn-primary btn-lg${planUi.saved ? ' done' : ''}" data-save>${planUi.saved ? `${ic('check')} Saved` : `${ic('bookmark-simple')} Save this night`}</button>`;
    el._tweaks = tweaks; el._also = also;
  } else {
    closePlan(); return;
  }
  el.innerHTML = `<div class="plan-scroll">${scroll}</div>${foot ? `<div class="plan-foot">${foot}</div>` : ''}`;
  el.querySelectorAll('[data-ctxline]').forEach(c => { c.innerHTML = ctxLineHtml(); wireCtxLine(c); });
  const on = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = fn);
  on('[data-close]', closePlan);
  on('[data-settings]', () => openSheet());
  on('[data-retry]', () => { const r = planUi.retry; if (r){ planLoading(planUi.kind); r(); } });
  on('[data-save]', e => saveItin(lastItin, e.currentTarget));
  on('[data-again]', () => lastItin && lastItin.days ? send('plan a different trip') : reroll());
  on('[data-surprise]', () => planIt({ surprise:true }));
  on('[data-share]', sharePlan);
  el.querySelectorAll('[data-tw]').forEach(b => b.onclick = () => tweak(el._tweaks[+b.dataset.tw]));
  el.querySelectorAll('[data-also]').forEach(b => b.onclick = () => {
    const ev = el._also[+b.dataset.also]; addEventToPlan(lastItin.plan, ev); planUi.saved = false;
    renderPlanPanel(); drawRoute(); renderDock(); toast(`${ev.name} is in your night`);
  });
  el.querySelectorAll('.stop').forEach(li => {
    const i = +li.dataset.stop;
    li.querySelector('.stop-h').onclick = () => toggleStop(i);
    const sw = li.querySelector('[data-swap]'); if (sw) sw.onclick = () => send(`swap ${lastItin.plan.stops[i].name} for something similar`, { quiet:true });
    const rm = li.querySelector('[data-rm]'); if (rm) rm.onclick = () => removeStop(i);
  });
  renderDock();
}
function toggleStop(i, force){
  openStop = force ? i : (openStop === i ? -1 : i);
  if (!planUi.open){ openPlan(); return; }
  document.querySelectorAll('#plan .stop').forEach(li => {
    const on = +li.dataset.stop === openStop; li.classList.toggle('open', on); li.querySelector('.stop-h').setAttribute('aria-expanded', on);
    if (on && force) li.scrollIntoView({ block:'nearest', behavior:'smooth' });
  });
  drawRoute();
  const s = currentPlan() && currentPlan().stops[openStop];
  if (s && s.lat != null && map){ const p = fitPad(); map.panInside([s.lat, s.lng], { paddingTopLeft:p.paddingTopLeft, paddingBottomRight:p.paddingBottomRight }); }
}
function removeStop(i){
  const plan = lastItin.plan, [gone] = plan.stops.splice(i, 1);
  const pp = Math.max(1, plan.party_size || 1);
  plan.estimated_cost = Math.max(0, (plan.estimated_cost || 0) - (gone.est_cost || 0) * pp);
  planUi.saved = false; openStop = -1;
  renderPlanPanel(); drawRoute();
  toast(`${gone.name} removed`, { label:'Undo', onclick: () => {
    plan.stops.splice(i, 0, gone); plan.estimated_cost += (gone.est_cost || 0) * pp; renderPlanPanel(); drawRoute(); } });
}
function sharePlan(){
  const plan = lastItin && lastItin.plan; if (!plan) return;
  const text = `${planName(plan)} — ` + plan.stops.map((s, i) => `${i + 1}. ${s.time ? s.time + ' ' : ''}${s.name}`).join(' · ');
  if (navigator.share) navigator.share({ title:'My night, planned with Roamly', text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied — paste it anywhere'), () => toast("Couldn't copy that"));
}

function addEventToPlan(plan, ev){
  const cost = ev.free ? 0 : Math.round(ev.price_min || 40);
  plan.stops.push({
    slot:'event', label:'Live event', icon:'🎟️',
    name: ev.name, lat: ev.lat, lng: ev.lng, rating: null, price: null,
    address: ev.venue || null, image: ev.image || null,
    url: safeUrl(ev.url), source: ev.source || 'ticketmaster',
    est_cost: cost, categories: [ev.category].filter(Boolean),
    time: ev.time ? fmtClock(parseClock(ev.time) ?? 0) : null,
    why: `${ev.free ? 'Free ' : 'Live '}${ev.category ? ev.category.split(',')[0].toLowerCase() : 'event'}${evWhen(ev) ? ' · ' + evWhen(ev) : ''} — locked in.`,
  });
  // keep the evening in time order when the event has a time
  const t = s => { const m = parseClock(s.time); return m == null ? null : relClock(m); };
  if (plan.stops.every(s => t(s) != null)) plan.stops.sort((a, b) => t(a) - t(b));
  plan.estimated_cost = (plan.estimated_cost || 0) + cost * Math.max(1, plan.party_size || 1);
  plan.events = (plan.events || []).filter(e => e !== ev);   // no longer just "nearby" — it's in the plan
}

/* ---- picks → /plan/build ---- */
function toSelection(it){
  if (it.type === 'event'){
    const ev = it.raw;
    return { slot:'event', name:ev.name, lat:ev.lat, lng:ev.lng, categories:[ev.category].filter(Boolean),
      address:ev.venue, image:ev.image, url:safeUrl(ev.url), source:ev.source || 'ticketmaster',
      est_cost: ev.free ? 0 : ev.price_min ? Math.round(ev.price_min) : 40, arousal:3.5,
      time: ev.time ? fmtClock(parseClock(ev.time) ?? 0) : undefined };
  }
  const s = it.raw;
  return { slot: ['bars','lounges','lgbtq'].includes(s.kind) ? 'drinks' : 'leisure', name:s.name, lat:s.lat, lng:s.lng,
    categories:s.categories || [], address:s.address, image:s.image, url:safeUrl(s.url), source:s.source, rating:s.rating, price:s.price };
}
async function buildFromPicks(){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  const sels = night.map(toSelection).filter(s => s.lat != null && s.lng != null);
  if (!sels.length){ toast('Those picks have no map location — try others.'); return; }
  const at = userLoc || { lat: sels.reduce((a, s) => a + s.lat, 0) / sels.length, lng: sels.reduce((a, s) => a + s.lng, 0) / sels.length };
  planLoading('build');
  const again = () => buildFromPicks.run(sels, at);
  buildFromPicks.run(sels, at, again);
}
buildFromPicks.run = async function(sels, at, again){
  again = again || (() => buildFromPicks.run(sels, at));
  try{
    const res = await apiFetch(`${API}/plan/build`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ selections:sels, session_id: sessionId, lat:at.lat, lng:at.lng, party_size:ready.party_size || 2,
        budget:ready.budget || 0, vibe:ready.vibe || 'chill', interests:ready.interests || '', group_type:ready.group_type || null,
        time_of_day:ready.time_of_day || null, dietary:ready.dietary || '' }) }).then(r => { if (r.status === 401) throw Object.assign(new Error('auth'), { auth:true }); return r.json(); });
    if (res.type === 'itinerary' && res.plan){ res.plan._meta = metaNow(); setPlan(res.plan, { intro:res.message, fromPicks:true, mode:'build' }); }
    else planFailed({ title:"Couldn't build that", text: res.message || 'Try picking a few different spots.' }, null);
  }catch(e){
    if (e.auth){ busy = false; closePlan(); requireSignIn(); return; }
    planFailed({ title:"Couldn't build that just now", text:'Your picks are still saved — try again.' }, again);
  }
};

/* ---- auto plans: /plan/chat with the planning state ---- */
function planIt(o = {}){
  if (!token()){ requireSignIn(); return; }
  if (!hasWhere()){ needLocation(() => planIt(o)); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  planLoading('plan');
  runPlan(readyPrefs(), o);
}
async function runPlan(prefs, o = {}){
  busy = true;
  const again = () => runPlan(prefs, o);
  const at = o.at || userLoc;                          // plan-around-an-event centres on the event
  try{
    const r = await apiFetch(`${API}/plan/chat`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages:[], prefs, lat:at && at.lat, lng:at && at.lng, tz: USER_TZ, session_id: sessionId,
        exclude: o.keepVenues ? [] : [...seenVenues].slice(-15), seed: Math.floor(Math.random() * 1e9), surprise: !!o.surprise }) });
    if (r.status === 401){ busy = false; closePlan(); requireSignIn(); return; }
    const res = await r.json();
    if (o.withEvent && res.type === 'itinerary' && res.plan){
      addEventToPlan(res.plan, o.withEvent);
      res.plan.events = [];
      res.message = `A night built around ${o.withEvent.name}. ` + (res.message || '');
    }
    busy = false;
    showResponse(res, again, { prev: o.prev, fromPlan:true });
  }catch(e){ planFailed(e, again); }
  finally{ if (planUi.state !== 'loading') busy = false; renderNightBar(); }
}
function tweak(t){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  if (t.vibe) ready.vibe = t.vibe; else t.apply();
  edited = true; renderCtx();
  const prev = lastItin && lastItin.plan ? lastItin.plan.stops.map(x => x.name).sort().join('|') : null;
  planLoading('plan');
  runPlan(readyPrefs(), { keepVenues:true, prev });   // new constraints → new picks
}
function reroll(){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  if (!hasWhere()){ needLocation(reroll); return; }
  planLoading('plan');
  runPlan(readyPrefs(), {});
}
function planAround(e){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  const prefs = readyPrefs();
  const at = e.lat != null ? { lat: e.lat, lng: e.lng } : null;
  if (at) delete prefs.location;                      // centre the plan on the event itself
  if (!at && !hasWhere()){ needLocation(() => planAround(e)); return; }
  planLoading('plan');
  runPlan(prefs, { at, withEvent: e });
}
function planNightAt(s){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  const prefs = readyPrefs();
  delete prefs.location;                              // centre the plan on the place itself
  prefs.requested_venues = [s.name];
  planLoading('plan');
  runPlan(prefs, { at: { lat: s.lat, lng: s.lng } });
}

/* ================= search: typed requests, short replies ================= */
function chatBody(extra = {}){
  const keep = 20, from = Math.max(0, messages.length - keep);
  return { messages: messages.slice(from), turn_start: Math.max(0, convoStart - from),
           current_plan: planOnScreen(), asked: askedKeys, session_id: sessionId,
           defaults: readyPrefs(), tz: USER_TZ, seed: Math.floor(Math.random() * 1e9), ...extra };
}
function planOnScreen(){
  if (!lastItin || !lastItin.plan) return null;          // trips aren't edited stop by stop
  const { _meta, events, ...plan } = lastItin.plan;
  return plan;
}
function send(text, o = {}){
  text = (text || '').trim(); if (!text) return;
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last one.'); return; }
  $('q').value = '';
  messages.push({ role:'user', content:text });
  lastAsk = text;
  if (o.quiet && planUi.open) planLoading('plan');
  else showReply({ you:text, waiting:true });
  requestChat(o);
}
let lastAsk = '';
async function requestChat(o = {}){
  busy = true; $('goBtn').disabled = true;
  const again = () => { busy = true; requestChat(o); };
  try{
    const r = await apiFetch(`${API}/plan/chat`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify(chatBody({ lat:userLoc && userLoc.lat, lng:userLoc && userLoc.lng, surprise: !!o.surprise })) });
    if (r.status === 401){ busy = false; requireSignIn(); return; }
    const res = await r.json();
    busy = false;
    showResponse(res, again, { typed:true });
  }catch(e){
    busy = false;
    if (planUi.state === 'loading') planFailed(e, again);
    else {
      const slow = /too long/i.test((e && e.message) || '');
      showReply({ you:lastAsk, text: slow ? 'That took longer than usual — venue search can be slow right now.' : "Couldn't reach Roamly. Check your connection.",
        actions:[{ label:'Try again', icon:'arrow-clockwise', onclick: () => { showReply({ you:lastAsk, waiting:true }); again(); } }] });
    }
  }
  finally{ $('goBtn').disabled = false; }
}
/* One handler for every /plan/chat answer: a plan opens the plan panel, events
   fill the list, anything else is a short reply under the search bar. */
function showResponse(res, retry, o = {}){
  const changed = applyUnderstood(res.understood);
  const bot = res.message || '…';
  if (o.typed){ messages.push({ role:'assistant', content:bot }); }
  if (res.type === 'itinerary' || res.type === 'events') convoStart = messages.length;   // a result closes the turn
  if (res.ask && !askedKeys.includes(res.ask)) askedKeys.push(res.ask);

  if (res.type === 'itinerary' && res.days && res.days.length){
    hideReply(); setTrip(res.days, res.title, { intro:bot }); track('plan_built', { mode:'trip' }); announce('Your trip is ready'); return;
  }
  if (res.type === 'itinerary' && res.plan){
    hideReply();
    res.plan._meta = metaNow();
    setPlan(res.plan, { intro:bot, mode: o.typed ? 'chat' : 'plan' });
    if (o.prev && res.plan.stops.map(x => x.name).sort().join('|') === o.prev)
      toast('Same spots came out on top — try a different mood or a wider radius for new picks.');
    announce('Your night is ready');
    return;
  }
  // not a plan: let go of the plan panel's loading state
  if (planUi.state === 'loading'){ busy = false; if (lastItin){ planUi.state = 'result'; renderPlanPanel(); } else closePlan(); }
  if (res.type === 'events'){
    if (panelMode !== 'list') setPanel('list');
    feed.search = { q: lastAsk || 'What’s on', events: res.events || [] };
    rebuildItems(); syncMarkers(); renderList();
    const pts = items.filter(i => i.lat != null).map(i => [i.lat, i.lng]); if (pts.length) fitTo(pts, 15);
    showReply({ you:lastAsk, text:bot, heard:changed });
    return;
  }
  const actions = [];
  if (retry && /overloaded|too slow|took too long/i.test(bot)) actions.push({ label:'Try again', icon:'arrow-clockwise', onclick: () => { showReply({ you:lastAsk, waiting:true }); busy = true; retry(); } });
  if (/^Tell me where/i.test(bot) && retry) actions.push({ label:'Set a place', icon:'map-pin', onclick: () => needLocation(() => { showReply({ you:lastAsk, waiting:true }); busy = true; retry(); }) });
  showReply({ you:lastAsk, text:bot, quick:res.quick_replies || [], heard:changed, actions });
  announce(bot);
}
function showReply(r){
  const el = $('reply');
  el.hidden = false;
  el.innerHTML = `${r.you ? `<span class="you">You: ${esc(r.you)}</span>` : ''}
    <div class="reply-top"><p>${r.waiting ? `<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>&nbsp; <span class="muted">Reading your request…</span>` : esc(r.text)}</p>
      ${r.waiting ? '' : `<button class="ibtn" data-x aria-label="Dismiss">${ic('x')}</button>`}</div>
    ${r.heard && r.heard.length ? `<div class="heard">Got it:${r.heard.map(k => `<button data-k="${k}" aria-label="${esc(SECTION[k][1])}: ${esc(ctxText(k))}. Change">${esc(ctxText(k))}</button>`).join('')}</div>` : ''}
    ${(r.quick && r.quick.length) || (r.actions && r.actions.length) ? `<div class="chips">${(r.actions || []).map((a, i) =>
        `<button class="chip on" data-act="${i}">${a.icon ? ic(a.icon) : ''} ${esc(a.label)}</button>`).join('')}${(r.quick || []).map((q, i) =>
        `<button class="chip" data-q="${i}">${esc(q)}</button>`).join('')}</div>` : ''}`;
  const x = el.querySelector('[data-x]'); if (x) x.onclick = hideReply;
  el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => openSheet(b.dataset.k));
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => send(r.quick[+b.dataset.q]));
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => r.actions[+b.dataset.act].onclick());
}
function hideReply(){ $('reply').hidden = true; $('reply').innerHTML = ''; }
function requireSignIn(){
  // Session expired — a soft nudge (not a hard redirect) so nothing on screen is lost.
  busy = false;
  showReply({ text:"Looks like you got signed out — sign back in and you'll land right back here.",
    actions:[{ label:'Sign in again', icon:'sign-in', onclick: () => { localStorage.removeItem('trek_token'); location.href = 'auth.html?redirect=roamly.html'; } }] });
}

/* ================= saved plans (localStorage, no account needed) ================= */
const SAVED_KEY = 'wander_saved';
function getSaved(){ try{ return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; }catch(e){ return []; } }
function setSaved(a){ try{ localStorage.setItem(SAVED_KEY, JSON.stringify(a)); }catch(e){ toast("Couldn't save on this device"); } syncSavedCount(); }
function syncSavedCount(){
  const n = getSaved().length;
  document.querySelectorAll('[data-saved-count]').forEach(el => { el.textContent = n || ''; });
}
function saveItin(itin, btn){
  if (!itin || planUi.saved) return;
  const a = getSaved();
  a.unshift({ id:Date.now(), title:itin.title, ts:new Date().toISOString(), plan:itin.plan || null, days:itin.days || null });
  setSaved(a);
  planUi.saved = true;
  if (btn){ btn.classList.add('done'); btn.innerHTML = `${ic('check')} Saved`; }
  renderNightBar();
  toast('Saved to your plans', { label:'View', onclick: () => setPanel('saved') });
}
function savedSub(it){
  const plan = it.plan || (it.days && it.days[0]) || {};
  const n = it.days ? it.days.reduce((s, d) => s + d.stops.length, 0) : (it.plan ? it.plan.stops.length : 0);
  const cost = it.days ? it.days.reduce((s, d) => s + (d.estimated_cost || 0), 0) : (it.plan ? it.plan.estimated_cost : 0);
  const where = plan._meta && plan._meta.where;
  return [it.days ? `${it.days.length}-day trip` : null, `${n} stop${n === 1 ? '' : 's'}`, cost ? `~$${cost}` : null, where].filter(Boolean).join(' · ');
}
const cleanTitle = t => String(t || '').replace(/^[^\p{L}\p{N}]+/u, '').trim() || 'Saved plan';   // older saves start with an emoji
function setPanel(mode){
  panelMode = mode;
  $('savedBtn').setAttribute('aria-pressed', mode === 'saved');
  $('winTabs').hidden = mode === 'saved';
  if (mode === 'list'){ renderWinTabs(); loadFeed(); } else renderSavedPanel();
}
function renderSavedPanel(){
  const a = getSaved(), body = $('pbody');
  body.innerHTML = `<div class="lh"><div class="lh-row"><span class="kicker">Kept on this device</span><button class="link" data-back>Back to ${esc(WINDOW_TEXT[feed.win])}</button></div>
      <h2>Saved plans</h2></div>
    ${a.length ? a.map(it => { const d = new Date(it.ts);
      return `<div class="saved-row"><button class="row-main" data-open="${it.id}"><span class="date"><small>${esc(d.toLocaleDateString(undefined, { month:'short' }))}</small><b>${d.getDate()}</b></span>
        <span class="row-t"><b>${esc(cleanTitle(it.title))}</b><small>${esc(savedSub(it))}</small></span></button>
        <button class="row-add" data-del="${it.id}" aria-label="Delete ${esc(cleanTitle(it.title))}">${ic('trash')}</button></div>`; }).join('')
    : `<div class="empty"><span class="e-ic">${ic('bookmark-simple')}</span><h3>No saved plans yet</h3>
        <p>Make a night you like, then tap “Save this night” — it'll wait for you here.</p>
        <div class="acts"><button class="btn btn-primary" data-plan-me>${ic('sparkle')} Plan it for me</button></div></div>`}`;
  body.querySelector('[data-back]').onclick = () => setPanel('list');
  body.querySelectorAll('[data-open]').forEach(b => b.onclick = () => loadSaved(+b.dataset.open));
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteSaved(+b.dataset.del));
  const pm = body.querySelector('[data-plan-me]'); if (pm) pm.onclick = () => planIt();
}
function deleteSaved(id){
  const a = getSaved(), idx = a.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [gone] = a.splice(idx, 1); setSaved(a);
  if (panelMode === 'saved') renderSavedPanel();
  toast('Plan deleted', { label:'Undo', onclick: () => { const b = getSaved(); b.splice(Math.min(idx, b.length), 0, gone); setSaved(b);
    if (panelMode === 'saved') renderSavedPanel(); } });
}
function loadSaved(id){
  const it = getSaved().find(x => x.id === id); if (!it) return;
  if (it.days) setTrip(it.days, cleanTitle(it.title), { saved:true });
  else if (it.plan) setPlan(it.plan, { saved:true, mode:'saved' });
}

/* ================= account menu ================= */
let menuFrom = null;
function closeMenu(){
  if ($('menu').hidden) return;
  $('menu').hidden = true;
  document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function openMenu(btn){
  const m = $('menu'); m.hidden = false; menuFrom = btn;
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  let top = r.bottom + 8; if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 8);
  m.style.left = clamp(r.right - w, 12, innerWidth - w - 12) + 'px';
  m.style.top = top + 'px';
  btn.setAttribute('aria-expanded', 'true');
  const first = m.querySelector('a,button'); if (first) first.focus();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-menu]');
  if (b){ e.stopPropagation(); $('menu').hidden ? openMenu(b) : closeMenu(); return; }
  if (!e.target.closest('#menu')) closeMenu();
});
function startOver(){
  messages = []; convoStart = 0; askedKeys = []; sessionId = newSessionId();
  seenVenues.clear(); lastItin = null; night = []; picksDirty = false; lastAsk = '';
  ready = defaultsFrom(profile); budgetTouched = radiusTouched = needWhere = edited = false; pending = null;
  feed.search = null; hideReply(); select(null); closePlan(); if (routeLayer) routeLayer.clearLayers();
  renderCtx(); setPanel('list'); renderDock();
}
$('menuSettings').onclick = () => openSheet();
$('menuSaved').onclick = () => { closeMenu(); setPanel('saved'); };
$('resetBtn').onclick = () => { closeMenu(); startOver(); };
$('signOutBtn').onclick = () => {
  ['trek_token','trek_user','trek_refresh'].forEach(k => localStorage.removeItem(k));
  location.replace('auth.html');
};
$('savedBtn').onclick = () => setPanel(panelMode === 'saved' ? 'list' : 'saved');
$('wherePill').onclick = () => openSheet(hasWhere() ? 'radius_km' : 'location');
$('sheetClose').onclick = () => { pending = null; closeSheet(); };
$('sheetBg').onclick = () => { pending = null; closeSheet(); };
$('sheetDone').onclick = closeSheet;
$('sheetReset').onclick = () => {
  ready = defaultsFrom(profile); budgetTouched = radiusTouched = edited = false;
  renderSheet(); renderCtx();
};
$('searchForm').addEventListener('submit', e => { e.preventDefault(); send($('q').value); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!$('menu').hidden){ closeMenu(); if (menuFrom) menuFrom.focus(); return; }
    if (sheetOpen){ pending = null; closeSheet(); return; }
    if (selected){ select(null); return; }
    if (planUi.open && planUi.state !== 'loading'){ closePlan(); return; }
  }
  // keep keyboard focus inside the open sheet
  if (e.key === 'Tab' && sheetOpen){
    const f = [...$('sheet').querySelectorAll('button:not([disabled]),input,[tabindex="0"]')].filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  }
});
phoneMq.addEventListener('change', () => { if (map) setTimeout(() => map.invalidateSize(), 50); renderPlanPanel(); });
/* The search's example rotates while it's empty, so it's clear what you can ask. */
const EXAMPLES = ['Search, or ask: “quiet bar near Ossington”', 'Try: “cheap sushi date in Kensington”', "Try: “what's on tonight?”", 'Try: “fun night with 4 friends, $60 each”'];
let exampleI = 0;
setInterval(() => {
  const i = $('q'); if (document.activeElement === i || i.value) return;
  exampleI = (exampleI + 1) % EXAMPLES.length; i.placeholder = EXAMPLES[exampleI];
}, 5000);
// The dial's "Now" marker creeps along while the page is open.
setInterval(() => {
  const d = $('dialInput');
  if (ready && !document.hidden && !(d && (d.matches(':active') || document.activeElement === d))) renderDial();
}, 60000);

/* Accounts made before the Terms existed (or before they changed) accept them once. */
function termsGate(){
  const el = document.createElement('div');
  el.className = 'terms-gate'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-labelledby', 'tgTitle');
  el.innerHTML = `<div class="tg-card"><h2 id="tgTitle">Roamly's Terms & Privacy Policy</h2>
    <p>Before you keep planning, please read and accept the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>
      and the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</p>
    <div class="tg-acts"><button class="btn btn-primary" id="tgAccept">Accept and continue</button>
      <button class="btn btn-secondary" id="tgOut">Sign out</button></div></div>`;
  document.body.appendChild(el);
  $('tgAccept').focus();
  $('tgAccept').onclick = async e => {
    e.target.disabled = true;
    try{
      const r = await apiFetch(`${API}/users/me/accept-terms`, { method:'POST', headers: authHeaders() });
      if (!r.ok) throw new Error();
      me = await r.json(); el.remove();
    }catch(err){ e.target.disabled = false; toast("Couldn't save that — try again."); }
  };
  $('tgOut').onclick = () => { localStorage.removeItem('trek_token'); location.href = 'auth.html?redirect=roamly.html'; };
}

function initialOf(){ const n = (me && (me.display_name || me.username)) || localStorage.getItem('trek_user') || 'R'; return n.trim().charAt(0).toUpperCase(); }
function syncIdentity(){
  document.querySelectorAll('[data-initial]').forEach(el => el.textContent = initialOf());
  const name = (me && (me.display_name || me.username)) || localStorage.getItem('trek_user') || 'Your account';
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = name);
  const handle = (me && me.username) || localStorage.getItem('trek_user');
  document.querySelectorAll('[data-handle]').forEach(el => el.textContent = handle ? '@' + handle : '');
}

/* ================= boot ================= */
// No session → the sign-in page. Otherwise straight to the map with sensible defaults;
// the taste profile fills them in as soon as it arrives (the survey is optional),
// so a sleeping server never leaves a blank screen.
(async function boot(){
  if (!token()){
    location.replace('auth.html?redirect=' + encodeURIComponent('roamly.html' + location.search + location.hash));
    return;
  }
  const want = (location.hash || '').slice(1);
  history.replaceState(null, '', location.pathname + location.search);
  initMap();
  // Live location is opt-in: use it silently only if permission was already granted.
  try{
    navigator.permissions.query({ name:'geolocation' })
      .then(st => { if (st.state === 'granted') getLoc(); else if (ready) renderList(); }).catch(() => {});
  }catch(e){}
  syncSavedCount(); syncIdentity();
  profile = { defaults:{} }; ready = defaultsFrom(profile);
  // Tonight's dial starts at "now" (or 8 PM before the evening starts).
  const nowV = dialOf(new Date());
  dial.v = nowV >= 0 && nowV <= DIAL_SPAN ? clamp(Math.ceil(nowV / 15) * 15, 0, DIAL_SPAN) : 120;
  renderWinTabs(); renderCtx(); renderList(); renderDock();
  if (want === 'saved') setPanel('saved');
  const [pr, mr] = await Promise.allSettled([
    apiFetch(`${API}/users/me/profile`, { headers: authHeaders() }),
    apiFetch(`${API}/users/me`, { headers: authHeaders() }),
  ]);
  if (pr.status === 'fulfilled' && pr.value.status === 401){
    localStorage.removeItem('trek_token');           // expired — sign in again, then come straight back
    location.replace('auth.html?redirect=roamly.html'); return;
  }
  if (mr.status === 'fulfilled' && mr.value.ok){ try{ me = await mr.value.json(); }catch(e){} syncIdentity(); }
  if (me && me.is_admin) $('adminLink').hidden = false;
  if (me && me.needs_terms) termsGate();
  if (pr.status === 'fulfilled' && pr.value.ok){
    try{ profile = await pr.value.json(); }catch(e){}
    // Apply the profile's defaults unless the user already started changing things.
    if (profile && !edited && !messages.length && !budgetTouched && !radiusTouched){
      const loc = ready.location; ready = defaultsFrom(profile); ready.location = loc;
    }
    renderCtx(); if (sheetOpen) renderSheet();
  }
  // Arrived from the landing page's search box: ask it straight away, once.
  const heroQ = new URLSearchParams(location.search).get('q');
  if (heroQ){
    history.replaceState(null, '', location.pathname);
    send(heroQ.slice(0, 300));
  }
})();
</script>
