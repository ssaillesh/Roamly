/* ================= actions: plan · surprise · pick ================= */
function planIt(o = {}){
  if (!token()){ requireSignIn(); return; }
  if (!userLoc && !ready.location){ needLocation(() => planIt(o)); return; }   // need a where first
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  if (view !== 'chat') showView('chat', { bottom:true });
  const title = o.surprise ? '🎲 Surprise me' : o.pick ? '🧩 Let me pick the spots' : '✨ Plan my night';
  // No hidden text trace: a later typed turn ("make it cheaper") gets its context
  // from the bar (sent as `defaults`), which is always current — a stale trace isn't.
  addMsg('user', `${esc(title)}<span class="sub">${esc(readySummary())}</span>`);
  typing(true, o.pick ? 'pick' : 'plan');
  if (o.pick){ fetchOptions(readyPrefs()); return; }
  runPlan(readyPrefs(), o);
}
async function runPlan(prefs, o = {}){
  busy = true;                                         // no double plans from quick taps
  const again = () => runPlan(prefs, o);
  const at = o.at || userLoc;                          // plan-around-an-event centres on the event
  try{
    const r = await apiFetch(`${API}/plan/chat`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages:[], prefs, lat:at && at.lat, lng:at && at.lng, tz: USER_TZ,
        exclude: o.keepVenues ? [] : [...seenVenues], seed: Math.floor(Math.random() * 1e9), surprise: !!o.surprise }) });
    if (r.status === 401){ typing(false); requireSignIn(); return; }
    const res = await r.json();
    if (o.withEvent && res.type === 'itinerary' && res.plan){
      addEventToPlan(res.plan, o.withEvent);
      res.plan.events = [];                             // it's in the plan, don't re-offer it
      res.message = `Here's a night built around ${o.withEvent.name}: ` + (res.message || '');
    }
    busy = false;
    showChatResponse(res, again, { prev: o.prev });
  }catch(e){ failed(e, again, 'plan'); }
  finally{ busy = false; }
}

/* ================= what's on: live events near the planning state ================= */
const WINDOWS = [['now','Right now'],['tonight','Tonight'],['weekend','This weekend']];
const WINDOW_TEXT = { now:'right now', tonight:'tonight', weekend:'this weekend' };
const SOURCE_LABEL = { ticketmaster:'via Ticketmaster', city_toronto:'City of Toronto festivals calendar' };
const EV_ART = [
  [/music|concert|jazz|rock|hip|pop|dj/i, '🎵', 'linear-gradient(135deg,#e2ddff,#f7dcff)'],
  [/sport|hockey|basketball|soccer|baseball|football/i, '🏟️', 'linear-gradient(135deg,#dff1ff,#def7ea)'],
  [/theat|art|comedy|dance|opera|ballet/i, '🎭', 'linear-gradient(135deg,#ffe0ea,#ffe9d6)'],
  [/film|movie|cinema/i, '🎬', 'linear-gradient(135deg,#e6e4ff,#dfe9ff)'],
  [/festival|fair|market|parade/i, '🎪', 'linear-gradient(135deg,#fff0c7,#ffdcd0)'],
  [/food|drink|taste|wine|beer/i, '🍢', 'linear-gradient(135deg,#ffe9d6,#fff2cf)'],
  [/family|kid|children/i, '🧸', 'linear-gradient(135deg,#dcf6e9,#fff2cf)'],
];
function evArt(ev){
  const hay = `${ev.category || ''} ${ev.name || ''}`;
  const hit = EV_ART.find(([re]) => re.test(hay));
  return hit ? { emoji:hit[1], bg:hit[2] } : { emoji:'🎟️', bg:'linear-gradient(135deg,#efeaff,#ffe4ed)' };
}
/* "On now" / "Starts in 40 min" / "8:30 PM" — worked out here, so it stays right. */
function evStatus(ev){
  const now = Date.now(), st = ev.start ? Date.parse(ev.start) : NaN, en = ev.end ? Date.parse(ev.end) : NaN;
  if (isNaN(st)) return { live:false, text: evWhen(ev) };
  if (st <= now && (isNaN(en) || en >= now)) return { live:true, text:'On now' };
  const mins = Math.round((st - now) / 60000);
  if (mins > 0 && mins < 90) return { live:false, text:`Starts in ${mins} min` };
  const d = new Date(st), today = d.toDateString() === new Date().toDateString();
  return { live:false, text: (today ? 'Today · ' : d.toLocaleDateString(undefined, { weekday:'short' }) + ' · ')
    + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }) };
}
function evCardHtml(ev, i){
  const s = evStatus(ev), art = evArt(ev);
  const cat = ev.category ? ev.category.split(',')[0].trim() : '';
  const price = ev.free ? '<span class="tag free">Free</span>'
    : ev.price_min ? `<span class="tag">from $${Math.round(ev.price_min)}</span>` : '';
  const where = [ev.venue, ev.distance_km != null ? `${ev.distance_km} km away` : null].filter(Boolean).map(esc).join(' · ');
  const dir = ev.lat != null
    ? `https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lng}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((ev.venue || '') + ' ' + ev.name)}`;
  const link = safeUrl(ev.url), img = safeUrl(ev.image);
  return `<article class="evc">
    <div class="evc-art" style="background:${art.bg}"><span aria-hidden="true">${art.emoji}</span>${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>
    <div class="evc-body">
      <div class="evc-when${s.live ? ' live' : ''}">${s.live ? '<span class="live-dot" aria-hidden="true"></span>' : ''}${esc(s.text || '')}</div>
      <h4 class="evc-name">${esc(ev.name)}</h4>
      ${where ? `<div class="evc-meta">${where}</div>` : ''}
      <div class="evc-tags">${price}${cat ? `<span class="tag">${esc(cat)}</span>` : ''}</div>
    </div>
    <div class="evc-acts">
        <button class="btn btn-soft btn-sm" data-plan="${i}">${ic('plus','sm')} Plan around it</button>
        <a class="btn btn-ghost btn-sm" href="${esc(dir)}" target="_blank" rel="noopener">${ic('nav','sm')} Directions</a>
        ${link ? `<a class="btn btn-ghost btn-sm" href="${esc(link)}" target="_blank" rel="noopener">${ev.source === 'ticketmaster' ? 'Tickets' : 'Details'} ${ic('external','sm')}</a>` : ''}
    </div>
    <div class="evc-src">${esc(SOURCE_LABEL[ev.source] || '')}</div>
  </article>`;
}

function queueEventsRefresh(){
  clearTimeout(evRefreshT);
  evRefreshT = setTimeout(() => { if (view === 'events' && ev.shown !== evKey() && (userLoc || ready.location)) openEvents(); }, 700);
}
function renderEventsShell(){
  const el = $('v-events');
  el.innerHTML = `<div class="page">
    <header class="page-head"><div><h1 class="t-title" id="evTitle">What's on</h1><p class="t-meta">Live and upcoming events near you</p></div>${AVATAR_BTN()}</header>
    <div class="seg" role="tablist" aria-label="When">${WINDOWS.map(([w, l]) =>
      `<button role="tab" data-w="${w}" aria-selected="${ev.window === w}">${esc(l)}</button>`).join('')}</div>
    <div class="ev-where">${ic('pin','sm')}<span>${esc(ready.location || (userLoc ? 'Near you' : 'No place set'))} · within ${fmtKm(ready.radius_km)}</span>
      <button class="link" data-ev-where>Change</button></div>
    <div class="ev-filters" id="evFilters" role="group" aria-label="Filter events"></div>
    <div id="evList" aria-live="polite" aria-busy="false"></div>
  </div>`;
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { ev.window = b.dataset.w; openEvents(); });
  el.querySelector('[data-ev-where]').onclick = () => openSheet(ready.location || userLoc ? 'radius_km' : 'location');
}
function openEvents(w){
  if (w) ev.window = w;
  if (!ready) return;
  renderEventsShell();
  ev.shown = evKey();
  if (!userLoc && !ready.location){
    $('evList').innerHTML = `<div class="empty"><div class="e-art" aria-hidden="true">📍</div><h3>Where should Roamly look?</h3>
      <p>Turn on your live location or type a neighbourhood — then you'll see what's on around it.</p>
      <button class="btn btn-primary" data-ev-loc>${ic('pin','sm')} Set location</button></div>`;
    $('evList').querySelector('[data-ev-loc]').onclick = () => needLocation(() => { if (view === 'events') openEvents(); });
    return;
  }
  if (!token()){ requireSignIn(); return; }
  const key = evKey();
  if (ev.key === key && ev.res && Date.now() - ev.ts < 5 * 60000){ renderEvList(); return; }
  loadEvents(key);
}
async function loadEvents(key){
  const list = $('evList'), seq = ++ev.seq;
  list.setAttribute('aria-busy', 'true');
  list.innerHTML = `<p class="t-meta ev-summary" role="status">${ic('live','sm')} Checking what's on ${esc(WINDOW_TEXT[ev.window])}…</p>
    <div class="ev-items skel-wrap" aria-hidden="true">${[0,1,2].map(() => `<div class="skel-ev"><div class="skel" style="width:84px;height:84px;border-radius:16px"></div>
      <div style="flex:1;display:grid;gap:8px;align-content:start;padding-top:4px"><div class="skel" style="height:10px;width:30%"></div>
      <div class="skel" style="height:14px;width:80%"></div><div class="skel" style="height:10px;width:55%"></div></div></div>`).join('')}</div>`;
  const prefs = { mode: ev.window, radius_km: ready.radius_km };
  if (ready.location) prefs.location = ready.location;
  try{
    const r = await apiFetch(`${API}/plan/chat`, { method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages:[], prefs, lat:userLoc && userLoc.lat, lng:userLoc && userLoc.lng, tz: USER_TZ }) });
    if (seq !== ev.seq) return;                         // a newer tab/radius superseded this one
    if (r.status === 401){ requireSignIn(); return; }
    ev.res = await r.json(); ev.key = key; ev.ts = Date.now(); ev.filter = 'all';
    if (view === 'events') renderEvList();
  }catch(e){
    if (seq !== ev.seq || view !== 'events') return;
    list.setAttribute('aria-busy', 'false');
    const slow = /too long/i.test((e && e.message) || '');
    list.innerHTML = `<div class="notice err" style="margin-top:16px"><span class="n-ic">${ic('alert')}</span><div>
      <b>${slow ? 'Hmm — that took longer than usual' : "Couldn't reach Roamly"}</b><p>${slow ? 'Event search can be slow right now.' : 'Check your connection and try again.'}</p>
      <div class="n-acts"><button class="btn btn-dark btn-sm" data-retry>${ic('refresh','sm')} Try again</button></div></div></div>`;
    list.querySelector('[data-retry]').onclick = () => loadEvents(key);
  }
}
function renderEvList(){
  const list = $('evList'), res = ev.res; if (!list || !res) return;
  list.setAttribute('aria-busy', 'false');
  const evs = res.events || [];
  if (res.type !== 'events'){
    list.innerHTML = `<div class="notice" style="margin-top:16px"><span class="n-ic">${ic('ticket')}</span><div><b>Live events aren't available here yet</b>
      <p>${esc(res.message || '')}</p><div class="n-acts"><button class="btn btn-dark btn-sm" data-plan-instead>${ic('sparkle','sm')} Plan my night instead</button></div></div></div>`;
    list.querySelector('[data-plan-instead]').onclick = () => planIt();
    return;
  }
  if (!evs.length){
    const wider = clamp(ready.radius_km * 2, RADIUS_MIN, RADIUS_MAX);
    const next = WINDOWS.find(([w]) => w !== ev.window && w !== 'now') || WINDOWS[1];
    list.innerHTML = `<div class="empty"><div class="e-art" aria-hidden="true">🗓️</div>
      <h3>Nothing listed ${esc(WINDOW_TEXT[ev.window])} within ${fmtKm(ready.radius_km)}</h3>
      <p>Roamly checks ticketed events and the city's festival calendar, so small free pop-ups can be missing.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
        ${wider > ready.radius_km ? `<button class="btn btn-ghost btn-sm" data-wider>${ic('radius','sm')} Search ${fmtKm(wider)}</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-next>${esc(next[1])}</button>
        <button class="btn btn-primary btn-sm" data-plan-instead>${ic('sparkle','sm')} Plan my night instead</button></div></div>`;
    const wb = list.querySelector('[data-wider]');
    if (wb) wb.onclick = () => { ready.radius_km = wider; radiusTouched = edited = true; renderCtx(); if (wide()) renderSheet(); openEvents(); };
    list.querySelector('[data-next]').onclick = () => { ev.window = next[0]; openEvents(); };
    list.querySelector('[data-plan-instead]').onclick = () => planIt();
    return;
  }
  // filters from what's actually in the list (first category word) + Free
  const cats = [...new Set(evs.map(e => (e.category || '').split(',')[0].trim()).filter(Boolean))].slice(0, 5);
  const hasFree = evs.some(e => e.free);
  const filters = [['all','All'], ...(hasFree ? [['free','Free']] : []), ...cats.map(c => [c, c])];
  $('evFilters').innerHTML = filters.length > 2 ? filters.map(([k, l]) =>
    `<button class="chip sm" data-f="${esc(k)}" aria-pressed="${ev.filter === k}">${esc(l)}</button>`).join('') : '';
  $('evFilters').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ev.filter = b.dataset.f; renderEvList(); });
  const shown = evs.filter(e => ev.filter === 'all' || (ev.filter === 'free' ? e.free : (e.category || '').split(',')[0].trim() === ev.filter));
  list.innerHTML = `<p class="t-meta ev-summary">${esc(res.message || '')}</p>
    <div class="ev-items">${shown.map(e => evCardHtml(e, evs.indexOf(e))).join('')}</div>
    <p class="ev-note">Ticketed events via Ticketmaster. Free festivals come from the City of Toronto calendar when it's available.</p>`;
  list.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { showView('chat', { bottom:true }); planAround(evs[+b.dataset.plan]); });
}

function planAround(e){
  if (!token()){ requireSignIn(); return; }
  if (busy){ toast('One sec — still working on the last plan.'); return; }
  const prefs = readyPrefs();
  const at = e.lat != null ? { lat: e.lat, lng: e.lng } : null;
  if (at) delete prefs.location;                      // centre the plan on the event itself
  if (!at && !userLoc && !ready.location){ needLocation(() => planAround(e)); return; }
  addMsg('user', esc(`➕ Plan a night around ${e.name}`));
  typing(true, 'plan');
  runPlan(prefs, { at, withEvent: e });
}

/* ================= home ================= */
function skyline(){
  // A generic city silhouette, generated (deterministic) — no image request.
  const r = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
  const T = 560;                                   // the tower: right of centre, clear of the headline
  let back = '', front = '', win = '', x = 0, i = 0;
  while (x < 800){ const w = 16 + Math.round(r(i + 1) * 16), h = 38 + Math.round(r(i + 7) * 46);
    back += `<rect x="${x}" y="${120 - h}" width="${w}" height="${h}"/>`; x += w + 2; i++; }
  x = 0;
  while (x < 800){ const w = 20 + Math.round(r(i + 3) * 18), h = 20 + Math.round(r(i + 5) * 30);
    if (x + w < T - 18 || x > T + 18){
      front += `<rect x="${x}" y="${120 - h}" width="${w}" height="${h}"/>`;
      if (r(i + 9) > .3) win += `<rect x="${x + 5}" y="${126 - h}" width="3" height="3"/>`;
      if (r(i + 11) > .55) win += `<rect x="${x + w - 9}" y="${134 - h}" width="3" height="3"/>`;
    }
    x += w + 3; i++; }
  return `<svg class="skyline" viewBox="0 0 800 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g fill="#2b1d6e" opacity=".5">${back}</g>
    <g fill="#1a1242">${front}<path d="M${T - 7} 120l4-62h6l4 62z"/><rect x="${T - 1.5}" y="6" width="3" height="56"/>
      <ellipse cx="${T}" cy="47" rx="9" ry="4.5"/><rect x="${T - 5}" y="54" width="10" height="3" rx="1.5"/></g>
    <g fill="#ffd27a" opacity=".85">${win}<rect x="${T - 1}" y="45" width="2" height="2"/></g></svg>`;
}
const SKYLINE = skyline();
const HOME_EXAMPLES = [['🍣 Cheap sushi date', 'cheap sushi date tonight'], ["🎶 What's on tonight?", "what's on tonight?"],
  ['👯 Day out with 4 friends', 'fun day with 4 friends, $60 each'], ['🌿 Something chill nearby', 'something chill within 2 km']];
const AVATAR_BTN = () => `<button class="avatar" data-menu data-initial aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">${esc(initialOf())}</button>`;
function initialOf(){ const n = (me && (me.display_name || me.username)) || localStorage.getItem('trek_user') || 'R'; return n.trim().charAt(0).toUpperCase(); }
function firstName(){ const n = me && (me.display_name || me.username); return n ? n.trim().split(/\s+/)[0] : ''; }
function renderHome(first){

  const hello = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const dusk = h >= 17 || h < 6;
  const saved = getSaved();
  const a = profile && profile.completed && profile.archetype;
  const home = document.createElement('div'); home.className = 'home' + (first ? ' anim' : '');
  home.innerHTML = `
    <div class="hero home-hero${dusk ? '' : ' day'}">
      ${SKYLINE}<span class="glow" aria-hidden="true"></span>
      <div class="hero-bar">
        <span class="logo on-dark"><svg class="logo-mark" aria-hidden="true"><use href="#i-logo-w"/></svg>Roamly</span>
        <button class="avatar" data-menu data-initial aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">${esc(initialOf())}</button>
      </div>
      <div class="hero-copy">
        <p class="hello">${esc(hello)}${firstName() ? ', ' + esc(firstName()) : ''} ✨</p>
        <h1 class="t-display" id="homeTitle">What are we up to?</h1>
        <p class="hero-sub">Tell Roamly what you're after — it figures out the details, and you stay in control.</p>
      </div>
    </div>
    <div class="home-body">
      <section class="card plan-around" aria-labelledby="paLabel">
        <div class="pa-head"><span class="t-label" id="paLabel">Planning around</span><button class="link" data-open-sheet>Adjust</button></div>
        <div class="ctx-chips wrap" data-ctx role="group" aria-labelledby="paLabel"></div>
        <p class="loc-note" data-locnote></p>
      </section>
      <div class="acts">
        <button class="act act-primary" data-a="plan">
          <span class="act-ic">${ic('sparkle','lg')}</span>
          <span class="act-t"><b>Plan my night</b><small>A full plan from your settings, in one tap</small></span>
          <span class="act-go" aria-hidden="true">${ic('chev')}</span></button>
        <div class="act-row">
          <button class="act act-pink" data-a="now"><span class="act-ic">${ic('live')}</span><span><b>What's on now</b><br><small>Live events near you</small></span></button>
          <button class="act act-sun" data-a="surprise"><span class="act-ic">${ic('dice')}</span><span><b>Surprise me</b><br><small>Let Roamly pick</small></span></button>
          <button class="act act-mint" data-a="pick"><span class="act-ic">${ic('grid')}</span><span><b>Pick my spots</b><br><small>Build it yourself</small></span></button>
        </div>
      </div>
      <form class="ask card" id="askForm" autocomplete="off">
        <span class="ask-ic" aria-hidden="true">${ic('sparkle')}</span>
        <input class="ask-input" id="askInput" aria-label="Tell Roamly what you want" placeholder="Ask Roamly — cheap sushi date in Kensington" />
        <button class="send" type="submit" aria-label="Send">${ic('up')}</button>
      </form>
      <div class="examples" role="group" aria-label="Try asking">${HOME_EXAMPLES.map(([l, t]) =>
        `<button class="chip sm" data-ex="${esc(t)}">${esc(l)}</button>`).join('')}</div>
      ${lastAskText && thread.children.length ? `<button class="card continue" data-continue>
          <span class="c-ic">${ic('chat')}</span>
          <span class="c-t"><b>Pick up where you left off</b><span class="t-meta">${esc(lastAskText)}</span></span>
          ${ic('chev')}</button>` : ''}
      ${saved.length ? `<div class="sec-h"><h2 class="t-h">Your saved plans</h2><button class="link" data-see-saved>See all</button></div>
        <div class="mini-row">${saved.slice(0, 6).map(it => `<button class="card mini" data-open="${it.id}">
          <span class="m-art" style="background:${(it.days ? { bg:'linear-gradient(135deg,#dff1ff,#e9e2ff)' } : (VIBE_ART[(it.plan || {}).vibe] || VIBE_ART.chill)).bg}"><span aria-hidden="true">${it.days ? '🧳' : (VIBE_ART[(it.plan || {}).vibe] || VIBE_ART.chill).emoji}</span></span>
          <span class="m-b"><b>${esc(it.title)}</b><span class="t-meta">${esc(savedSub(it))}</span></span></button>`).join('')}</div>` : ''}
      ${a ? `<a class="card taste-card" href="profile.html"><span class="tc-ic" aria-hidden="true">${esc(a.emoji)}</span>
          <span class="tc-t"><b>Planning with your taste</b><p>${esc(a.title)} — tap to review or change it.</p></span>${ic('chev')}</a>`
        : `<a class="card taste-card" href="profile.html?redirect=roamly.html"><span class="tc-ic" aria-hidden="true">🧠</span>
          <span class="tc-t"><b>Make Roamly yours</b><p>A 2-minute taste survey — every plan then starts from what you love.</p></span>${ic('chev')}</a>`}
    </div>`;
  const box = $('v-home'); box.innerHTML = ''; box.appendChild(home);
  home.querySelector('[data-a="plan"]').onclick = () => planIt();
  home.querySelector('[data-a="now"]').onclick = () => showView('events', { window:'now' });
  home.querySelector('[data-a="surprise"]').onclick = () => planIt({ surprise:true });
  home.querySelector('[data-a="pick"]').onclick = () => planIt({ pick:true });
  home.querySelector('[data-open-sheet]').onclick = () => openSheet();
  home.querySelector('#askForm').onsubmit = e => { e.preventDefault(); send($('askInput').value); };
  home.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => send(b.dataset.ex));
  const c = home.querySelector('[data-continue]'); if (c) c.onclick = () => showView('chat');
  const ss = home.querySelector('[data-see-saved]'); if (ss) ss.onclick = () => showView('saved');
  home.querySelectorAll('.mini[data-open]').forEach(b => b.onclick = () => loadSaved(+b.dataset.open));
  shownLabels = {};                                  // fresh chips here shouldn't flash
  renderCtx();
}
function syncIdentity(){
  document.querySelectorAll('[data-initial]').forEach(el => el.textContent = initialOf());
  const name = (me && (me.display_name || me.username)) || localStorage.getItem('trek_user') || 'Your account';
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = name);
  const handle = (me && me.username) || localStorage.getItem('trek_user');
  document.querySelectorAll('[data-handle]').forEach(el => el.textContent = handle ? '@' + handle : '');
}

/* ================= boot ================= */
// No session → the sign-in page. Otherwise straight to Home with sensible defaults;
// the taste profile fills them in as soon as it arrives (the survey is optional),
// so a sleeping server never leaves a blank screen.
(async function boot(){
  if (!token()){
    location.replace('auth.html?redirect=' + encodeURIComponent('roamly.html' + location.search + location.hash));
    return;
  }
  const want = (location.hash || '').slice(1);
  history.replaceState({ v:'home' }, '', location.pathname + location.search);
  // Live location is opt-in: use it silently only if permission was already
  // granted; otherwise the Where settings (or a plan that needs a place) ask.
  try{
    navigator.permissions.query({ name:'geolocation' })
      .then(st => { if (st.state === 'granted') getLoc(); }).catch(() => {});
  }catch(e){}
  syncSavedCount(); syncIdentity();
  startHome({ defaults:{} });
  showView(VIEWS[want] && want !== 'chat' ? want : 'home');
  const [pr, mr] = await Promise.allSettled([
    apiFetch(`${API}/users/me/profile`, { headers: authHeaders() }),
    apiFetch(`${API}/users/me`, { headers: authHeaders() }),
  ]);
  if (pr.status === 'fulfilled' && pr.value.status === 401){
    localStorage.removeItem('trek_token');           // expired — sign in again, then come straight back
    location.replace('auth.html?redirect=roamly.html'); return;
  }
  if (mr.status === 'fulfilled' && mr.value.ok){ try{ me = await mr.value.json(); }catch(e){} syncIdentity(); }
  if (pr.status === 'fulfilled' && pr.value.ok){
    try{ profile = await pr.value.json(); }catch(e){}
    // Apply the profile's defaults unless the user already started changing things.
    if (profile && !edited && !thread.children.length && !budgetTouched && !radiusTouched){
      const loc = ready.location; ready = defaultsFrom(profile); ready.location = loc;
      shownLabels = {};
    }
    renderCtx(); if (wide()) renderSheet();
    if (view === 'home') renderHome(false);
  }
})();
</script>
