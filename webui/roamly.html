<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
<title>Roamly — your night, planned</title>
<meta name="description" content="See what's open and on near you tonight, add what you like, and Roamly fills in the rest." />
<meta name="theme-color" content="#161826" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://trekrank.onrender.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="/config.js"></script>
<style>
  /* ================= Nocturne tokens (from the Roamly Redesign design system) ================= */
  :root{
    --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
    --color-accent:#9184d9;
    --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
    --color-neutral-100:#f3f5fe; --color-neutral-200:#e4e7f5; --color-neutral-300:#cfd3e5; --color-neutral-400:#b2b6ca;
    --color-neutral-500:#9397ab; --color-neutral-600:#75798c; --color-neutral-700:#595d6c; --color-neutral-800:#3f424d; --color-neutral-900:#292b31;
    --color-accent-100:#f5f4ff; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd; --color-accent-400:#b5abfc;
    --color-accent-500:#968ae0; --color-accent-600:#796cbf; --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;
    --color-danger:#f2a0b0; --color-ok:#9fdcbc;
    --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow-sm:0 0 0 1px #3f424d;
    --shadow-md:0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,.55);
    --shadow-lg:0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,.65);
    /* Floating panels sit over a moving map. Near-opaque fills stand in for
       frosted glass: backdrop-filter over Leaflet tiles caused lag before. */
    --glass:color-mix(in srgb,var(--color-surface) 95%,transparent);
    --ease:cubic-bezier(.22,1,.36,1);
    --gap:24px; --panel-w:392px; --plan-w:440px;
  }
  *,*::before,*::after{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;}
  button,input{font:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--color-accent-300); text-underline-offset:3px;}
  a:hover{color:var(--color-accent-200);}
  img{display:block; max-width:100%;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
  ::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}
  [hidden]{display:none !important;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .ph,.ph-fill{line-height:1;}

  /* small type: precise labels, big confident numbers */
  .kicker{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--color-neutral-500);}
  .kicker.acc{color:var(--color-accent-300);}
  .muted{color:var(--color-neutral-400);}
  .num{font-variant-numeric:tabular-nums;}

  /* ================= buttons (Nocturne) ================= */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; padding:0 14px;
    font-weight:500; font-size:14px; line-height:1.2; color:var(--color-text); background:transparent;
    border:1px solid transparent; border-radius:9px; text-decoration:none; white-space:nowrap; transition:background-color .15s;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{color:var(--color-accent); border-color:var(--color-accent);}
  .btn-primary:hover:not(:disabled){background:color-mix(in srgb,var(--color-accent) 12%,transparent); color:var(--color-accent-300);}
  .btn-primary:active:not(:disabled){background:color-mix(in srgb,var(--color-accent) 22%,transparent);}
  .btn-secondary{border-color:var(--color-divider);}
  .btn-secondary:hover:not(:disabled){background:color-mix(in srgb,var(--color-text) 7%,transparent);}
  .btn-ghost{color:var(--color-accent-300); padding:0 8px;}
  .btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent);}
  .btn-icon{width:38px; padding:0;}
  .btn-lg{min-height:48px; font-size:15px; border-radius:10px;}
  .btn-pill{border-radius:999px;}
  .btn.done{color:var(--color-ok); border-color:color-mix(in srgb,var(--color-ok) 60%,transparent);}
  .link{background:none; border:0; padding:4px 0; color:var(--color-accent-300); font-size:13px; text-decoration:none;}
  .link:hover{color:var(--color-accent-200);}
  .ibtn{display:grid; place-items:center; width:34px; height:34px; border-radius:50%; border:0; background:none; color:var(--color-neutral-400); font-size:18px; position:relative;}
  .ibtn:hover{color:var(--color-text); background:color-mix(in srgb,var(--color-text) 7%,transparent);}
  .ibtn .count{position:absolute; top:2px; right:0; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--color-accent-800);
    color:var(--color-accent-100); font-size:10px; font-weight:600; display:grid; place-items:center;}
  .ibtn .count:empty{display:none;}
  .avatar{width:30px; height:30px; border-radius:50%; border:0; background:var(--color-accent-800); color:var(--color-accent-100);
    display:grid; place-items:center; font-size:12px; font-weight:500;}
  .chip{display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 12px; border-radius:999px; font-size:13px;
    border:1px solid var(--color-divider); background:none; color:var(--color-neutral-300); white-space:nowrap;}
  .chip:hover{color:var(--color-text); border-color:color-mix(in srgb,var(--color-text) 35%,transparent);}
  .chip.on,.chip[aria-pressed="true"]{border-color:transparent; box-shadow:inset 0 0 0 1px var(--color-accent); color:var(--color-accent-300);}
  .tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; letter-spacing:.02em; padding:3px 9px; border-radius:6px;
    background:var(--color-neutral-800); color:var(--color-neutral-100);}
  .tag.acc{background:var(--color-accent-800); color:var(--color-accent-100);}
  .sg-link{display:inline-flex; align-items:center;}
  .sg-logo{height:22px; width:auto; filter:invert(1) brightness(1.4); opacity:.8;}

  /* placeholder art for places without a photo */
  .ph-art{width:100%; height:100%; display:grid; place-items:center; background:var(--color-neutral-900); color:var(--color-neutral-600); font-size:20px;}
  .art{display:block; position:relative; overflow:hidden; flex:none; background:var(--color-neutral-900);}
  .art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}

  /* ================= layout: the map is the page ================= */
  .app{position:fixed; inset:0;}
  #map{position:absolute; inset:0; background:var(--color-bg); z-index:0;}
  .leaflet-container{background:var(--color-bg); font-family:var(--font-body);}
  /* OpenStreetMap tiles, turned night-side to sit under the Nocturne panels */
  .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) saturate(.28) brightness(.82) contrast(.92);}
  .leaflet-control-attribution{background:color-mix(in srgb,var(--color-bg) 80%,transparent) !important; color:var(--color-neutral-500) !important; font-size:10px;}
  .leaflet-control-attribution a{color:var(--color-neutral-400) !important;}
  .leaflet-bar{border:0 !important; box-shadow:var(--shadow-sm) !important; border-radius:10px !important; overflow:hidden;}
  .leaflet-bar a{background:var(--color-surface) !important; color:var(--color-neutral-300) !important; border-color:var(--color-divider) !important;}
  .leaflet-bar a:hover{color:var(--color-text) !important;}
  .leaflet-top.leaflet-right{top:64px; right:calc(var(--gap) - 10px);}
  .leaflet-bottom.leaflet-right{transition:right .3s var(--ease);}

  /* map pins */
  .pin{display:block; width:12px; height:12px; border-radius:50%; background:var(--color-neutral-500); box-shadow:0 0 0 3px var(--color-bg);
    transition:transform .15s var(--ease), background-color .15s;}
  .pin.on{background:var(--color-accent-300); box-shadow:0 0 0 3px var(--color-bg),0 0 14px color-mix(in srgb,var(--color-accent) 60%,transparent);}
  .pin.ev{border-radius:4px; transform:rotate(45deg) scale(.9);}
  .pin.hot,.pin.sel{transform:scale(1.5); background:var(--color-accent); z-index:2;}
  .pin.ev.hot,.pin.ev.sel{transform:rotate(45deg) scale(1.35);}
  .pin.in{background:var(--color-accent); box-shadow:0 0 0 3px var(--color-bg),0 0 0 5px var(--color-accent-600);}
  .pin.off{display:none;}
  .npin{width:32px; height:32px; border-radius:50%; background:var(--color-bg); display:grid; place-items:center; font:500 13px var(--font-body);
    color:var(--color-accent-200); box-shadow:0 0 0 2px var(--color-accent),0 0 24px color-mix(in srgb,var(--color-accent) 55%,transparent);}
  .npin.cur{background:var(--color-accent); color:var(--color-bg); font-weight:600;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--color-accent) 25%,transparent),0 0 30px color-mix(in srgb,var(--color-accent) 70%,transparent);}

  .float{background:var(--glass); box-shadow:var(--shadow-md);}

  /* where pill (top right of the map) */
  .where{position:absolute; top:var(--gap); right:var(--gap); z-index:5; display:flex; align-items:center; gap:6px; min-height:36px; padding:0 14px;
    border:0; border-radius:999px; font-size:13px; color:var(--color-text); background:var(--color-surface); box-shadow:var(--shadow-sm);
    transition:right .3s var(--ease);}
  .where .ph{color:var(--color-accent); font-size:15px;}
  .where.need{box-shadow:0 0 0 1px var(--color-danger); color:var(--color-danger);}

  /* ================= left panel: search + list ================= */
  .panel{position:absolute; z-index:6; left:var(--gap); top:var(--gap); bottom:var(--gap); width:var(--panel-w); border-radius:18px;
    display:flex; flex-direction:column; overflow:hidden;}
  .p-head{padding:20px 20px 0; display:flex; flex-direction:column; gap:14px; flex:none;}
  .brandrow{display:flex; align-items:center; justify-content:space-between;}
  .brandrow img{height:22px; width:auto;}
  .brandrow .acts{display:flex; align-items:center; gap:6px;}
  .search{display:flex; align-items:center; gap:10px; height:42px; padding:0 6px 0 14px; border-radius:10px;
    background:color-mix(in srgb,var(--color-bg) 60%,transparent); box-shadow:inset 0 0 0 1px transparent; transition:box-shadow .15s;}
  .search:focus-within{box-shadow:inset 0 0 0 1px var(--color-accent);}
  .search > .ph{font-size:16px; color:var(--color-neutral-500);}
  .search input{flex:1; min-width:0; height:100%; border:0; outline:none; background:none; font-size:14px;}
  .search input::placeholder{color:var(--color-neutral-500);}
  .search .go{width:30px; height:30px; border-radius:8px; border:0; display:grid; place-items:center; background:none; color:var(--color-accent); font-size:16px;}
  .search .go:disabled{opacity:.35;}
  .seg3{display:flex; gap:3px; padding:3px; border-radius:9px; background:color-mix(in srgb,var(--color-bg) 60%,transparent);}
  .seg3 button{flex:1; min-height:32px; border:0; border-radius:7px; background:none; font-size:13px; color:var(--color-neutral-400);}
  .seg3 button:hover{color:var(--color-text);}
  .seg3 button[aria-selected="true"]{background:var(--color-neutral-800); color:var(--color-text);}

  /* Roamly's short replies to a typed search — one question at a time */
  .reply{border-radius:12px; padding:12px 14px; background:color-mix(in srgb,var(--color-accent) 9%,transparent); display:flex; flex-direction:column; gap:10px;
    animation:rise .3s var(--ease) both;}
  .reply-top{display:flex; gap:10px; align-items:flex-start;}
  .reply-top p{margin:0; flex:1; font-size:14px; line-height:1.5;}
  .reply-top .ibtn{width:26px; height:26px; font-size:14px; margin:-3px -6px 0 0;}
  .reply .you{font-size:12px; color:var(--color-neutral-500);}
  .reply .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .heard{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--color-neutral-400);}
  .heard button{border:0; background:var(--color-accent-800); color:var(--color-accent-100); font-size:12px; padding:3px 9px; border-radius:6px;}
  .dots{display:inline-flex; gap:4px; vertical-align:middle;}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--color-accent); opacity:.35; animation:bl 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .p-body{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:0 10px 12px; scrollbar-width:thin; scrollbar-color:var(--color-neutral-800) transparent;}
  .lh{padding:18px 10px 8px; display:flex; flex-direction:column; gap:2px;}
  .lh-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .lh h2{margin:0; font-size:22px; line-height:1.2; font-weight:500; letter-spacing:-.02em;}
  .filters{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:6px 10px 6px;}
  .filters::-webkit-scrollbar{display:none;}
  .filters .chip{min-height:30px; font-size:12.5px;}
  .day-note{margin:6px 10px 4px; padding:10px 12px; border-radius:10px; background:color-mix(in srgb,var(--color-accent) 9%,transparent); font-size:13px; color:var(--color-neutral-300);}
  .day-note b{color:var(--color-text); font-weight:500;}

  .row{display:flex; align-items:center; gap:4px; border-radius:12px; transition:background-color .12s;}
  .row:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent);}
  .row.sel{background:color-mix(in srgb,var(--color-accent) 10%,transparent);}
  .row-main{flex:1; min-width:0; display:flex; gap:14px; align-items:center; padding:10px; border:0; background:none; text-align:left; border-radius:12px;}
  .row-main .art{width:56px; height:56px; border-radius:10px;}
  .row-t{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .row-t b{font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-t small{font-size:13px; color:var(--color-neutral-400); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-t small.live{color:var(--color-accent-300);}
  .row-t small.live::before{content:''; display:inline-block; width:6px; height:6px; margin-right:6px; border-radius:50%; background:var(--color-accent); vertical-align:1px;}
  .row-end{font-size:12px; color:var(--color-neutral-500); white-space:nowrap;}
  .row-add{flex:none; width:40px; height:40px; margin-right:4px; border:0; border-radius:50%; background:none; display:grid; place-items:center;
    color:var(--color-neutral-500); font-size:22px;}
  .row-add:hover{color:var(--color-accent-300);}
  .row-add.in{color:var(--color-accent);}
  .row-add:disabled{opacity:.3; cursor:default;}
  .more{display:flex; justify-content:center; padding:10px 0 4px;}
  .foot-note{margin:14px 10px 0; font-size:12px; color:var(--color-neutral-500); line-height:1.5;}
  .foot-note a{color:var(--color-neutral-300);}

  .skel{background:var(--color-neutral-900); border-radius:6px; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.55;}}
  .skel-row{display:flex; gap:14px; align-items:center; padding:10px;}

  .empty{padding:28px 14px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .empty .e-ic{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--color-accent-900); color:var(--color-accent-300); font-size:24px;}
  .empty h3{margin:0; font-size:17px; font-weight:500;}
  .empty p{margin:0; font-size:13.5px; color:var(--color-neutral-400); max-width:32ch;}
  .empty .acts{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:4px;}
  .notice{margin:12px 10px; padding:12px 14px; border-radius:12px; background:color-mix(in srgb,var(--color-danger) 9%,transparent); display:flex; gap:10px; font-size:13.5px;}
  .notice.info{background:color-mix(in srgb,var(--color-text) 5%,transparent);}
  .notice > .ph{font-size:18px; color:var(--color-danger); margin-top:1px;}
  .notice.info > .ph{color:var(--color-neutral-400);}
  .notice b{display:block; font-weight:500;}
  .notice p{margin:2px 0 0; color:var(--color-neutral-400);}
  .notice .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}

  /* saved plans (in the panel) */
  .saved-row{display:flex; align-items:center; gap:4px; border-radius:12px;}
  .saved-row:hover{background:color-mix(in srgb,var(--color-text) 4%,transparent);}
  .saved-row .row-main .date{width:56px; height:56px; border-radius:10px; flex:none; display:grid; place-items:center; align-content:center; gap:0;
    background:var(--color-neutral-900); line-height:1.1;}
  .saved-row .date small{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500);}
  .saved-row .date b{font-size:18px; font-weight:500;}

  /* ================= the selected place, floating ================= */
  .pop{position:absolute; z-index:7; top:var(--gap); right:calc(var(--gap) + 0px); margin-top:52px; width:316px; border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; background:var(--glass); box-shadow:var(--shadow-lg); animation:rise .25s var(--ease) both;}
  .pop .art{height:150px;}
  .pop .ph-art{font-size:26px;}
  .pop-x{position:absolute; top:10px; right:10px; z-index:2; width:30px; height:30px; border-radius:50%; border:0; display:grid; place-items:center;
    background:color-mix(in srgb,var(--color-bg) 80%,transparent); color:var(--color-text); font-size:15px;}
  .pop-b{padding:16px; display:flex; flex-direction:column; gap:10px;}
  .pop-b h3{margin:0; font-size:20px; line-height:1.2; font-weight:500; letter-spacing:-.01em;}
  .pop-b p{margin:0; font-size:13px; color:var(--color-neutral-400); display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  .pop-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .pop-acts{display:flex; gap:8px;}
  .pop-acts .btn-primary{flex:1;}
  .pop-links{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px;}
  .pop-links a,.pop-links button{display:inline-flex; align-items:center; gap:5px; color:var(--color-accent-300); text-decoration:none; background:none; border:0; padding:2px 0; font-size:13px;}
  .pop-src{font-size:11.5px; color:var(--color-neutral-500);}
  .pop-src a{color:var(--color-neutral-400);}

  /* ================= bottom dock: the time dial + your night ================= */
  .dock{position:absolute; z-index:5; left:calc(var(--gap) + var(--panel-w) + 16px); right:var(--gap); bottom:var(--gap); border-radius:16px;
    display:flex; align-items:stretch; transition:right .3s var(--ease);}
  .dial{flex:1; min-width:0; padding:14px 22px 10px; display:flex; flex-direction:column; gap:8px;}
  .dial-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; font-size:13px;}
  .dial-top b{font-weight:500; font-size:15px;}
  .dial-top .muted{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track{position:relative; height:80px; margin:0 4px; touch-action:pan-y;}
  .blocks{position:absolute; left:0; right:0; top:0; height:26px;}
  .blk{position:absolute; top:0; height:26px; border-radius:7px; border:0; background:var(--color-accent-800); box-shadow:inset 0 0 0 1px var(--color-accent-700);
    display:flex; align-items:center; padding:0 9px; font-size:12px; color:var(--color-accent-100); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:3;}
  .blk.ghost{background:none; box-shadow:none; border:1px dashed var(--color-neutral-700); color:var(--color-neutral-500); justify-content:center;}
  .ruler{position:absolute; left:0; right:0; top:36px; height:12px;
    background:repeating-linear-gradient(90deg,var(--color-neutral-400) 0 1px,transparent 1px 12.5%) top/100% 12px no-repeat,
               repeating-linear-gradient(90deg,var(--color-neutral-700) 0 1px,transparent 1px 3.125%) bottom/100% 6px no-repeat;}
  .ruler::after{content:''; position:absolute; right:0; top:0; width:1px; height:12px; background:var(--color-neutral-400);}
  .past{position:absolute; left:0; top:36px; height:12px; background:color-mix(in srgb,var(--color-bg) 60%,transparent);}
  .nowmark{position:absolute; top:32px; width:1px; height:20px; background:var(--color-neutral-300);}
  .nowmark span{position:absolute; top:44px; left:-14px; width:28px; text-align:center; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-400);}
  .hours{position:absolute; left:0; right:0; top:52px; height:16px; font-size:11px; color:var(--color-neutral-500);}
  .hours span{position:absolute; transform:translateX(-50%);}
  .hours span:first-child{transform:none;} .hours span:last-child{transform:translateX(-100%);}
  .handle{position:absolute; top:26px; width:2px; height:30px; margin-left:-1px; background:var(--color-accent); box-shadow:0 0 12px var(--color-accent); pointer-events:none; z-index:2;}
  .handle span{position:absolute; top:30px; left:50%; transform:translateX(-50%); min-width:44px; height:22px; padding:0 6px; border-radius:6px; background:var(--color-accent);
    color:var(--color-bg); font-size:11px; font-weight:600; display:grid; place-items:center; white-space:nowrap;}
  .dial.off .handle{opacity:.35; box-shadow:none;}
  .dial-input{position:absolute; left:-8px; right:-8px; top:26px; height:40px; width:calc(100% + 16px); margin:0; opacity:0; cursor:ew-resize; z-index:1;}
  .dial-input:focus-visible + .focus-ring{display:block;}
  .focus-ring{display:none; position:absolute; inset:24px -6px 10px; border-radius:8px; outline:2px solid var(--color-accent); pointer-events:none;}
  .dial-flat{flex:1; padding:18px 22px; display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:13px; color:var(--color-neutral-400);}
  .dial-flat b{font-size:15px; font-weight:500; color:var(--color-text);}
  .nb{flex:none; display:flex; align-items:center; gap:18px; padding:12px 12px 12px 22px; box-shadow:-1px 0 0 var(--color-divider);}
  .nb-t{display:flex; flex-direction:column; gap:1px; font-size:14px; max-width:260px;}
  .nb-t b{font-weight:500;}
  .nb-t span{color:var(--color-neutral-400); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nb-acts{display:flex; gap:8px;}

  /* ================= your night: the spec sheet (review step) ================= */
  .plan{position:absolute; z-index:8; right:var(--gap); top:var(--gap); bottom:var(--gap); width:var(--plan-w); border-radius:18px;
    background:var(--color-bg); box-shadow:var(--shadow-lg); display:flex; flex-direction:column; overflow:hidden; animation:slide .3s var(--ease) both;}
  @keyframes slide{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:none;}}
  .plan-scroll{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:24px 32px 20px; scrollbar-width:thin; scrollbar-color:var(--color-neutral-800) transparent;}
  .plan-top{display:flex; align-items:center; justify-content:space-between; margin:-6px -12px 18px -8px;}
  .plan-top .ibtn{font-size:18px;}
  .plan-h{display:flex; flex-direction:column; gap:6px;}
  .plan-h h2{margin:0; font-size:36px; line-height:1.05; letter-spacing:-.03em; font-weight:500; text-wrap:balance;}
  .ctxline{margin:0; font-size:14px; color:var(--color-neutral-400); line-height:1.9;}
  .ctxline button{border:0; background:none; padding:0; color:var(--color-text); border-bottom:1px dashed var(--color-accent); font-size:14px; line-height:1.3;}
  .ctxline button:hover{color:var(--color-accent-300);}
  .spec{margin-top:24px; display:grid; grid-template-columns:repeat(3,1fr); padding:18px 0;
    background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat top/100% 1px,
               linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px;}
  .spec div{display:flex; flex-direction:column; gap:4px;}
  .spec b{font-size:28px; font-weight:400; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15;}
  .spec b small{font-size:15px; color:var(--color-neutral-400);}
  .intro{margin:18px 0 0; font-size:14px; color:var(--color-neutral-300); line-height:1.6;}
  .stops{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column;}
  .stop{border-radius:12px;}
  .stop-h{width:100%; display:grid; grid-template-columns:40px 1fr auto; align-items:baseline; gap:0; padding:12px 0; border:0; background:none; text-align:left;}
  .stop-h .n{font-size:13px; color:var(--color-accent-300); font-variant-numeric:tabular-nums;}
  .stop-h .t{display:flex; flex-direction:column; min-width:0;}
  .stop-h .t b{font-size:17px; font-weight:400;}
  .stop-h .t small{font-size:13px; color:var(--color-neutral-500);}
  .stop-h .tm{font-size:14px; color:var(--color-neutral-300); font-variant-numeric:tabular-nums;}
  .stop-d{display:none; padding:0 0 14px 40px; gap:10px;}
  .stop.open .stop-d{display:flex; flex-direction:column;}
  .stop-d .row2{display:flex; gap:12px;}
  .stop-d .art{width:72px; height:72px; border-radius:8px;}
  .stop-d p{margin:0; font-size:13px; color:var(--color-neutral-400);}
  .stop-d .acts{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px;}
  .stop-d .acts a,.stop-d .acts button{display:inline-flex; align-items:center; gap:5px; background:none; border:0; padding:2px 0; color:var(--color-accent-300); text-decoration:none; font-size:13px;}
  .stop-d .acts .rm{color:var(--color-neutral-400);}
  .walk{display:flex; align-items:center; gap:6px; padding:0 0 0 40px; margin:-4px 0; font-size:12px; color:var(--color-neutral-600);}
  .sub-h{margin:26px 0 10px;}
  .fits{list-style:none; margin:0; padding:0; display:grid; gap:7px;}
  .fits li{display:flex; gap:9px; font-size:13.5px; color:var(--color-neutral-300);}
  .fits li .ph{color:var(--color-ok); margin-top:2px;}
  .fits li.warn .ph{color:var(--color-danger);}
  .tip{margin:14px 0 0; padding:12px 14px; border-radius:10px; border:1px dashed var(--color-neutral-700); font-size:13.5px; color:var(--color-neutral-300);}
  .tweaks{display:flex; flex-wrap:wrap; gap:6px;}
  .also{display:flex; flex-direction:column; gap:10px;}
  .also-row{display:flex; align-items:center; gap:12px;}
  .also-row .art{width:48px; height:48px; border-radius:8px;}
  .also-row div{flex:1; min-width:0; display:flex; flex-direction:column;}
  .also-row b{font-size:14px; font-weight:500;}
  .also-row small{font-size:12px; color:var(--color-neutral-400);}
  .plan-foot{flex:none; padding:14px 32px 22px; display:flex; gap:10px;}
  .plan-foot .btn{flex:1;}
  .plan-foot .btn-primary{flex:2;}
  .day-h{margin:28px 0 0; font-size:20px; font-weight:500;}
  .wait-note{font-size:14px; color:var(--color-neutral-300);}
  .wait-late{margin:8px 0 0; font-size:12.5px; color:var(--color-neutral-500);}

  /* ================= settings: one sheet for the dashed values ================= */
  .sheet-bg{position:fixed; inset:0; z-index:40; background:color-mix(in srgb,#08090f 60%,transparent);}
  .sheet{position:fixed; z-index:41; left:50%; top:50%; transform:translate(-50%,-50%); width:min(480px,calc(100% - 32px)); max-height:min(760px,calc(100% - 48px));
    display:flex; flex-direction:column; border-radius:16px; background:var(--color-surface); box-shadow:var(--shadow-lg); animation:fade .2s var(--ease) both;}
  @keyframes fade{from{opacity:0;}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px 2px;}
  .sheet-head h2{margin:0; font-size:20px; font-weight:500;}
  .sheet-sub{margin:0; padding:0 22px 6px; font-size:13px; color:var(--color-neutral-400);}
  .sheet-body{flex:1; min-height:0; overflow-y:auto; padding:0 22px 8px;}
  .sheet-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 22px 18px; box-shadow:0 -1px 0 var(--color-divider);}
  .sec{padding:16px 0; background:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px;}
  .sec:last-child{background:none;}
  .sec h3{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; color:var(--color-neutral-400);}
  .sec h3 .ph{font-size:14px; color:var(--color-accent);}
  .sec.hl{animation:sechl 1.4s var(--ease) 1;}
  @keyframes sechl{0%{background-color:color-mix(in srgb,var(--color-accent) 14%,transparent);} 100%{background-color:transparent;}}
  .sec-body{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .sec .row{flex-basis:100%; gap:12px; font-size:14px; color:var(--color-neutral-300);}
  .sec .row:hover{background:none;}
  .sec .row b{min-width:56px; color:var(--color-text); font-size:15px; font-weight:500;}
  .sec .hint{flex-basis:100%; font-size:12.5px; color:var(--color-neutral-500);}
  .sec .row .hint{flex-basis:auto;}
  .sec .need{flex-basis:100%; padding:10px 12px; border-radius:10px; background:color-mix(in srgb,var(--color-danger) 12%,transparent); font-size:13.5px; color:var(--color-danger);}
  .sec input[type=range]{flex:1; accent-color:var(--color-accent); min-height:40px;}
  .field{display:flex; flex-direction:column; gap:6px; flex-basis:100%; margin-top:6px; font-size:12px; color:var(--color-neutral-400);}
  .input{width:100%; min-height:40px; padding:8px 12px; font-size:14px; color:var(--color-text); caret-color:var(--color-accent);
    background:var(--color-bg); border:1px solid var(--color-divider); border-radius:9px;}
  .input:hover{border-color:color-mix(in srgb,var(--color-text) 40%,transparent);}
  .input:focus-visible{border-color:var(--color-accent); outline-offset:0;}
  .money{display:inline-flex; align-items:center; gap:2px; min-height:40px; padding:0 14px; border:1px solid var(--color-divider); border-radius:9px; background:var(--color-bg);}
  .money:focus-within{border-color:var(--color-accent);}
  .money input{border:0; width:90px; padding:8px 2px; outline:none; background:transparent; font-size:15px;}
  .stepper button{width:40px; height:40px; border-radius:50%; border:1px solid var(--color-divider); background:none; font-size:18px;}
  .stepper button:hover{border-color:var(--color-accent);}
  .stepper b{min-width:28px !important; text-align:center;}
  .switch-row{display:flex; align-items:center; gap:12px; flex-basis:100%; padding:12px 14px; border-radius:10px; background:var(--color-bg);}
  .switch-row > div{flex:1;}
  .switch-row b{font-size:14px; font-weight:500;} .switch-row small{display:block; font-size:12.5px; color:var(--color-neutral-500); margin-top:2px;}
  .switch{width:44px; height:26px; flex:none; border-radius:999px; border:0; background:var(--color-neutral-800); position:relative; transition:background-color .2s;}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--color-neutral-300); transition:transform .2s var(--ease), background-color .2s;}
  .switch[aria-checked="true"]{background:var(--color-accent-700);}
  .switch[aria-checked="true"]::after{transform:translateX(18px); background:var(--color-accent-100);}
  .switch:disabled{opacity:.4;}

  /* account menu, toast, terms gate */
  .menu{position:fixed; z-index:60; min-width:220px; padding:6px; border-radius:12px; background:var(--color-surface); box-shadow:var(--shadow-lg); display:flex; flex-direction:column;}
  .menu .who{padding:10px 12px 8px; display:flex; flex-direction:column; font-size:12.5px; color:var(--color-neutral-500);}
  .menu .who b{font-size:14px; font-weight:500; color:var(--color-text);}
  .menu a,.menu button{display:flex; align-items:center; gap:10px; padding:9px 12px; border:0; border-radius:8px; background:none; font-size:14px; color:var(--color-text); text-decoration:none; text-align:left;}
  .menu a:hover,.menu button:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent); color:var(--color-text);}
  .menu .ph{font-size:16px; color:var(--color-neutral-400);}
  .toast{position:fixed; z-index:70; left:50%; bottom:28px; transform:translate(-50%,12px); opacity:0; pointer-events:none; display:flex; align-items:center; gap:14px;
    max-width:calc(100% - 32px); padding:10px 12px 10px 18px; border-radius:999px; background:var(--color-neutral-100); color:var(--color-bg); font-size:13.5px; font-weight:500;
    box-shadow:0 16px 40px rgba(0,0,0,.5); transition:opacity .2s, transform .2s var(--ease);}
  .toast.on{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  .toast button{border:0; background:none; color:var(--color-accent-700); font-weight:600; font-size:13.5px; padding:4px 6px;}
  .toast:not(:has(button)){padding-right:18px;}
  .terms-gate{position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:16px; background:color-mix(in srgb,#08090f 70%,transparent);}
  .tg-card{max-width:440px; width:100%; padding:24px; border-radius:16px; background:var(--color-surface); box-shadow:var(--shadow-lg);}
  .tg-card h2{margin:0 0 8px; font-size:20px; font-weight:500;}
  .tg-card p{margin:0 0 18px; color:var(--color-neutral-300); font-size:15px;}
  .tg-acts{display:flex; flex-wrap:wrap; gap:8px;}

  /* ---- plan open: the map gives way on the right ---- */
  body.plan-open .pop{display:none;}
  body.pop-open:not(.plan-open) .leaflet-top.leaflet-right{display:none;}
  body.plan-open .dock{right:calc(var(--gap) + var(--plan-w) + 16px);}
  body.plan-open .nb{display:none;}          /* the plan panel is the review — the dial gets the room */
  body.plan-open .where{right:calc(var(--gap) + var(--plan-w) + 16px);}
  body.plan-open .leaflet-top.leaflet-right{right:calc(var(--gap) + var(--plan-w) + 6px);}
  @media (max-width:1279px) and (min-width:860px){ body.plan-open .dock{display:none;} }
  @media (max-width:1100px) and (min-width:860px){ .nb-t{max-width:170px;} .dial{padding:12px 16px 8px;} }

  /* ================= phones: map on top, list below, plan full screen ================= */
  @media (max-width:859px){
    :root{--gap:12px;}
    body{overflow:hidden;}
    .app{display:flex; flex-direction:column;}
    #map{position:relative; inset:auto; flex:none; height:30vh; height:30dvh;}
    .where{top:calc(var(--gap) + env(safe-area-inset-top));}
    .leaflet-top.leaflet-right{display:none;}
    /* the whole panel scrolls, so the search and tabs move out of the list's way */
    .panel{position:relative; left:auto; top:auto; bottom:auto; width:auto; flex:1; min-height:0; margin-top:-16px; border-radius:18px 18px 0 0;
      background:var(--color-bg); box-shadow:0 -1px 0 var(--color-divider); overflow-y:auto; overscroll-behavior:contain;}
    .p-head{padding:16px 16px 0;}
    .p-body{flex:none; min-height:auto; overflow:visible; padding:0 6px 12px;}
    .dock{position:relative; left:auto; right:auto; bottom:auto; flex:none; border-radius:0; flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom); background:var(--color-surface); box-shadow:0 -1px 0 var(--color-divider);}
    .dial{padding:8px 16px 0; gap:4px;}
    .dial-top b{font-size:14px;}
    .track{height:62px;}
    .blocks,.blk{height:22px;}
    .ruler,.past{top:28px;} .nowmark{top:24px;} .nowmark span{top:38px;}
    .hours{top:42px;}
    .handle{top:20px; height:26px;} .handle span{top:24px; height:20px;}
    .dial-input{top:18px;}
    .dial-top .muted{display:none;}
    .dial-flat{display:none;}
    .nb{padding:8px 12px 10px 16px; box-shadow:none; justify-content:space-between;}
    .nb-t{max-width:none; flex:1; min-width:0;}
    .pop{position:fixed; top:auto; right:12px; left:12px; bottom:12px; width:auto; margin:0; z-index:30; max-height:70vh; overflow-y:auto;
      background:var(--color-surface);}
    .pop .art{height:120px;}
    .plan{position:fixed; inset:0; width:auto; border-radius:0; z-index:35; padding-top:env(safe-area-inset-top);}
    .plan-scroll{padding:18px 20px 16px;}
    .plan-h h2{font-size:30px;}
    .plan-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom));}
    body.plan-open .where{right:var(--gap);}
    .sheet{left:0; right:0; top:auto; bottom:0; transform:none; width:auto; max-height:88vh; border-radius:18px 18px 0 0; padding-bottom:env(safe-area-inset-bottom);}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
</style>
</head>
<body>
<div class="app">
  <div id="map" role="region" aria-label="Map of places and events"></div>
  <button class="where" id="wherePill" aria-label="Where Roamly looks. Change"><i class="ph ph-map-pin" aria-hidden="true"></i><span>Set a place</span></button>

  <aside class="panel float" aria-label="What's on near you">
    <div class="p-head">
      <div class="brandrow">
        <a href="/" aria-label="Roamly home"><img src="/brand/logo-white.svg" alt="Roamly" width="64" height="22"></a>
        <div class="acts">
          <button class="ibtn" id="savedBtn" aria-label="Saved plans" aria-pressed="false"><i class="ph ph-bookmark-simple" aria-hidden="true"></i><span class="count" data-saved-count></span></button>
          <button class="avatar" data-menu data-initial aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">R</button>
        </div>
      </div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <input id="q" aria-label="Search places and events, or ask Roamly" placeholder="Search, or ask: “quiet bar near Ossington”" maxlength="300" />
        <button class="go" id="goBtn" type="submit" aria-label="Search"><i class="ph ph-arrow-right" aria-hidden="true"></i></button>
      </form>
      <div class="reply" id="reply" hidden aria-live="polite"></div>
      <div class="seg3" role="tablist" aria-label="When" id="winTabs"></div>
    </div>
    <div class="p-body" id="pbody" aria-live="polite"></div>
  </aside>

  <section class="pop" id="pop" hidden aria-label="Selected place"></section>

  <div class="dock float" id="dock">
    <div class="dial" id="dial"></div>
    <div class="nb" id="nb"></div>
  </div>

  <aside class="plan" id="plan" hidden aria-label="Your night"></aside>
</div>

<!-- settings: the dashed values in "For 2 · walking · $100" -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head"><h2 id="sheetTitle">Your night</h2>
    <button class="ibtn" id="sheetClose" aria-label="Close settings"><i class="ph ph-x" aria-hidden="true"></i></button></div>
  <p class="sheet-sub">Every plan starts from these. Changes apply right away.</p>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="link" id="sheetReset">Reset to my defaults</button>
    <button class="btn btn-primary" id="sheetDone">Done</button>
  </div>
</section>

<div class="menu" id="menu" role="menu" aria-label="Account" hidden>
  <div class="who"><b data-name>Your account</b><span data-handle></span></div>
  <button role="menuitem" id="menuSettings"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i> Plan settings</button>
  <button role="menuitem" id="menuSaved"><i class="ph ph-bookmark-simple" aria-hidden="true"></i> Saved plans</button>
  <a role="menuitem" href="profile.html"><i class="ph ph-sparkle" aria-hidden="true"></i> My taste</a>
  <a role="menuitem" href="submit-event.html"><i class="ph ph-megaphone" aria-hidden="true"></i> List an event</a>
  <a role="menuitem" href="admin.html" id="adminLink" hidden><i class="ph ph-chart-bar" aria-hidden="true"></i> Admin dashboard</a>
  <button role="menuitem" id="resetBtn"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i> Start over</button>
  <button role="menuitem" id="signOutBtn"><i class="ph ph-sign-out" aria-hidden="true"></i> Sign out</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="sr" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = window.API_BASE;
const $ = id => document.getElementById(id);
// The planner is members-only: requires the account token from auth.html.
const token = () => localStorage.getItem('trek_token');
const authHeaders = () => token() ? { 'Authorization': 'Bearer ' + token() } : {};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (name, cls = '') => `<i class="ph ph-${name}${cls ? ' ' + cls : ''}" aria-hidden="true"></i>`;
const icf = name => `<i class="ph-fill ph-${name}" aria-hidden="true"></i>`;
// Links from third parties (OSM website tags, organizer-submitted listings) only
// get http(s) — a javascript: URL in an href would run code on tap.
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : null;
const USER_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ return null; } })();
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const fmtKm = km => (Math.round(km * 10) / 10) + ' km';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const phoneMq = matchMedia('(max-width:859px)');
const phone = () => phoneMq.matches;
const TORONTO = [43.6487, -79.3960];

let messages = [];           // typed turns {role, content}
let convoStart = 0;          // where the current request starts (after the last plan/events result)
let askedKeys = [];          // questions Roamly already asked — never asked twice

/* ================= time: clocks, the night's span, opening hours ================= */
const pad = n => String(n).padStart(2, '0');
function fmtClock(min, short){           // minutes of the day → "9 PM" / "9:30 PM", or short "9:00" / "9:30"
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  const h = Math.floor(min / 60), m = min % 60, h12 = h % 12 || 12;
  return short ? `${h12}:${pad(m)}` : `${h12}${m ? ':' + pad(m) : ''} ${h < 12 ? 'AM' : 'PM'}`;
}
function parseClock(s){                  // "7:15 PM" | "19:15" | "19:15:00" → minutes of the day
  const m = String(s || '').trim().match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*([ap]\.?m\.?)?$/i);
  if (!m) return null;
  let h = +m[1]; const mi = +(m[2] || 0);
  if (m[3]){ const pm = /p/i.test(m[3]); if (h === 12) h = 0; if (pm) h += 12; }
  return h < 24 && mi < 60 ? h * 60 + mi : null;
}
const minOfDay = d => d.getHours() * 60 + d.getMinutes();
// The dial runs 6 PM → 2 AM. Until 2 AM "tonight" is still last night; after
// that (when the dial's span is over) it's the evening coming up.
const DIAL_SPAN = 480;
function nightBase(){
  const n = new Date(), b = new Date(n);
  if (n.getHours() < 2) b.setDate(b.getDate() - 1);
  b.setHours(18, 0, 0, 0); return b;
}
const atDial = v => new Date(nightBase().getTime() + v * 60000);
const dialOf = date => (date.getTime() - nightBase().getTime()) / 60000;
const relClock = min => min >= 360 ? min - 1080 : min + 360;   // clock minutes → minutes after 6 PM

/* A JS port of the backend's OpenStreetMap opening_hours reader (services/opening_hours.py):
   "Mo-Th,Su 11:00-23:00; Fr-Sa 11:00-02:00" etc. Anything it can't read → unknown. */
const OH_DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];
function ohDays(spec){
  if (!spec) return [0,1,2,3,4,5,6];
  const out = new Set();
  for (const part of spec.replace(/\s/g, '').split(',')){
    if (part.includes('-')){
      const [a, b] = part.split('-'), i = OH_DAYS.indexOf(a), j = OH_DAYS.indexOf(b);
      if (i < 0 || j < 0) return null;
      for (let k = i; ; k = (k + 1) % 7){ out.add(k); if (k === j) break; }
    } else if (OH_DAYS.includes(part)) out.add(OH_DAYS.indexOf(part));
    else return null;
  }
  return [...out];
}
function ohRanges(times){
  times = times.trim().toLowerCase();
  if (times === 'off' || times === 'closed') return [];
  const out = [];
  for (const part of times.split(',')){
    const m = part.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/);
    if (!m) return null;
    const s = +m[1] * 60 + +m[2]; let e = +m[3] * 60 + +m[4];
    if (e <= s) e += 1440;
    out.push([s, e]);
  }
  return out;
}
const ohCache = new Map();
function ohSchedule(spec){
  spec = (spec || '').trim();
  if (!spec) return null;
  if (ohCache.has(spec)) return ohCache.get(spec);
  let week = {};
  if (spec === '24/7'){ for (let d = 0; d < 7; d++) week[d] = [[0, 1440]]; }
  else {
    const rules = spec.split(';').flatMap(r => r.split(/,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su)\b)/)).map(s => s.trim()).filter(Boolean);
    for (let rule of rules){
      if (/\b(?:PH|SH)\b/.test(rule)){
        const head = rule.split(' ')[0];
        const days = head.split(',').filter(d => !/^(?:PH|SH)$/.test(d.trim()));
        if (!days.length || head === rule) continue;
        rule = days.join(',') + rule.slice(head.length);
      }
      const m = rule.match(/^(?:([A-Za-z]{2}(?:\s*[-,]\s*[A-Za-z]{2})*)\s+)?(.+)$/);
      const days = m && ohDays(m[1]), ranges = m && ohRanges(m[2]);
      if (!days || !ranges){ week = null; break; }
      days.forEach(d => { week[d] = ranges; });
    }
  }
  ohCache.set(spec, week);
  return week;
}
// → { open:true, end } (end in clock minutes) | { open:false } | null when unknown
function openAt(spec, date){
  const week = ohSchedule(spec); if (!week) return null;
  const m = minOfDay(date), wd = (date.getDay() + 6) % 7, yd = (wd + 6) % 7;
  for (const [s, e] of week[wd] || []) if (s <= m && m < e) return { open:true, end:e % 1440 };
  for (const [s, e] of week[yd] || []) if (e > 1440 && m < e - 1440) return { open:true, end:e - 1440 };
  return { open:false };
}

/* ================= location ================= */
let locState = 'off';                     // off | busy | on | unsupported
function getLoc(){
  if (!navigator.geolocation){ locState = 'unsupported'; syncLoc(); return; }
  locState = 'busy'; syncLoc();
  navigator.geolocation.getCurrentPosition(
    p => { userLoc = { lat:p.coords.latitude, lng:p.coords.longitude }; locState = 'on'; needWhere = false; syncLoc();
           if (!sheetOpen) resumePending(); },
    () => { userLoc = null; locState = 'off'; syncLoc(); if (!sheetOpen) pending = null; },
    { enableHighAccuracy:true, timeout:10000, maximumAge:300000 }
  );
}
function toggleLoc(){
  if (userLoc || locState === 'busy'){ userLoc = null; locState = 'off'; syncLoc(); }
  else getLoc();
}
function syncLoc(){
  if (!ready) return;
  renderCtx();
  if (sheetOpen) renderSection('location');
}
const hasWhere = () => !!(userLoc || (ready && ready.location));

/* ================= planning state: the single source of truth ================= */
// Stable traits come from the taste profile (profile.html); the sheet holds what is
// different *this time*. Every tap, every typed message (via the server's
// `understood`) and every tweak writes here, and every plan reads from here.
const READY = {
  group_type: { options:[['solo','Solo'],['date','Date'],['friends','Friends'],['family','Family']] },
  vibe:       { options:[['chill','Chill'],['romantic','Romantic'],['adventurous','Adventurous'],['extravagant','Fancy'],['night_out','Night out']] },
  budget:     { options:[[50,'$50'],[100,'$100'],[200,'$200'],[500,'$500']] },
  time_of_day:{ options:[['morning','Full day'],['afternoon','Afternoon'],['evening','Tonight'],['night','Late night']] },
  transport:  { options:[['walk','Walk'],['transit','Transit'],['car','Car']] },
};
const PARTY = { solo:1, date:2, friends:4, family:4 };
const RADIUS_MIN = 1, RADIUS_MAX = 20;
const TRANSPORT_KM = { walk:2, transit:7, car:15 };
const BUDGET_MAX = 10000, PARTY_MAX = 20;
const SECTION = { location:['map-pin','Where'], radius_km:['circle-dashed','How far'], budget:['wallet','Budget'], time_of_day:['clock','When'],
                  group_type:['users','Who'], vibe:['sparkle','Mood'], transport:['path','Getting there'], interests:['magnifying-glass','Looking for'] };
const CTX_ORDER = ['location','radius_km','budget','time_of_day','group_type','vibe','transport','interests'];
const PLAIN = {
  time_of_day:{ morning:'full day', afternoon:'afternoon', evening:'tonight', night:'late night' },
  group_type:{ solo:'solo', date:'date', friends:'friends', family:'family' },
  vibe:{ chill:'chill', romantic:'romantic', adventurous:'adventurous', extravagant:'fancy', night_out:'night out' },
  transport:{ walk:'walking', transit:'transit', car:'driving' },
};
let profile = null, ready = null, budgetTouched = false, radiusTouched = false, sheetOpen = false,
    needWhere = false, edited = false, pending = null;

function ctxText(key){
  const v = ready[key];
  if (key === 'location'){
    if (v) return v;
    return { on:'Near you', busy:'Finding you…', unsupported:'Set a place' }[locState] || 'Set a place';
  }
  if (key === 'budget') return `$${Math.round(v).toLocaleString()}`;
  if (key === 'radius_km') return fmtKm(v);
  if (key === 'interests') return v || '';
  return (PLAIN[key] || {})[v] || 'any';
}
function defaultsFrom(p){
  const d = (p && p.defaults) || {};
  const st = { group_type: d.group_type || 'date', vibe: d.vibe || 'chill', time_of_day: d.time_of_day || 'evening',
               transport: d.transport || 'transit', location: '', interests: '', avoid: '', dietary: '' };
  st.party_size = d.party_size || PARTY[st.group_type] || 2;
  st.budget = Math.round(d.budget || 100);
  st.radius_km = clamp(d.radius_km || TRANSPORT_KM[st.transport] || 7, RADIUS_MIN, RADIUS_MAX);
  return st;
}
function readyPrefs(){
  const prefs = { group_type: ready.group_type, party_size: ready.party_size, vibe: ready.vibe,
                  budget: ready.budget, time_of_day: ready.time_of_day, transport: ready.transport,
                  radius_km: ready.radius_km };
  if (ready.location) prefs.location = ready.location;
  if (ready.interests) prefs.interests = ready.interests;
  if (ready.avoid) prefs.avoid = ready.avoid;
  if (ready.dietary) prefs.dietary = ready.dietary;
  return prefs;
}
/* Everything that shows the planning state re-reads it from here. */
function renderCtx(){
  if (!ready) return;
  const pill = $('wherePill');
  pill.querySelector('span').textContent = `${ctxText('location')} · ${fmtKm(ready.radius_km)}`;
  pill.classList.toggle('need', needWhere && !hasWhere());
  document.querySelectorAll('[data-ctxline]').forEach(el => { el.innerHTML = ctxLineHtml(); wireCtxLine(el); });
  queueFeedRefresh();
}
const updateCtxChip = () => { $('wherePill').querySelector('span').textContent = `${ctxText('location')} · ${fmtKm(ready.radius_km)}`; };
/* "For 2 · walking · about $100 · near you" — each dashed value opens its setting. */
function ctxLineHtml(){
  const b = (k, t) => `<button data-k="${k}" aria-label="${esc(SECTION[k][1])}: ${esc(t)}. Change">${esc(t)}</button>`;
  const pp = ready.party_size;
  return `For ${b('group_type', pp === 1 ? 'just you' : `${pp}`)} · ${b('transport', ctxText('transport'))} · about ${b('budget', ctxText('budget'))}${pp > 1 ? ' total' : ''} · ${b('vibe', ctxText('vibe'))} · ${b('location', ready.location || (userLoc ? 'near you' : 'set a place'))}`;
}
function wireCtxLine(el){ el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => openSheet(b.dataset.k)); }

/* ---- the settings sheet ---- */
let lastFocus = null;
function openSheet(focusKey){
  if (!ready) return;
  if (!sheetOpen) lastFocus = document.activeElement;
  sheetOpen = true; closeMenu();
  $('sheetBg').hidden = false; $('sheet').hidden = false;
  renderSheet();
  $('sheetDone').textContent = pending ? 'Continue' : 'Done';
  const sec = focusKey && $('sec-' + focusKey);
  if (sec){ sec.scrollIntoView({ block:'center' }); flashSec(sec); }
  if (focusKey === 'location'){ const i = $('cityInput'); if (i && !userLoc) i.focus(); else $('sheetClose').focus(); }
  else $('sheetClose').focus();
}
function closeSheet(){
  if (!sheetOpen) return;
  sheetOpen = false;
  $('sheetBg').hidden = true; $('sheet').hidden = true;
  renderCtx();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  resumePending();
}
/* An action that was waiting for a place carries on by itself once there is one. */
function resumePending(){
  if (!pending) return;
  if (hasWhere()){ const a = pending; pending = null; a(); }
  else if (locState !== 'busy') pending = null;
}
function needLocation(action){
  needWhere = true; pending = action || null; renderCtx(); openSheet('location');
}
function flashSec(sec){ if (!sec) return; sec.classList.remove('hl'); void sec.offsetWidth; sec.classList.add('hl'); }
function renderSheet(){
  if (!ready) return;
  $('sheetBody').innerHTML = CTX_ORDER.map(k =>
    `<section class="sec" id="sec-${k}" aria-labelledby="h-${k}"><h3 id="h-${k}">${ic(SECTION[k][0])} ${esc(SECTION[k][1])}</h3><div class="sec-body"></div></section>`).join('');
  CTX_ORDER.forEach(renderSection);
}
/* Budget stays a per-person spend when the crew size changes — unless the user set one. */
function rescaleBudget(){
  const pp = profile && profile.defaults && profile.defaults.budget_per_person;
  if (pp && !budgetTouched) ready.budget = Math.round(pp * ready.party_size);
}
function chipsFor(key, box, after){
  READY[key].options.forEach(([v, label]) => {
    const c = document.createElement('button');
    c.className = 'chip' + (ready[key] === v ? ' on' : ''); c.textContent = label;
    c.setAttribute('aria-pressed', ready[key] === v);
    c.onclick = () => { ready[key] = v; edited = true; after && after(v); renderSection(key); renderCtx(); };
    box.appendChild(c);
  });
}
function renderSection(k){
  const box = document.querySelector(`#sec-${k} .sec-body`);
  if (!box) return;
  box.innerHTML = '';

  if (k === 'location'){
    const status = { on:'Using your approximate current location', busy:'Finding you…',
                     unsupported:"This browser can't share location — type a place instead",
                     off:"Your live location isn't being used" }[locState];
    box.innerHTML = `
      ${needWhere && !hasWhere() ? '<div class="need">Tell me where first — turn on live location or type a place.</div>' : ''}
      <div class="switch-row">
        <div><b>Use my live location</b><small>${esc(status)}</small></div>
        <button class="switch" id="locSwitch" role="switch" aria-checked="${locState === 'on' || locState === 'busy'}"
                aria-label="Use my live location" ${locState === 'unsupported' ? 'disabled' : ''}></button>
      </div>
      <label class="field">Or plan around a place
        <input class="input" id="cityInput" placeholder="City or neighbourhood, e.g. Queen West" value="${esc(ready.location)}" maxlength="100" />
      </label>
      ${ready.location ? `<div class="hint">“${esc(ready.location)}” is used instead of your live location. <button class="link" id="clearCity">Use live location</button></div>` : ''}`;
    box.querySelector('#locSwitch').onclick = () => toggleLoc();
    const inp = box.querySelector('#cityInput');
    inp.oninput = () => { ready.location = inp.value.trim(); edited = true; updateCtxChip(); };
    inp.onchange = () => { if (ready.location) needWhere = false; renderSection('location'); renderCtx(); };
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); if (ready.location){ needWhere = false; closeSheet(); } } };
    const clr = box.querySelector('#clearCity');
    if (clr) clr.onclick = () => { ready.location = ''; if (!userLoc) getLoc(); renderSection('location'); renderCtx(); };
    return;
  }

  if (k === 'radius_km'){
    box.innerHTML = `
      <div class="row">
        <input type="range" id="radiusSlider" min="${RADIUS_MIN}" max="${RADIUS_MAX}" step="0.5" value="${ready.radius_km}"
               aria-label="Search radius in kilometres" aria-valuetext="${fmtKm(ready.radius_km)}" />
        <b id="radiusVal">${fmtKm(ready.radius_km)}</b>
      </div>
      <div class="hint" id="radiusHint">Roamly looks within about ${fmtKm(ready.radius_km)} of your starting point.</div>
      ${Object.entries(TRANSPORT_KM).map(([m, km]) =>
        `<button class="chip${ready.radius_km === km ? ' on' : ''}" data-km="${km}" aria-pressed="${ready.radius_km === km}">${READY.transport.options.find(([v]) => v === m)[1]} · ~${km} km</button>`).join('')}`;
    const sl = box.querySelector('#radiusSlider');
    const show = () => {
      ready.radius_km = clamp(parseFloat(sl.value) || RADIUS_MIN, RADIUS_MIN, RADIUS_MAX);
      sl.setAttribute('aria-valuetext', fmtKm(ready.radius_km));
      box.querySelector('#radiusVal').textContent = fmtKm(ready.radius_km);
      box.querySelector('#radiusHint').textContent = `Roamly looks within about ${fmtKm(ready.radius_km)} of your starting point.`;
      box.querySelectorAll('[data-km]').forEach(c => { const on = parseFloat(c.dataset.km) === ready.radius_km; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
      updateCtxChip();
    };
    sl.oninput = show;
    sl.onchange = () => { show(); radiusTouched = edited = true; renderCtx(); };
    box.querySelectorAll('[data-km]').forEach(c => c.onclick = () => {
      ready.radius_km = parseFloat(c.dataset.km); radiusTouched = edited = true; renderSection('radius_km'); renderCtx();
    });
    return;
  }

  if (k === 'budget'){
    chipsFor('budget', box, () => { budgetTouched = true; });
    const row = document.createElement('div'); row.className = 'row';
    row.style.display = 'flex'; row.style.alignItems = 'center';
    row.innerHTML = `<label class="money">$<input type="number" id="budgetInput" inputmode="numeric" min="0" max="${BUDGET_MAX}" step="5"
        value="${Math.round(ready.budget)}" aria-label="Custom total budget in dollars" /></label>
      <span class="hint" id="budgetHint"></span>`;
    box.appendChild(row);
    const inp = row.querySelector('#budgetInput'), hint = row.querySelector('#budgetHint');
    const each = () => {
      const n = ready.party_size;
      hint.textContent = n > 1 ? `total for ${n} · ≈ $${Math.round(ready.budget / n)} each` : 'total for you';
    };
    inp.oninput = () => {
      const v = parseFloat(inp.value);
      if (isNaN(v)) return;
      ready.budget = clamp(Math.round(v), 0, BUDGET_MAX); budgetTouched = edited = true; each();
      box.querySelectorAll('.chip').forEach(c => { const on = c.textContent === `$${ready.budget}`; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
    };
    inp.onchange = () => renderCtx();
    each();
    return;
  }

  if (k === 'group_type'){
    chipsFor('group_type', box, v => { ready.party_size = PARTY[v] || 2; rescaleBudget(); renderSection('budget'); });
    const row = document.createElement('div'); row.className = 'row stepper';
    row.style.display = 'flex'; row.style.alignItems = 'center';
    row.innerHTML = `<span>People</span>
      <button type="button" data-d="-1" aria-label="Fewer people">−</button>
      <b id="partyVal" aria-live="polite">${ready.party_size}</b>
      <button type="button" data-d="1" aria-label="More people">+</button>`;
    box.appendChild(row);
    row.querySelectorAll('[data-d]').forEach(btn => btn.onclick = () => {
      ready.party_size = clamp(ready.party_size + parseInt(btn.dataset.d, 10), 1, PARTY_MAX);
      if (ready.party_size === 1) ready.group_type = 'solo';
      else if (ready.group_type === 'solo') ready.group_type = ready.party_size === 2 ? 'date' : 'friends';
      edited = true; rescaleBudget();
      renderSection('group_type'); renderSection('budget'); renderCtx();
    });
    return;
  }

  if (k === 'transport'){
    chipsFor('transport', box, v => { if (!radiusTouched){ ready.radius_km = TRANSPORT_KM[v]; renderSection('radius_km'); } });
    return;
  }

  if (k === 'interests'){
    box.innerHTML = `<label class="field">Anything specific?
        <input class="input" id="interestsInput" placeholder="e.g. sushi, karaoke, rooftop patio" value="${esc(ready.interests || '')}" maxlength="120" />
      </label><div class="hint">Roamly looks for these first. Leave empty for a good mix.</div>`;
    const inp = box.querySelector('#interestsInput');
    inp.oninput = () => { ready.interests = inp.value.trim(); edited = true; };
    inp.onchange = () => renderCtx();
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); } };
    return;
  }
  chipsFor(k, box);                                      // time_of_day, vibe
}

/* Settings Roamly understood from a typed message ("cheap sushi date in Kensington")
   become the state's values; returns which ones changed so the reply can show them. */
function applyUnderstood(u){
  if (!u || !ready) return [];
  const before = {}; CTX_ORDER.forEach(k => before[k] = ctxText(k));
  ['group_type','vibe','time_of_day','transport'].forEach(k => { if (u[k]) ready[k] = u[k]; });
  if (u.party_size) ready.party_size = clamp(u.party_size, 1, PARTY_MAX);
  if (u.budget){ ready.budget = Math.round(u.budget); budgetTouched = true; }
  if (u.radius_km){ ready.radius_km = clamp(u.radius_km, RADIUS_MIN, RADIUS_MAX); radiusTouched = true; }
  if (u.location){ ready.location = u.location; needWhere = false; }
  if (typeof u.interests === 'string') ready.interests = u.interests;
  if (typeof u.avoid === 'string') ready.avoid = u.avoid;            // "no bars" keeps applying
  if (typeof u.dietary === 'string') ready.dietary = u.dietary;
  if (sheetOpen) renderSheet();
  renderCtx();
  return CTX_ORDER.filter(k => ctxText(k) && ctxText(k) !== before[k]);
}

/* ================= the map ================= */
let map = null, itemLayer = null, routeLayer = null, fittedKey = null;
function initMap(){
  if (!window.L){ $('map').innerHTML = ''; return; }
  map = L.map('map', { zoomControl:false, attributionControl:true, zoomSnap:0.5 }).setView(TORONTO, 13);
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  L.control.zoom({ position:'topright' }).addTo(map);
  itemLayer = L.layerGroup().addTo(map);
  routeLayer = L.layerGroup().addTo(map);
  map.on('click', () => { if (selected) select(null); });
}
// The map's open area: around the floating panels, not under them.
function fitPad(){
  if (phone()) return { paddingTopLeft:[24, 56], paddingBottomRight:[24, 28] };
  const right = planUi.open ? 440 + 48 : selected ? 340 + 40 : 60;
  return { paddingTopLeft:[392 + 48, 60], paddingBottomRight:[right, 190] };
}
function fitTo(pts, maxZoom = 16){
  if (!map || !pts.length) return;
  if (pts.length === 1){ map.setView(pts[0], Math.min(maxZoom, 15)); return; }
  map.fitBounds(L.latLngBounds(pts), { ...fitPad(), maxZoom });
}
function pinClass(it){
  return ['pin', it.type === 'event' ? 'ev' : '', it.lit ? 'on' : '', inNight(it) ? 'in' : '',
          selected && selected.id === it.id ? 'sel' : '', hot === it.id ? 'hot' : '', it.vis === false ? 'off' : ''].filter(Boolean).join(' ');
}
function syncMarkers(){
  if (!map) return;
  itemLayer.clearLayers();
  srcItems().forEach(it => {
    if (it.lat == null || it.lng == null) return;
    const m = L.marker([it.lat, it.lng], { icon:L.divIcon({ className:'', html:`<span class="${pinClass(it)}"></span>`, iconSize:[14,14], iconAnchor:[7,7] }),
      keyboard:false, title:it.name, riseOnHover:true });

function drawRoute(){

  const stops = (plan.stops || []).filter(s => s.lat != null && s.lng != null);
  if (!stops.length) return;

/* ================= the feed: events + nightlife, one list ================= */
const WINDOWS = [['tonight','Tonight'],['now','Now'],['weekend','Weekend']];
const WINDOW_TEXT = { now:'right now', tonight:'tonight', weekend:'this weekend' };
const NL_WIN = { now:'tonight', tonight:'tonight', weekend:'weekend' };
const KIND = { clubs:['disco-ball','Club'], lgbtq:['rainbow','LGBTQ+ bar'], music:['music-notes','Live music'], comedy:['microphone-stage','Comedy & karaoke'],
               lounges:['martini','Lounge'], bars:['beer-stein','Bar'] };
const SOURCE_LABEL = { ticketmaster:'via Ticketmaster', city_toronto:'City of Toronto festivals calendar', roamly:'Listed on Roamly', seatgeek:'' };
/* SeatGeek's API terms: their logo, linked to their home page, on everything of theirs we show. */
const SG_LOGO = () => `<a class="sg-link" href="https://seatgeek.com" target="_blank" rel="noopener" aria-label="SeatGeek"><img class="sg-logo" src="seatgeek-logo.svg" alt="SeatGeek"></a>`;
const LIST_PAGE = 50;

let feed = { win:'tonight', filter:'all', events:null, spots:null, evMsg:'', evType:'events', kinds:[], day:null, covered:true, ticketed:true,
             key:null, ts:0, seq:0, err:{}, search:null, page:LIST_PAGE };
let items = [];                 // normalized feed (or search results)
let panelMode = 'list';         // list | saved
let selected = null, hot = null;
let dial = { on:true, v:180 };
let feedRefreshT;

function feedKey(){
  return [feed.win, ready.radius_km, ready.location || (userLoc ? userLoc.lat.toFixed(3) + ',' + userLoc.lng.toFixed(3) : '')].join('|');
}
function queueFeedRefresh(){
  clearTimeout(feedRefreshT);
  feedRefreshT = setTimeout(() => { if (ready && feed.shown !== feedKey()) loadFeed(); }, 600);
}
const walkText = km => km == null ? '' : (km <= 2.5 ? `${Math.max(1, Math.round(km * 12.5))} min` : `${km} km`);

/* "On now" / "Starts in 40 min" / "9:30 PM" — worked out here, so it stays right. */
function evWhen(ev){
  const parts = [];
  if (ev.date){ const d = new Date(ev.date + 'T00:00'); parts.push(d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' })); }
  if (ev.time) parts.push(fmtClock(parseClock(ev.time) ?? 0));
  return parts.join(' · ');
}
function evStatus(ev){
  const now = Date.now(), st = ev.start ? Date.parse(ev.start) : NaN, en = ev.end ? Date.parse(ev.end) : NaN;
  if (isNaN(st)) return { live:false, text: evWhen(ev) };
  if (st <= now && (isNaN(en) || en >= now)) return { live:true, text:'On now' };
  const mins = Math.round((st - now) / 60000);
  if (mins > 0 && mins < 90) return { live:false, text:`Starts in ${mins} min` };
  // in the place's time zone (a Toronto 10 PM show is 10 PM, whatever zone the phone is in)
  const zone = ev.tz ? { timeZone: ev.tz } : {}, d = new Date(st);
  const day = x => x.toLocaleDateString('en-CA', zone), today = day(d) === day(new Date());
  return { live:false, text: (today ? '' : d.toLocaleDateString(undefined, { weekday:'short', ...zone }) + ' · ')
    + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit', ...zone }) };
}
function evPrice(ev){
  return ev.free ? 'Free' : ev.price_min ? `$${Math.round(ev.price_min)}${ev.price_max && ev.price_max !== ev.price_min ? '–' + Math.round(ev.price_max) : '+'}` : '';
}
function normEvent(ev){
  return { id:`e|${ev.name}|${ev.start || ev.date || ''}`, type:'event', name:ev.name, lat:ev.lat, lng:ev.lng, km:ev.distance_km,
           img:safeUrl(ev.image), icon:'ticket', raw:ev, sg:ev.source === 'seatgeek',
           startMs:ev.start ? Date.parse(ev.start) : NaN, endMs:ev.end ? Date.parse(ev.end) : NaN };
}
function normSpot(s){
  return { id:`s|${s.id || s.name}`, type:'spot', name:s.name, lat:s.lat, lng:s.lng, km:s.distance_km, img:safeUrl(s.image),
           icon:(KIND[s.kind] || ['moon-stars'])[0], raw:s };
}
function rebuildItems(){
  if (feed.search) items = (feed.search.events || []).map(normEvent);
  else items = [...(feed.events || []).map(normEvent), ...(feed.spots || []).map(normSpot)];
  const seen = new Set(); items = items.filter(it => !seen.has(it.id) && seen.add(it.id));
  if (selected) selected = items.find(i => i.id === selected.id) || selected;
}
const srcItems = () => items;

/* The time dial: is this open / on at that hour? */
const dialActive = () => feed.win !== 'weekend' && dial.on && !feed.search;
function itemAt(it, at){
  if (it.type === 'event'){
    const st = it.startMs, en = it.endMs, t = at.getTime();
    if (isNaN(st)) return { ok:true, lit:false };
    if (!isNaN(en)) return { ok: st <= t + 60 * 60000 && en >= t, lit: st <= t && en >= t };
    return { ok: st <= t + 90 * 60000 && st >= t - 150 * 60000, lit: st <= t && st >= t - 150 * 60000 };
  }
  const o = openAt(it.raw.hours, at);
  if (!o) return { ok: it.raw.open_tonight !== false, lit:false, unknown:true };
  return { ok:o.open, lit:o.open, end:o.end };
}
function spotLine(it, at){
  const s = it.raw, kind = (KIND[s.kind] || [])[1] || (s.categories && s.categories[0] ? cap(String(s.categories[0]).replace(/_/g, ' ')) : 'Night spot');
  let when = '';
  if (at){
    const o = openAt(s.hours, at);
    if (o && o.open) when = `open till ${fmtClock(o.end)}`;
    else if (o) when = 'closed then';
  } else if (s.open_tonight === true) when = 'open tonight';
  const ev = (s.events || [])[0];
  return [kind, ev ? ev.name : when].filter(Boolean).join(' · ');
}
function rowSub(it, at){
  if (it.type === 'event'){
    const ev = it.raw, st = evStatus(ev);
    return { text:[ev.venue, st.text, evPrice(ev)].filter(Boolean).join(' · '), live:st.live };
  }
  return { text:spotLine(it, at), live:false };
}
function visibleItems(){
  const at = dialActive() ? atDial(dial.v) : null;
  return srcItems().filter(it => {
    if (feed.filter === 'events' && it.type !== 'event') return false;
    if (feed.filter !== 'all' && feed.filter !== 'events' && (it.type !== 'spot' || it.raw.kind !== feed.filter)) return false;
    if (!at){ it.lit = it.type === 'event' && evStatus(it.raw).live; return true; }
    const r = itemAt(it, at); it.lit = r.lit; return r.ok;
  });
}

function renderWinTabs(){
  $('winTabs').innerHTML = WINDOWS.map(([w, l]) => `<button role="tab" data-w="${w}" aria-selected="${feed.win === w}">${l}</button>`).join('');
  $('winTabs').querySelectorAll('[data-w]').forEach(b => b.onclick = () => setWindow(b.dataset.w));
}
function setWindow(w){
  if (feed.win === w && !feed.search) return;
  feed.win = w; feed.search = null; feed.filter = 'all';
  if (w === 'now'){ dial.on = true; dial.v = clamp(Math.round(dialOf(new Date()) / 15) * 15, 0, DIAL_SPAN); }
  renderWinTabs(); loadFeed(); renderDock();
}

async function loadFeed(force){
  if (!ready) return;
  feed.shown = feedKey();
  if (panelMode !== 'list') return;
  if (!hasWhere()){ renderList(); return; }
  if (!token()){ requireSignIn(); return; }
  const key = feedKey();
  if (!force && feed.key === key && feed.events && feed.spots && Date.now() - feed.ts < 5 * 60000){ rebuildItems(); syncMarkers(); renderList(); return; }
  const seq = ++feed.seq;
  feed.events = null; feed.spots = null; feed.err = {}; feed.page = LIST_PAGE;
  rebuildItems(); syncMarkers(); renderList();
  const evPrefs = { mode: feed.win, radius_km: ready.radius_km };
  if (ready.location) evPrefs.location = ready.location;
  const q = new URLSearchParams({ window: NL_WIN[feed.win], radius_km: clamp(ready.radius_km, 1, 25), tz: USER_TZ || '' });
  if (ready.location) q.set('location', ready.location);
  else if (userLoc){ q.set('lat', userLoc.lat); q.set('lng', userLoc.lng); }
  const done = () => {
    if (seq !== feed.seq) return;
    // fold nightlife's club nights into the event list (deduped by name + start), whichever answer lands last
    if (feed.nlEvents && feed.events){
      const have = new Set(feed.events.map(e => `${e.name}|${e.start || e.date || ''}`));
      feed.nlEvents.forEach(e => { if (!have.has(`${e.name}|${e.start || e.date || ''}`)) feed.events.push(e); });
      feed.nlEvents = null;
    }
    if (feed.events && feed.spots){ feed.key = key; feed.ts = Date.now(); }
    rebuildItems(); syncMarkers(); renderList();
    if (feed.events && feed.spots && fittedKey !== key){
      fittedKey = key;
      const pts = items.filter(i => i.lat != null).slice(0, 80).map(i => [i.lat, i.lng]);
      if (pts.length) fitTo(pts, 15); else if (userLoc && map) map.setView([userLoc.lat, userLoc.lng], 14);
    }
  };
  apiFetch(`${API}/plan/chat`, { method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({ messages:[], prefs:evPrefs, lat:userLoc && userLoc.lat, lng:userLoc && userLoc.lng, tz: USER_TZ }) })
    .then(async r => {
      if (seq !== feed.seq) return;
      if (r.status === 401){ feed.events = []; requireSignIn(); return; }
      const res = await r.json();
      feed.evType = res.type; feed.evMsg = res.message || '';
      feed.events = res.type === 'events' ? (res.events || []) : [];
    })
    .catch(e => { if (seq === feed.seq){ feed.events = []; feed.err.events = e; } })
    .finally(done);
  apiFetch(`${API}/nightlife?${q}`, { headers:{ ...authHeaders() } })
    .then(async r => {
      if (seq !== feed.seq) return;
      if (r.status === 401){ feed.spots = []; requireSignIn(); return; }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'failed');
      const res = await r.json();
      // club nights + the club index, both on the map
      feed.spots = res.spots || []; feed.kinds = res.kinds || []; feed.day = res.special_day || null;
      feed.covered = res.covered !== false; feed.ticketed = res.ticketed !== false;
      feed.nlEvents = res.events || [];
    })
    .catch(e => { if (seq === feed.seq){ feed.spots = []; feed.nlEvents = null; feed.err.spots = e; } })
    .finally(done);
}

function skeletonRows(n = 5){
  return Array.from({ length:n }, () => `<div class="skel-row" aria-hidden="true"><div class="skel" style="width:56px;height:56px;border-radius:10px"></div>
    <div style="flex:1;display:grid;gap:7px"><div class="skel" style="height:12px;width:62%"></div><div class="skel" style="height:10px;width:44%"></div></div></div>`).join('');
}
// Venue photos are hotlinked from the venue's own site or Wikimedia Commons (found by the
// monthly loader): no referrer, and a broken one quietly falls back to the icon.
const imgTag = src => `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`;
function artHtml(it, cls = ''){
  return `<span class="art ${cls}"><span class="ph-art">${ic(it.icon)}</span>${it.img ? imgTag(it.img) : ''}</span>`;
}
/* Credit for a place's photo: Commons photos link to their file page (licence and author). */
function photoCredit(src){
  if (!src) return '';
  let u; try { u = new URL(src); } catch(e){ return ''; }
  if (u.hostname.endsWith('wikimedia.org')){
    const name = decodeURIComponent((u.pathname.split('Special:FilePath/')[1] || '').replace(/\+/g, ' '));
    return name ? `Photo: <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(name)}" target="_blank" rel="noopener">Wikimedia Commons</a>` : 'Photo: Wikimedia Commons';
  }
  return `Photo: ${esc(u.hostname.replace(/^www\./, ''))}`;
}
function rowHtml(it, at){
  const sub = rowSub(it, at), on = inNight(it);
  return `<div class="row${selected && selected.id === it.id ? ' sel' : ''}" data-id="${esc(it.id)}">
    <button class="row-main" data-sel>${artHtml(it)}
      <span class="row-t"><b>${esc(it.name)}</b><small class="${sub.live ? 'live' : ''}">${esc(sub.text)}</small></span>
      <span class="row-end num">${esc(walkText(it.km))}</span></button>
    <button class="row-add${on ? ' in' : ''}" data-add ${it.sg ? 'disabled title="SeatGeek events can\'t go into a plan — use Tickets"' : ''}
      aria-pressed="${on}" aria-label="${on ? 'Remove ' + esc(it.name) + ' from your night' : 'Add ' + esc(it.name) + ' to your night'}">${on ? icf('check-circle') : ic('plus-circle')}</button>
  </div>`;
}

function renderList(){
  const body = $('pbody');
  if (panelMode === 'saved'){ renderSavedPanel(); return; }
  if (!ready){ body.innerHTML = skeletonRows(); return; }
  if (!hasWhere()){
    body.innerHTML = `<div class="empty"><span class="e-ic">${ic('map-pin')}</span><h3>Where are you heading out?</h3>
      <p>Share your location or name a neighbourhood, and Roamly shows what's open and on around it.</p>
      <div class="acts"><button class="btn btn-primary" data-loc-on ${locState === 'unsupported' ? 'disabled' : ''}>${ic('navigation-arrow')} Use my location</button>
        <button class="btn btn-secondary" data-set-place>Type a place</button></div></div>`;
    body.querySelector('[data-loc-on]').onclick = () => getLoc();
    body.querySelector('[data-set-place]').onclick = () => openSheet('location');
    renderNightBar(); return;
  }
  const loading = !feed.search && (feed.events == null || feed.spots == null);
  const at = dialActive() ? atDial(dial.v) : null;
  const vis = visibleItems();
