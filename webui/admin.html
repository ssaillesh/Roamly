<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Roamly Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/roamly.css" />
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ============ admin dashboard: layout on top of roamly.css ============ */
  :root{
    /* chart roles: the dataviz reference palette (validated light-mode set) */
    --viz-surface:#fcfcfb; --viz-grid:#e1e0d9; --viz-axis:#c3c2b7; --viz-muted:#898781;
    --s1c:#2a78d6; --s2c:#eb6834; --s3c:#1baf7a;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --seq-1:#cde2fb; --seq-3:#86b6ef; --seq-5:#3987e5; --seq-7:#1c5cab;
  }
  body{background:var(--bg);}
  .shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
  .aside{position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 14px; border-right:1px solid var(--line-2);
    background:var(--surface);}
  .aside .logo{padding:4px 10px 18px;}
  .aside .logo small{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary-ink); background:var(--primary-soft); padding:3px 8px; border-radius:999px; margin-left:4px;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav .grp{margin:14px 10px 6px;}
  .nav a{display:flex; align-items:center; gap:10px; min-height:40px; padding:0 12px; border-radius:var(--r-sm);
    font-size:14px; font-weight:650; color:var(--ink-2);}
  .nav a:hover{background:var(--surface-2); color:var(--ink);}
  .nav a[aria-current="page"]{background:var(--primary-soft); color:var(--primary-ink);}
  .nav a .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex:0 0 auto;}
  .nav a[aria-current="page"] .dot{background:var(--primary);}
  .nav a .warn-pip{margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--crit);}
  .aside-foot{margin-top:22px; padding:12px 10px 0; border-top:1px solid var(--line-2); font-size:12.5px; color:var(--ink-3);}
  .aside-foot a{color:var(--primary-ink); font-weight:700;}

  .content{min-width:0; padding:0 28px 60px;}
  .topbar{position:sticky; top:0; z-index:500; display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:16px 0 14px; background:var(--bg); border-bottom:1px solid var(--line-2); margin-bottom:22px;}
  .topbar h1{font-size:22px; font-weight:800; letter-spacing:-.025em; margin:0; flex:1 1 auto; min-width:160px;}
  .topbar .sub{display:block; font-size:13px; font-weight:550; color:var(--ink-3); letter-spacing:0;}
  .seg{display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-pill); background:var(--surface);
    border:1px solid var(--line);}
  .seg button{border:0; background:none; min-height:34px; padding:0 12px; border-radius:var(--r-pill);
    font-size:13px; font-weight:700; color:var(--ink-2); cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--ink); color:#fff;}
  .tog{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-2);}
  .tog .switch{width:44px; height:26px;}
  .tog .switch::after{width:20px; height:20px;}
  .tog .switch[aria-checked="true"]::after{transform:translateX(18px);}
  .dd{position:relative;}
  .dd-menu{position:absolute; right:0; top:calc(100% + 6px); min-width:220px; padding:6px; border-radius:var(--r-md);
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-3); z-index:20;}
  .dd-menu button{display:block; width:100%; text-align:left; border:0; background:none; padding:10px 12px;
    border-radius:var(--r-xs); font-size:14px; font-weight:650; cursor:pointer;}
  .dd-menu button:hover{background:var(--surface-2);}

  .grid{display:grid; gap:16px;}
  .g-tiles{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));}
  .g-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .sec{margin-top:26px;}
  .sec > .t-label{display:block; margin-bottom:10px;}
  .tile{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-md); padding:16px 18px;
    box-shadow:var(--sh-1);}
  .tile .k{font-size:12.5px; font-weight:700; color:var(--ink-3);}
  .tile .v{font-size:28px; font-weight:800; letter-spacing:-.03em; line-height:1.15; margin-top:4px;}
  .tile .d{font-size:12.5px; font-weight:600; color:var(--ink-3); margin-top:2px;}
  .panel{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-lg); padding:18px 20px;
    box-shadow:var(--sh-1); min-width:0;}
  .panel-h{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px;}
  .panel-h h2{font-size:16px; font-weight:780; letter-spacing:-.015em; margin:0;}
  .panel-h p{margin:2px 0 0; font-size:12.5px; color:var(--ink-3); font-weight:550;}
  .panel-h .grow{flex:1; min-width:0;}
  .mini{border:1px solid var(--line); background:var(--surface); border-radius:var(--r-pill); min-height:30px;
    padding:0 11px; font-size:12px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap;}
  .mini:hover{border-color:rgba(106,76,240,.45);}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 8px; padding:0; list-style:none;
    font-size:12.5px; font-weight:650; color:var(--ink-2);}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
  .chart-box{position:relative; height:260px;}
  .chart-box.sm{height:180px;}

  table.t{width:100%; border-collapse:collapse; font-size:13.5px;}
  .t th{text-align:left; font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-3); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0;
    background:var(--surface);}
  .t td{padding:9px 10px; border-bottom:1px solid var(--line-2); vertical-align:top;}
  .t td.n,.t th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .t tr.click{cursor:pointer;}
  .t tr.click:hover td{background:var(--surface-2);}
  .t .muted{color:var(--ink-3);}
  .tbl-wrap{overflow:auto; max-height:520px; margin:0 -4px; padding:0 4px;}
  .clip{max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* horizontal bar lists (a single series: one hue, value labels outside the bar) */
  .bars{display:flex; flex-direction:column; gap:7px;}
  .bar-row{display:grid; grid-template-columns:minmax(90px,38%) 1fr auto; gap:10px; align-items:center; font-size:13px;}
  .bar-row .lab{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2); font-weight:600;}
  .bar-row .trk{height:12px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .bar-row .fill{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--s1c); min-width:2px;}
  .bar-row .val{font-variant-numeric:tabular-nums; font-weight:700; min-width:46px; text-align:right;}
  .bar-row .val small{color:var(--ink-3); font-weight:600; margin-left:4px;}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:12px;
    font-weight:750; background:var(--surface-2); color:var(--ink-2); white-space:nowrap;}
  .badge::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.9;}
  .badge.good{background:#e3f6e3; color:#006300;} .badge.good::before{background:var(--good);}
  .badge.warn{background:var(--warning-soft); color:var(--warning);} .badge.warn::before{background:var(--warn);}
  .badge.crit{background:var(--danger-soft); color:var(--danger);} .badge.crit::before{background:var(--crit);}
  .badge.plain::before{display:none;}
  .meter{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; min-width:80px;}
  .meter > span{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--s1c);}
  .meter.warn > span{background:var(--warn);} .meter.crit > span{background:var(--crit);}

  .ret td.c{text-align:center; font-variant-numeric:tabular-nums; font-weight:700; border-left:2px solid var(--surface);}
  .map{height:380px; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line-2);}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
  .toolbar .input{min-height:42px; max-width:340px;}
  .pager{display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:13px; color:var(--ink-3);}
  pre.json{background:var(--surface-2); border-radius:var(--r-sm); padding:12px; font-size:12px; overflow:auto; max-height:320px;
    margin:0; white-space:pre-wrap; word-break:break-word;}

  /* drawer + modal */
  .scrim{position:fixed; inset:0; background:rgba(23,21,58,.38); z-index:1000;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(620px,100%); background:var(--bg); z-index:1001;
    overflow-y:auto; padding:22px 24px 40px; box-shadow:var(--sh-3);}
  .modal{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(640px,calc(100% - 32px));
    max-height:calc(100% - 48px); overflow-y:auto; background:var(--surface); border-radius:var(--r-lg); z-index:1002;
    padding:22px 24px; box-shadow:var(--sh-3);}
  .x-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:16px;}
  .x-head h2{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0; overflow-wrap:anywhere;}
  .kv{display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13.5px;}
  .kv dt{color:var(--ink-3); font-weight:650;} .kv dd{margin:0; overflow-wrap:anywhere;}
  .acts{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0;}
  .btn-danger{background:var(--danger); color:#fff;}
  .stop{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-2); font-size:13.5px;}
  .stop b{font-weight:750;}
  .center-msg{max-width:440px; margin:18vh auto; text-align:center; padding:0 16px;}

  @media (max-width:1100px){ .g-3{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .aside{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line-2); padding:12px 16px;}
    .aside .logo{padding:0 0 8px;}
    .nav{flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:4px;}
    .nav .grp,.aside-foot{display:none;}
    .nav a{white-space:nowrap; min-height:36px;}
    .content{padding:0 16px 48px;}
    .topbar{position:static;}
    .g-2,.g-3{grid-template-columns:1fr;}
    .kv{grid-template-columns:1fr;} .kv dt{margin-top:6px;}
    .bar-row{grid-template-columns:minmax(80px,40%) 1fr auto;}
  }
</style>
</head>
<body>
<div id="app"><div class="center-msg"><p class="t-meta">Loading the admin dashboard…</p></div></div>

<script>
const API = window.API_BASE;
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem('trek_token');
const authHeaders = () => token() ? { 'Authorization': 'Bearer ' + token() } : {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat();
const fmt = n => n == null ? '—' : nf.format(Math.round(n));
const pct = (n, digits = 1) => n == null ? '—' : (n * 100).toFixed(digits).replace(/\.0$/, '') + '%';
const ms = n => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + ' s' : Math.round(n) + ' ms';
const dshort = s => new Date(s + (s.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' });
const dtime = s => s ? new Date(s).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '—';
const ago = s => {
  if (!s) return 'never';
  const sec = (Date.now() - new Date(s)) / 1000;
  if (sec < 90) return 'just now';
  if (sec < 5400) return Math.round(sec / 60) + ' min ago';
  if (sec < 129600) return Math.round(sec / 3600) + ' h ago';
  return Math.round(sec / 86400) + ' days ago';
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('admin_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('admin_' + k, JSON.stringify(v)); }catch(e){} },
};

const state = { days: store.get('days', 30), includeTest: store.get('includeTest', false), me: null, hours: 24 };
let charts = [], maps = [];

// ---------------------------------------------------------------- API
async function api(path, opts = {}){
  const r = await apiFetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({ 'Content-Type':'application/json' }, authHeaders(), opts.headers || {}) }), 45000);
  if (r.status === 401){ localStorage.removeItem('trek_token'); location.replace('auth.html?redirect=admin.html'); throw new Error('Signed out'); }
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok){
    const detail = Array.isArray(d.detail)        // a form check: "starts_at: …"
      ? d.detail.map(x => `${(x.loc || []).slice(-1)[0]}: ${String(x.msg || '').replace(/^Value error, /, '')}`).join('; ')
      : d.detail;
    throw new Error(detail || `Request failed (${r.status})`);
  }
  return d;
}
const q = (extra = {}) => '?' + new URLSearchParams(Object.assign(
  { days: state.days, include_test: state.includeTest }, extra)).toString();

async function download(path, name){
  const r = await apiFetch(API + path, { headers: authHeaders() }, 120000);
  if (!r.ok){ toast('Export failed (' + r.status + ')'); return; }
  const blob = await r.blob();
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function toast(msg){
  let t = $('toast');
  if (!t){ t = Object.assign(document.createElement('div'), { id:'toast', className:'toast' });
    t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>`; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200);
}

// ---------------------------------------------------------------- charts
Chart.defaults.font.family = '"Plus Jakarta Sans", system-ui, sans-serif';
Chart.defaults.font.size = 12;
Chart.defaults.color = '#898781';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = () => [css('--s1c'), css('--s2c'), css('--s3c')];

function axes(stacked = false, yFmt){
  return {
    x: { stacked, grid:{ display:false }, border:{ color: css('--viz-axis') },
         ticks:{ maxRotation:0, autoSkipPadding:14 } },
    y: { stacked, beginAtZero:true, grid:{ color: css('--viz-grid') }, border:{ display:false },
         ticks:{ precision:0, callback: yFmt || (v => nf.format(v)) } },
  };
}

// A chart card: legend (>=2 series), the canvas, and a table view of the same data.
function chartCard({ id, title, sub, series, small }){
  const legend = series.length > 1
    ? `<ul class="legend">${series.map((s, i) => `<li><i style="background:${s.color || SERIES()[i]}"></i>${esc(s.label)}</li>`).join('')}</ul>` : '';
  return `<div class="panel"><div class="panel-h"><div class="grow"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
    <button class="mini" data-table-toggle="${id}">Table</button></div>${legend}
    <div class="chart-box ${small ? 'sm' : ''}" id="${id}-box"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div>
    <div class="tbl-wrap hidden" id="${id}-tbl"></div></div>`;
}

function drawChart(id, { type = 'bar', labels, series, stacked = false, yFmt, tipFmt }){
  const el = $(id); if (!el) return;
  const colors = SERIES();
  const datasets = series.map((s, i) => {
    const c = s.color || colors[i];
    return type === 'line'
      ? { label: s.label, data: s.data, borderColor: c, backgroundColor: c, borderWidth: 2,
          // isolated readings (e.g. one awake hour) would be invisible as a 0-length line
          pointRadius: s.data.filter(v => v != null).length <= 3 ? 4 : 0,
          pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: css('--viz-surface'), tension: .25, spanGaps: false }
      : { label: s.label, data: s.data, backgroundColor: c, borderRadius: { topLeft:4, topRight:4 }, borderSkipped:'start',
          borderColor: css('--viz-surface'), borderWidth: stacked ? { top:2 } : 0,
          barPercentage: .82, categoryPercentage: .86, maxBarThickness: 26 };
  });
  charts.push(new Chart(el, {
    type, data: { labels: labels.map(l => l.display ?? l), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: '#17153a', padding: 10, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
          callbacks: { label: c => ` ${c.dataset.label}: ${(tipFmt || fmt)(c.parsed.y)}` } } },
      scales: axes(stacked, yFmt),
    },
  }));
  // table view
  const tbl = $(id + '-tbl');
  tbl.innerHTML = `<table class="t"><thead><tr><th></th>${series.map(s => `<th class="n">${esc(s.label)}</th>`).join('')}</tr></thead><tbody>${
    labels.map((l, i) => `<tr><td>${esc(l.display ?? l)}</td>${series.map(s => `<td class="n">${(tipFmt || fmt)(s.data[i])}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
}

function barList(rows, { label = r => r.key, value = r => r.count, total, empty = 'No data yet.' } = {}){
  if (!rows || !rows.length) return `<p class="t-meta">${esc(empty)}</p>`;
  const max = Math.max(...rows.map(value), 1);
  const sum = total ?? rows.reduce((a, r) => a + value(r), 0);
  return `<div class="bars">${rows.map(r => {
    const v = value(r);
    return `<div class="bar-row" title="${esc(label(r))}: ${fmt(v)}"><span class="lab">${esc(label(r))}</span>
      <span class="trk"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span>
      <span class="val">${fmt(v)}${sum ? `<small>${pct(v / sum, 0)}</small>` : ''}</span></div>`;
  }).join('')}</div>`;
}

const tile = (k, v, d = '') => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
const panel = (title, body, sub = '', right = '') => `<div class="panel"><div class="panel-h"><div class="grow"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${right}</div>${body}</div>`;
const notice = (title, text, kind = 'warn') => `<div class="notice ${kind}"><span class="n-ic" aria-hidden="true">!</span><div><b>${esc(title)}</b><p>${esc(text)}</p></div></div>`;
const statusBadge = (ok, okText = 'OK', badText = 'Down') => ok ? `<span class="badge good">${okText}</span>` : `<span class="badge crit">${badText}</span>`;
const table = (cols, rows, opts = {}) => `<div class="tbl-wrap" ${opts.full ? 'style="max-height:none"' : ''}><table class="t"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.hRaw ?? esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
  rows.length ? rows.map(r => `<tr ${opts.rowAttr ? opts.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''} ${c.cls || ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')
  : `<tr><td colspan="${cols.length}" class="muted">${esc(opts.empty || 'Nothing here yet.')}</td></tr>`}</tbody></table></div>`;

function webBlock(web, render){
  if (!web) return '';
  if (!web.connected) return notice('Google Analytics isn’t connected',
    (web.error || 'GA4 settings are missing on the API server.') +
    ' These are read from the Render API service’s Environment; after changing them, the service must redeploy.');
  if (web.error) return notice('Couldn’t load Google Analytics', web.error, 'err');
  return render(web);
}

// ---------------------------------------------------------------- sections
const SECTIONS = [
  { id:'overview', title:'Overview', group:'Summary', render: renderOverview },
  { id:'activity', title:'Users & retention', group:'People', render: renderActivity },
  { id:'funnel', title:'Sign-up funnel', group:'People', render: renderFunnel },
  { id:'traffic', title:'Traffic sources', group:'Reach', render: renderTraffic },
  { id:'geo', title:'Where users are', group:'Reach', render: renderGeo },
  { id:'planner', title:'Planner', group:'Product', render: renderPlanner },
  { id:'taste', title:'Taste insights', group:'Product', render: renderTaste },
  { id:'health', title:'Server health', group:'Systems', render: renderHealth },
  { id:'apis', title:'Outside APIs', group:'Systems', render: renderApis },
  { id:'users', title:'Users', group:'Manage', render: renderUsers },
  { id:'waitlist', title:'Waitlist', group:'Manage', render: renderWaitlist },
  { id:'events', title:'Nightlife events', group:'Manage', render: renderEvents },
  { id:'audit', title:'Admin activity', group:'Manage', render: renderAudit },
];
const RANGES = [[7,'7d'],[30,'30d'],[90,'90d'],[365,'1y']];
const usesRange = new Set(['activity','funnel','traffic','geo','planner','apis']);
const usesTestToggle = new Set(['overview','activity','funnel','geo','planner','taste']);

function shell(){
  let groups = '', last = null;
  for (const s of SECTIONS){
    if (s.group !== last){ groups += `<span class="grp t-label">${esc(s.group)}</span>`; last = s.group; }
    groups += `<a href="#${s.id}" data-sec="${s.id}"><span class="dot" aria-hidden="true"></span>${esc(s.title)}</a>`;
  }
  $('app').innerHTML = `<div class="shell">
    <aside class="aside"><a class="logo" href="roamly.html">Roamly<small>Admin</small></a>
      <nav class="nav" aria-label="Dashboard sections">${groups}</nav>
      <div class="aside-foot">Signed in as <b>@${esc(state.me.username)}</b><br><a href="roamly.html">Back to the app</a></div></aside>
    <main class="content"><div class="topbar"><h1 id="secTitle">Overview<span class="sub" id="secSub"></span></h1>
      <div class="seg" id="rangeSeg" role="group" aria-label="Date range">${RANGES.map(([d, l]) =>
        `<button data-days="${d}" aria-pressed="${state.days === d}">${l}</button>`).join('')}</div>
      <label class="tog" id="testTog"><button class="switch" role="switch" id="testSwitch" aria-checked="${state.includeTest}" aria-label="Include test accounts"></button>Test accounts</label>
      <div class="dd"><button class="btn btn-ghost btn-sm" id="exportBtn" aria-haspopup="menu" aria-expanded="false">Export CSV</button>
        <div class="dd-menu hidden" id="exportMenu" role="menu">
          <button role="menuitem" data-export="users">All users</button>
          <button role="menuitem" data-export="waitlist">Waitlist</button>
          <button role="menuitem" data-export="plans">Plan logs (selected range)</button></div></div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button></div>
      <div id="sec"></div></main></div>`;

  $('rangeSeg').onclick = e => { const b = e.target.closest('[data-days]'); if (!b) return;
    state.days = +b.dataset.days; store.set('days', state.days);
    $('rangeSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); route(); };
  $('testSwitch').onclick = () => { state.includeTest = !state.includeTest; store.set('includeTest', state.includeTest);
    $('testSwitch').setAttribute('aria-checked', state.includeTest); route(); };
  $('refreshBtn').onclick = () => route();
  $('exportBtn').onclick = e => { e.stopPropagation(); const m = $('exportMenu'); m.classList.toggle('hidden');
    $('exportBtn').setAttribute('aria-expanded', !m.classList.contains('hidden')); };
  document.addEventListener('click', () => { $('exportMenu').classList.add('hidden'); $('exportBtn').setAttribute('aria-expanded', 'false'); });
  $('exportMenu').onclick = e => { const b = e.target.closest('[data-export]'); if (!b) return;
    const k = b.dataset.export, stamp = new Date().toISOString().slice(0, 10);
    download(`/admin/export/${k}.csv${k === 'plans' ? '?days=' + state.days : ''}`, `roamly-${k}-${stamp}.csv`); };
  document.addEventListener('click', e => { const b = e.target.closest('[data-table-toggle]'); if (!b) return;
    const id = b.dataset.tableToggle, showTbl = $(id + '-tbl').classList.toggle('hidden') === false;
    $(id + '-box').classList.toggle('hidden', showTbl); b.textContent = showTbl ? 'Chart' : 'Table'; });
  window.addEventListener('hashchange', route);
}

let routeSeq = 0;
async function route(){
  const id = (location.hash || '#overview').slice(1).split('/')[0];
  const sec = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  document.querySelectorAll('.nav a').forEach(a =>
    a.dataset.sec === sec.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('secTitle').firstChild.textContent = sec.title;
  $('secSub').textContent = '';
  $('rangeSeg').classList.toggle('hidden', !usesRange.has(sec.id));
  $('testTog').classList.toggle('hidden', !usesTestToggle.has(sec.id));
  charts.forEach(c => c.destroy()); charts = [];
  $('sec').onchange = null;
  maps.forEach(m => m.remove()); maps = [];
  const seq = ++routeSeq;
  $('sec').innerHTML = `<div class="skel-wrap grid g-tiles">${'<div class="skel" style="height:96px"></div>'.repeat(4)}</div>`;
  try{
    const html = await sec.render(seq);
    if (seq !== routeSeq) return;            // a newer navigation won
    if (typeof html === 'string') $('sec').innerHTML = html;
  }catch(e){
    if (seq === routeSeq) $('sec').innerHTML = notice('Couldn’t load this section', e.message, 'err');
  }
}
const stale = seq => seq !== routeSeq;
const rangeText = () => state.days === 365 ? 'last 12 months' : `last ${state.days} days`;

// ---- overview
async function renderOverview(seq){
  const [o, act] = await Promise.all([api('/admin/overview' + q()), api('/admin/activity' + q({ days: 30 }))]);

      ${tile('Active today', fmt(o.dau), `${fmt(o.wau)} this week · ${fmt(o.mau)} this month`)}
      ${tile('Finished the taste survey', pct(o.survey_rate, 0), people(o.survey_completed))}
      ${tile('Plans today', fmt(o.plans_today), `${fmt(o.plans_7d)} in the last 7 days`)}
      ${tile('Waitlist', fmt(o.waitlist_total))}
      ${tile('Requests (24h)', fmt(o.requests_24h), `p95 latency ${ms(o.p95_ms_24h)}`)}
      ${tile('Server errors (24h)', pct(err, 2), `${errBadge} ${fmt(o.errors_5xx_24h)} 5xx`)}
    </div>
    <div class="grid g-2 sec">
      ${chartCard({ id:'ovAct', title:'Sign-ups and active users', sub:'Last 30 days',
        series:[{ label:'Active users' }, { label:'Sign-ups' }] })}
      ${panel('System status', `<dl class="kv">
          <dt>Database</dt><dd>${statusBadge(st.database.ok)} ${st.database.ok ? ms(st.database.ms) : esc(st.database.error)}</dd>
          <dt>Redis</dt><dd>${statusBadge(st.redis.ok)} ${st.redis.ok ? ms(st.redis.ms) : esc(st.redis.error)}</dd>
          <dt>Up for</dt><dd>${upFor(st.uptime_s)} <span class="t-meta">(${esc(st.environment)})</span></dd>
          <dt>Last stats saved</dt><dd>${o.last_snapshot_at ? ago(o.last_snapshot_at) : 'none in the last 24h'}</dd>
          <dt>Services</dt><dd><div class="chips">${conf}</div>${why ? `<ul class="t-meta" style="margin:8px 0 0;padding-left:18px">${why}</ul>` : ''}</dd>
          <dt>Free-tier blocker</dt><dd>${st.free_tier_only ? '<span class="badge good">on</span> paid APIs stop before they cost money' : '<span class="badge crit">off</span> FREE_TIER_ONLY=false: paid usage possible'}</dd></dl>`, 'Live check from this page load')}
    </div>`;
  const s = act.series;
  drawChart('ovAct', { labels: s.map(r => ({ display: dshort(r.day) })),
    series:[{ label:'Active users', data: s.map(r => r.active) }, { label:'Sign-ups', data: s.map(r => r.signups) }] });

const people = n => `${fmt(n)} ${n === 1 ? 'person' : 'people'}`;
const reqs = n => `${fmt(n)} request${n === 1 ? '' : 's'}`;
const upFor = s => s < 3600 ? Math.round(s / 60) + ' min' : s < 172800 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' days';

// ---- activity & retention

  const heat = v => {
    if (v == null) return `<td class="c muted" title="Too early to tell">·</td>`;
    const bg = v >= .5 ? css('--seq-7') : v >= .3 ? css('--seq-5') : v >= .15 ? css('--seq-3') : css('--seq-1');
    const ink = v >= .3 ? '#fff' : 'var(--ink)';
    return `<td class="c" style="background:${bg};color:${ink}">${pct(v, 0)}</td>`;
  };
  $('secSub').textContent = rangeText();
  $('sec').innerHTML = `
    <div class="grid g-tiles">
      ${tile('Sign-ups', fmt(sum('signups')), rangeText())}
      ${tile('Busiest day', fmt(Math.max(0, ...s.map(r => r.active))), 'active users in one day')}
      ${tile('Avg. active per day', fmt(sum('active') / s.length))}

      sub:'Active = used the app while signed in that day (UTC)', series:[{ label:'Active users' }, { label:'Sign-ups' }] })}</div>
    <div class="sec">${panel('Retention by sign-up week',
      `<div class="tbl-wrap"><table class="t ret"><thead><tr><th>Week of</th><th class="n">Signed up</th>
        <th class="n">Back next day</th><th class="n">Back in week 2</th><th class="n">Back in month 2</th></tr></thead><tbody>${
        a.retention.length ? a.retention.map(r => `<tr><td>${dshort(r.week)}</td><td class="n">${fmt(r.size)}</td>${heat(r.day1)}${heat(r.week2)}${heat(r.month2)}</tr>`).join('')

// ---- funnel
async function renderFunnel(seq){
  const f = await api('/admin/funnel' + q());
  if (stale(seq)) return;
  const first = f.steps[0].count || 0;
  const rows = f.steps.map((s, i) => {
    const prev = i ? f.steps[i - 1].count : null;
    return `<div class="bar-row" style="grid-template-columns:minmax(150px,30%) 1fr 150px"><span class="lab">${esc(s.label)}</span>
      <span class="trk" style="height:18px"><span class="fill" style="width:${first ? (s.count / first * 100).toFixed(1) : 0}%"></span></span>
      <span class="val">${fmt(s.count)}<small>${first ? pct(s.count / first, 0) + ' of sign-ups' : ''}</small>${
        prev ? `<br><small>${pct(s.count / prev, 0)} of previous step</small>` : ''}</span></div>`;
  }).join('');
  const web = webBlock(f.web, w => {
    const ev = w.events || {};
    const steps = [['Visitors', w.visitors], ['Joined waitlist', ev.waitlist_join], ['Signed up', ev.sign_up],
                   ['Finished survey', ev.survey_complete], ['Built a plan', ev.plan_built]];
    return barList(steps.map(([k, v]) => ({ key:k, count: v || 0 })), { total: 0 }) +
      `<p class="t-meta" style="margin:10px 0 0">From Google Analytics (visitors who accepted cookies). Event counts, so one person can count more than once.</p>`;
  });
  $('secSub').textContent = `People who signed up in the ${rangeText()}`;
  $('sec').innerHTML = `<div class="grid g-2">
      ${panel('From sign-up to coming back', `<div class="bars" style="gap:12px">${rows}</div>
        ${f.note ? `<p class="t-meta" style="margin:12px 0 0">${esc(f.note)}</p>` : ''}`,
        'Each step counts people from the sign-up group who got that far')}
      ${panel('Before sign-up (website)', web, `Waitlist sign-ups in this period: ${fmt(f.waitlist_signups)}`)}
    </div>`;
}

document.addEventListener('click', e => {
  const tr = e.target.closest('[data-plan]'); if (tr) openPlan(tr.dataset.plan);
  const u = e.target.closest('[data-user]'); if (u) openUser(u.dataset.user);

function overlay(html, kind = 'modal'){
  closeOverlay();
  const scrim = Object.assign(document.createElement('div'), { className:'scrim', id:'scrim' });
  const box = Object.assign(document.createElement('div'), { className: kind, id:'overlay' });
  box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
  box.innerHTML = html;
  scrim.onclick = closeOverlay;
  document.body.append(scrim, box);
  box.querySelector('[data-close]')?.focus();
  return box;
}
function closeOverlay(){ $('scrim')?.remove(); $('overlay')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeOverlay(); });
const xHead = title => `<div class="x-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>`;

async function openPlan(id){
  const box = overlay(xHead('Plan request') + '<p class="t-meta">Loading…</p>');
  try{
    const p = await api('/admin/plans/' + id);
    const r = p.response || {};
    const plans = r.plan ? [r.plan] : (r.days || []);
    const stops = plans.flatMap((pl, i) => (pl.stops || []).map(s => ({ ...s, day: plans.length > 1 ? i + 1 : null })));
    box.innerHTML = xHead(`Plan request · @${esc(p.username || '?')}`) + `
      <dl class="kv"><dt>When</dt><dd>${esc(dtime(p.created_at))}</dd>

// ---- health
const HOURS = [[6,'6h'],[24,'24h'],[168,'7d'],[720,'30d'],[2160,'90d']];
async function renderHealth(seq){
  const h = await api('/admin/health?hours=' + state.hours);
  if (stale(seq)) return;
  const st = h.status;
  // Lay out every bucket in the window so sleep/no-traffic shows as a gap.
  const UNIT = { minute: 6e4, hour: 36e5, day: 864e5 }[h.unit];
  const byT = new Map(h.series.map(r => [Date.parse(r.t + 'Z'), r]));
  const end = Math.floor(Date.now() / UNIT) * UNIT;
  const s = [];
  for (let t = end - Math.ceil(state.hours * 36e5 / UNIT - 1) * UNIT; t <= end; t += UNIT)
    s.push(byT.get(t) || { t, requests: null, '4xx': null, '5xx': null, p95_ms: null, empty: true });
  const lab = t => { const d = new Date(typeof t === 'number' ? t : Date.parse(t + 'Z')); return h.unit === 'day' ? d.toLocaleDateString(undefined, { month:'short', day:'numeric' })
    : h.unit === 'hour' && state.hours > 24 ? d.toLocaleString(undefined, { weekday:'short', hour:'numeric' })
    : d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }); };
  const tot = s.reduce((a, r) => a + (r.requests || 0), 0), e5 = s.reduce((a, r) => a + (r['5xx'] || 0), 0);
  const er = tot ? e5 / tot : null;
  $('secSub').textContent = 'Saved once a minute while the server is awake';
  $('sec').innerHTML = `
    <div class="toolbar"><div class="seg" id="hoursSeg" role="group" aria-label="Time window">${HOURS.map(([v, l]) =>
      `<button data-hours="${v}" aria-pressed="${state.hours === v}">${l}</button>`).join('')}</div>
      <span class="t-meta">${esc(h.note)}</span></div>
    <div class="grid g-tiles">
      ${tile('Database', statusBadge(st.database.ok), st.database.ok ? ms(st.database.ms) + ' to answer' : esc(st.database.error))}
      ${tile('Redis', statusBadge(st.redis.ok), st.redis.ok ? ms(st.redis.ms) + ' to answer' : esc(st.redis.error))}
      ${tile('Up for', upFor(st.uptime_s), 'since the last restart or wake-up')}
      ${tile('Requests', fmt(tot))}
      ${tile('Server errors', pct(er, 2), `${fmt(e5)} 5xx responses`)}
      ${tile('Cold starts', fmt(h.cold_starts.length), h.cold_starts[0] ? 'latest ' + ago(h.cold_starts[0]) : 'none in this window')}
    </div>
    <div class="sec">${chartCard({ id:'hReq', title:'Requests', sub:`Per ${h.unit}`, series:[{ label:'Requests' }] })}</div>
    <div class="grid g-2 sec">
      ${chartCard({ id:'hLat', title:'Response time (p95)', sub:'Slowest 5% of requests took at least this long', small:true, series:[{ label:'p95' }] })}
      ${chartCard({ id:'hErr', title:'Server errors (5xx)', small:true, series:[{ label:'5xx errors', color: css('--crit') }] })}
    </div>
    <div class="sec">${panel('By route', table([
      { h:'Route', cls:'clip', f: r => `<code>${esc(r.route)}</code>` },
      { h:'Requests', n:1, f: r => fmt(r.requests) }, { h:'4xx', n:1, f: r => fmt(r['4xx']) },
      { h:'5xx', n:1, f: r => r['5xx'] ? `<span class="badge crit">${fmt(r['5xx'])}</span>` : '0' },
      { h:'p95 (avg)', n:1, f: r => ms(r.p95_ms) }, { h:'Worst p95', n:1, f: r => ms(r.worst_p95_ms) }], h.routes),
      '“unmatched” = requests to URLs that don’t exist (often bots)')}</div>`;
  $('hoursSeg').onclick = e => { const b = e.target.closest('[data-hours]'); if (!b) return; state.hours = +b.dataset.hours; route(); };
  const labels = s.map(r => ({ display: lab(r.t) }));
  drawChart('hReq', { labels, series:[{ label:'Requests', data: s.map(r => r.requests) }] });
  drawChart('hLat', { type:'line', labels, series:[{ label:'p95', data: s.map(r => r.p95_ms) }], yFmt: v => ms(v), tipFmt: ms });
  drawChart('hErr', { labels, series:[{ label:'5xx errors', color: css('--crit'), data: s.map(r => r['5xx']) }] });
}

const PROVIDER = { llm:'AI (LLM)', yelp:'Yelp', google_places:'Google Places', foursquare:'Foursquare',

  open_meteo:'Open-Meteo weather', sendgrid:'SendGrid email' };
const PER = { day:'today (UTC)', month:'this month' };
function guardCell(r){
  const q = r.quota;
  if (!q) return `<span class="badge good">free</span>`;
  if (r.status === 'disabled') return `<span class="badge plain">off: paid product</span><div class="t-meta">switched off in code, never called</div>`;
  if (r.status === 'unguarded') return `<span class="badge crit">not guarded</span><div class="t-meta">FREE_TIER_ONLY is off</div>`;
  if (r.status === 'never_free') return `<span class="badge warn">blocked</span><div class="t-meta">${r.configured ? 'never called: no free tier' : 'no free tier'}${q.blocked ? ` · ${fmt(q.blocked)} turned away` : ''}</div>`;
  const used = q.used ?? 0, pctUsed = q.cap ? used / q.cap : 0;
  const cls = r.status === 'capped' ? 'crit' : r.status === 'near' ? 'warn' : '';
  const tok = q.tokens_cap ? `<div class="t-meta">${q.tokens_used == null ? '?' : fmt(q.tokens_used)} / ${fmt(q.tokens_cap)} tokens today</div>` : '';
  return `<div style="display:flex;gap:8px;align-items:center"><div class="meter ${cls}" style="flex:1"><span style="width:${Math.min(100, pctUsed * 100).toFixed(1)}%"></span></div>
    <span class="t-meta" style="white-space:nowrap">${q.used == null ? '?' : fmt(used)} / ${fmt(q.cap)} ${PER[q.period]}</span></div>${tok}
    ${r.status === 'capped' ? `<div class="t-meta">Paused until the ${q.period === 'day' ? 'day' : 'month'} resets${q.blocked ? ` · ${fmt(q.blocked)} turned away` : ''}</div>` : ''}`;
}

  if (stale(seq)) return;
  $('secSub').textContent = d.pending ? `${fmt(d.pending)} waiting for review — nothing shows in the app until you approve it`
    : 'Nothing waiting for review';
  const tabs = [['pending', `Waiting${d.pending ? ` (${d.pending})` : ''}`], ['upcoming','Live & upcoming'], ['rejected','Rejected'], ['all','All']];
  const rows = d.events;
  $('sec').innerHTML = `
    <div class="toolbar sec">${tabs.map(([k, l]) =>
      `<button class="btn btn-sm ${evState.tab === k ? 'btn-dark' : 'btn-ghost'}" data-evtab="${k}">${esc(l)}</button>`).join('')}
      <span style="flex:1"></span><button class="btn btn-primary btn-sm" id="evNew">Add an event</button></div>
    ${panel('Nightlife events', table([
      { h:'When', f: e => esc(torontoTime(e.starts_at)) },
      { h:'Event', cls:'clip', f: e => `<b>${esc(e.title)}</b><div class="t-meta">${esc(kindName(e.kind))}${e.special_day ? ' · ' + esc(dayName(e.special_day)) : ''}</div>${
          e.description ? `<div class="t-meta" style="white-space:normal;max-width:42ch">${esc(e.description)}</div>` : ''}` },
      { h:'Venue', f: e => `${esc(e.venue_name)}<div class="t-meta">${e.venue_id ? 'on the map' : e.lat != null ? 'placed by hand' : 'not matched to the map'}</div>` },
      { h:'Price', f: e => esc(evPrice(e)) },
      { h:'From', cls:'clip', f: e => e.source === 'submission'
          ? `${esc(e.submitter_name || 'Venue')}<div class="t-meta">${esc(e.submitter_email || '')}</div>` : '<span class="t-meta">added by an admin</span>' },
      { h:'Status', f: evStatus },
      { h:'', f: e => `<div style="display:flex;gap:6px;flex-wrap:wrap">${e.status !== 'approved' ? `<button class="btn btn-primary btn-sm" data-ev-act="approved" data-id="${e.id}">Approve</button>` : ''}${
          e.status === 'pending' ? `<button class="btn btn-ghost btn-sm" data-ev-act="rejected" data-id="${e.id}">Reject</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-ev-act="edit" data-id="${e.id}">Edit</button>
          <button class="btn btn-ghost btn-sm" data-ev-act="delete" data-id="${e.id}">Delete</button>${
          e.url ? `<a class="btn btn-ghost btn-sm" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Link ↗</a>` : ''}</div>` }],
      rows, { empty: evState.tab === 'pending' ? 'Nothing waiting. Venues can submit at /submit-event.' : 'No events here.' }),
      'Events listed here show in the Nightlife tab once approved. Ticketmaster events show automatically.')}`;
  $('sec').querySelectorAll('[data-evtab]').forEach(b => b.onclick = () => { evState.tab = b.dataset.evtab; route(); });
  $('evNew').onclick = () => eventForm(null);
  $('sec').querySelectorAll('[data-ev-act]').forEach(b => b.onclick = async () => {
    const e = rows.find(r => String(r.id) === b.dataset.id), act = b.dataset.evAct;
    if (act === 'edit') return eventForm(e);
    if (act === 'delete' && !confirm(`Delete “${e.title}”? This can't be undone.`)) return;
    b.disabled = true;
    try{
      if (act === 'delete') await api(`/admin/events/${e.id}`, { method:'DELETE' });
      else await api(`/admin/events/${e.id}/status`, { method:'POST', body: JSON.stringify({ status: act }) });
      toast(act === 'approved' ? 'Approved — it\'s live in the Nightlife tab' : act === 'rejected' ? 'Rejected' : 'Deleted');
      route();
    }catch(err){ b.disabled = false; toast(err.message); }
  });
}

function eventForm(e){
  const v = e || { kind:'club_night', status:'approved' };
  const opt = (list, cur) => list.map(([k, l]) => `<option value="${esc(k)}" ${k === (cur || '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const box = overlay(xHead(esc(e ? 'Edit event' : 'Add an event')) + `
    <label class="field">Event name<input class="input" id="efTitle" maxlength="160" value="${esc(v.title || '')}"></label>
    <label class="field sec">Venue <span class="t-meta">(search the map, or type a name)</span>
      <input class="input" id="efVenue" maxlength="160" autocomplete="off" value="${esc(v.venue_name || '')}">
      <span class="t-meta" id="efLinked">${v.venue_id ? 'Linked to the map ✓' : ''}</span></label>
    <div id="efVenues" class="sec" style="display:grid;gap:6px"></div>
    <div class="sec" style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
      <label class="field">Starts (Toronto time)<input class="input" id="efStart" type="datetime-local" value="${esc(torontoInput(v.starts_at))}"></label>
      <label class="field">Ends <span class="t-meta">(optional)</span><input class="input" id="efEnd" type="datetime-local" value="${esc(torontoInput(v.ends_at))}"></label>
      <label class="field">Kind<select class="input" id="efKind">${opt(EV_KINDS, v.kind)}</select></label>
      <label class="field">Special day<select class="input" id="efDay">${opt(EV_DAYS, v.special_day)}</select></label>
      <label class="field">From ($)<input class="input" id="efMin" type="number" min="0" value="${v.price_min ?? ''}"></label>
      <label class="field">Up to ($)<input class="input" id="efMax" type="number" min="0" value="${v.price_max ?? ''}"></label>
    </div>
    <label class="field sec" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="efFree" ${v.free ? 'checked' : ''}> Free entry</label>
    <label class="field sec">Tickets / info link<input class="input" id="efUrl" type="url" maxlength="500" value="${esc(v.url || '')}"></label>
    <label class="field sec">Description<textarea class="input" id="efDesc" maxlength="500" rows="3" style="padding:12px 16px;min-height:90px">${esc(v.description || '')}</textarea></label>
    ${e ? '' : `<label class="field sec" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="efLive" checked> Show it in the app right away</label>`}
    <div class="acts"><button class="btn btn-primary" id="efSave">${e ? 'Save' : 'Add event'}</button><button class="btn btn-ghost" data-close>Cancel</button></div>`);
  let venueId = v.venue_id || null, t;
  const venue = box.querySelector('#efVenue'), list = box.querySelector('#efVenues');
  venue.oninput = () => {
    venueId = null; box.querySelector('#efLinked').textContent = '';
    clearTimeout(t);
    const q = venue.value.trim();
    if (q.length < 2){ list.innerHTML = ''; return; }
    t = setTimeout(async () => {
      try{
        const found = await api('/admin/venues/search?' + new URLSearchParams({ q }));
        list.innerHTML = found.map((x, i) => `<button class="btn btn-ghost btn-sm" style="justify-content:flex-start" data-pick="${i}">${esc(x.name)}
          <span class="t-meta">${esc([x.category, x.address].filter(Boolean).join(' · '))}</span></button>`).join('');
        list.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
          const x = found[+b.dataset.pick];
          venue.value = x.name; venueId = x.id; list.innerHTML = '';
          box.querySelector('#efLinked').textContent = 'Linked to the map ✓';
        });
      }catch(err){ list.innerHTML = ''; }
    }, 250);
  };
  box.querySelector('#efSave').onclick = async ev => {
    const val = id => box.querySelector(id).value.trim(), num = id => val(id) === '' ? null : Number(val(id));
    const free = box.querySelector('#efFree').checked;
    const body = { title: val('#efTitle'), venue_name: val('#efVenue'), starts_at: val('#efStart'), ends_at: val('#efEnd') || null,
      kind: val('#efKind'), special_day: val('#efDay') || null, free: free || null,
      price_min: free ? null : num('#efMin'), price_max: free ? null : num('#efMax'),
      url: val('#efUrl') || null, description: val('#efDesc') || null };
    if (venueId || e) body.venue_id = venueId;     // editing: null unlinks (re-matched by name)
    if (!e) body.status = box.querySelector('#efLive').checked ? 'approved' : 'pending';
    if (!body.title || !body.venue_name || !body.starts_at){ toast('Add a name, a venue and a start time'); return; }
    ev.target.disabled = true;
    try{
      await api(e ? `/admin/events/${e.id}` : '/admin/events', { method: e ? 'PATCH' : 'POST', body: JSON.stringify(body) });
      closeOverlay(); toast(e ? 'Saved' : 'Event added'); route();
    }catch(err){ ev.target.disabled = false; toast(err.message); }
  };
}

// ---- audit
const ACTIONS = { disable:'Disabled account', enable:'Enabled account', delete_user:'Deleted account', send_reset:'Sent password reset',
  mark_test:'Marked as test', unmark_test:'Counted in stats', invite:'Sent waitlist invites', mark_invited:'Marked invited',
  export:'Exported CSV', grant_admin:'Made admin', revoke_admin:'Removed admin',
  event_create:'Added event', event_edit:'Edited event', event_approved:'Approved event', event_rejected:'Rejected event',
  event_pending:'Moved event back to review', event_delete:'Deleted event' };
async function renderAudit(seq){
  const rows = await api('/admin/audit?limit=200');
  if (stale(seq)) return;
  $('secSub').textContent = 'Every change made from this dashboard';
  $('sec').innerHTML = panel('Recent admin actions', table([
    { h:'When', f: r => esc(dtime(r.created_at)) },
    { h:'Who', f: r => r.admin ? '@' + esc(r.admin) : '<span class="t-meta">script</span>' },
    { h:'Action', f: r => esc(ACTIONS[r.action] || r.action) },
    { h:'On', cls:'clip', f: r => esc(r.target || '') },
    { h:'Details', cls:'clip', f: r => r.details ? `<span class="t-meta">${esc(Object.entries(r.details).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.length : v}`).join(', '))}</span>` : '' }],
    rows, { empty:'No admin actions yet.' }));
}

// ---------------------------------------------------------------- boot
(async function boot(){
  if (!token()){ location.replace('auth.html?redirect=admin.html'); return; }
  try{ state.me = await api('/users/me'); }
  catch(e){ $('app').innerHTML = `<div class="center-msg">${notice('Couldn’t reach the server', e.message, 'err')}</div>`; return; }
  if (!state.me.is_admin){
    $('app').innerHTML = `<div class="center-msg"><div class="empty"><div class="e-art" aria-hidden="true">🔒</div>
      <h3>Admins only</h3><p>You're signed in as @${esc(state.me.username)}, which isn't an admin account.</p>
      <a class="btn btn-dark" href="roamly.html">Back to Roamly</a></div></div>`;
    return;
  }
  shell();
  route();
})();
</script>
