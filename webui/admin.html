<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/brand/icon.svg?v=2026-11-06" type="image/svg+xml" />
<link rel="icon" href="/brand/favicon-32.png?v=2026-11-06" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=2026-11-06" />
<meta name="robots" content="noindex, nofollow" />
<title>Rova Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/rova.css?v=2026-11-06" />
<script src="/config.js"></script>

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ============ Rova admin: ivory paper, charcoal ink, champagne only where something
     needs attention (design 6). Sits on top of rova.css, re-tokened here. ============ */
  :root{
    --bg:#F4EFE6; --surface:#FBF8F3; --surface-2:#F1ECE3; --surface-3:#E9E2D6;
    --ink:#161513; --ink-2:#4A463F; --ink-3:#6E685C;
    --line:#E4DDD0; --line-2:#ECE6DB;
    --primary:#161513; --primary-ink:#8C6A2F; --primary-soft:#F1E7D3; --primary-soft-2:#E8D9BA;
    --champ:#D4B47A; --champ-2:#D9BC85; --champ-ink:#8C6A2F;
    --grad:linear-gradient(#161513,#161513); --grad-soft:linear-gradient(#F1E7D3,#F1E7D3);
    --danger:#A83A26; --danger-soft:#F6E1D9; --warning:#7A5A1E; --warning-soft:#F3E7CF;
    --success:#2F6B3A; --mint-soft:#E1ECDD; --mint-ink:#2F6B3A;
    --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:16px;
    --sh-1:none; --sh-2:0 1px 3px rgba(40,30,10,.08); --sh-3:0 24px 60px -24px rgba(40,30,10,.38); --sh-cta:none;
    /* side menu */
    --side:#141311; --side-ink:#F2EDE4; --side-2:#CFC8BB; --side-3:#8A8478; --side-line:rgba(242,237,228,.1);
    /* chart roles: the dataviz reference palette, validated on this ivory surface */
    --viz-surface:#FBF8F3; --viz-grid:#E7E0D3; --viz-axis:#CFC6B5; --viz-muted:#6E685C;
    --s1c:#2a78d6; --s2c:#eb6834; --s3c:#1baf7a; --s4c:#eda100;
    --good:#2F8A3E; --warn:#C9962B; --serious:#D2754E; --crit:#C2412D;
    --seq-1:#cde2fb; --seq-3:#86b6ef; --seq-5:#3987e5; --seq-7:#1c5cab;
  }
  body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; font-weight:400;}
  ::selection{background:var(--primary-soft-2);}
  :focus-visible{outline:2px solid var(--champ); outline-offset:2px;}
  .ph{font-size:17px; line-height:1;}
  .t-meta{font-size:12.5px; color:var(--ink-3); font-weight:400;}
  .t-label{font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);}

  /* ---- shell: dark side menu, ivory page ---- */
  .shell{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh;}
  .aside{position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:20px 12px 16px;
    background:var(--side); color:var(--side-ink); overflow:hidden;}
  .aside .logo{display:flex; align-items:center; gap:10px; padding:0 10px 14px; color:var(--side-ink);}
  .aside .logo small{font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--side-3);
    padding:3px 7px; border:1px solid rgba(242,237,228,.14); border-radius:999px;}
  .nav{display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1; min-height:0; margin:0 -4px; padding:0 4px;}
  .nav .grp{margin:14px 10px 6px; font-size:10.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--side-3);}
  .nav .grp:first-child{margin-top:4px;}
  .nav a,.nav .soon{display:flex; align-items:center; gap:10px; min-height:30px; padding:0 10px; border-radius:8px;
    font-size:13.5px; font-weight:400; color:var(--side-2);}
  .nav a .ph,.nav .soon .ph{font-size:16px; color:var(--side-3);}
  .nav a:hover{background:rgba(242,237,228,.05); color:var(--side-ink);}
  .nav a[aria-current="page"]{background:rgba(242,237,228,.09); color:var(--side-ink); font-weight:500;}
  .nav a[aria-current="page"] .ph{color:var(--side-ink);}
  .nav .soon{color:var(--side-3); cursor:default;}
  .nav .count{margin-left:auto; min-width:20px; height:18px; padding:0 6px; border-radius:999px; display:inline-grid; place-items:center;
    background:var(--champ); color:#111110; font-size:11px; font-weight:600;}
  .nav .new{margin-left:auto; font-size:9.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--side-3);}
  .nav a .warn-pip{margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--crit);}
  .aside-foot{display:flex; align-items:center; gap:10px; margin-top:12px; padding:14px 10px 0; border-top:1px solid var(--side-line);}
  .aside-foot .av{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:var(--champ-2); color:#111110; font-size:12px; font-weight:600;}
  .aside-foot b{display:block; font-size:13px; font-weight:500; color:var(--side-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .aside-foot small{font-size:11px; color:var(--side-3);}
  .aside-foot a.out{margin-left:auto; color:var(--side-3); padding:6px; border-radius:6px;}
  .aside-foot a.out:hover{color:var(--side-ink); background:rgba(242,237,228,.06);}

  .content{min-width:0; padding:0 36px 60px;}
  .topbar{position:sticky; top:0; z-index:500; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:22px 0 18px; margin:0 0 26px; background:var(--bg); border-bottom:1px solid var(--line);}
  .topbar .ttl{flex:1 1 auto; min-width:180px;}
  .topbar .kick{display:block; font-size:12.5px; color:var(--ink-3); margin-bottom:2px;}
  .topbar .kick:empty{display:none;}
  .topbar h1{font-size:23px; font-weight:600; letter-spacing:-.02em; margin:0; line-height:1.2;}
  .topbar .sub{display:block; font-size:13px; font-weight:400; color:var(--ink-3); letter-spacing:0; margin-top:2px;}
  .topbar .sub:empty{display:none;}
  .find{position:relative; display:flex; align-items:center; width:300px; max-width:100%;}
  .find .ph{position:absolute; left:14px; color:var(--ink-3); font-size:16px; pointer-events:none;}
  .find input{width:100%; height:40px; padding:0 14px 0 38px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font:inherit; font-size:13.5px; color:var(--ink); outline:none;}
  .find input:focus{border-color:var(--champ);}
  .seg{display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--surface-2); border:0;}
  .seg button{border:0; background:none; min-height:32px; padding:0 13px; border-radius:999px;
    font-size:13px; font-weight:500; color:var(--ink-2); cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(40,30,10,.12);}
  .tog{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--ink-2);}
  .tog .switch{width:40px; height:24px; background:#D8D0C1;}
  .tog .switch::after{width:18px; height:18px; box-shadow:none;}
  .tog .switch[aria-checked="true"]{background:var(--ink);}
  .tog .switch[aria-checked="true"]::after{transform:translateX(16px);}
  .dd{position:relative;}
  .dd-menu{position:absolute; right:0; top:calc(100% + 6px); min-width:230px; padding:6px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-3); z-index:20;}
  .dd-menu button{display:block; width:100%; text-align:left; border:0; background:none; padding:9px 12px;
    border-radius:8px; font-size:13.5px; font-weight:400; cursor:pointer;}
  .dd-menu button:hover{background:var(--surface-2);}

  /* ---- buttons, chips, fields in the admin's terms ---- */
  .btn{min-height:40px; padding:0 18px; font-size:14px; font-weight:500; border-radius:999px; transition:background-color .15s, border-color .15s;}
  .btn:hover,.btn:active{transform:none;}
  .btn-primary,.btn-dark{background:var(--ink); color:#F4EFE6; box-shadow:none;}
  .btn-primary:hover,.btn-dark:hover{background:#2A2825; box-shadow:none;}
  .btn-ghost{background:transparent; border-color:#D8D0C1; color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink); background:rgba(22,21,19,.03);}
  .btn-sm{min-height:34px; padding:0 14px; font-size:13px;}
  .btn-danger{background:transparent; color:var(--danger); border-color:#E2B9AD;}
  .btn-danger:hover{background:var(--danger-soft);}
  .icon-btn{width:40px; height:40px; border-color:var(--line); background:var(--surface);}
  .icon-btn:hover{border-color:var(--ink);}
  .chip{min-height:36px; padding:0 14px; font-size:13.5px; font-weight:500; border-color:#D8D0C1; background:transparent;}
  .chip:hover{border-color:var(--ink); color:var(--ink);}
  .chip.on,.chip[aria-pressed="true"]{background:var(--ink); color:#F4EFE6; border-color:var(--ink); box-shadow:none;}
  .chip.sm{min-height:32px; padding:0 12px; font-size:13px;}
  .chip .n{color:var(--ink-3); font-weight:400; margin-left:2px;}
  .chip.on .n{color:#B9B2A5;}
  .tag{font-weight:500; background:var(--surface-2); color:var(--ink);}
  .tag.violet{background:var(--surface-2); color:var(--ink);}
  .input{min-height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:400;}
  .input:focus{border-color:var(--champ); box-shadow:0 0 0 3px rgba(212,180,122,.22);}
  .input::placeholder{color:#8F887B;}
  .switch{background:#D8D0C1;} .switch[aria-checked="true"]{background:var(--ink);}
  .notice{border-radius:14px; border-color:var(--line); background:var(--surface); box-shadow:none;}
  .notice .n-ic{background:var(--primary-soft); color:var(--champ-ink);}
  .notice b{font-weight:600;}
  .linkish{border:0; background:none; padding:0; color:inherit; font:inherit; text-decoration:underline; text-underline-offset:2px; cursor:pointer;}

  /* ---- layout ---- */
  .grid{display:grid; gap:16px;}
  .g-tiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
  .g-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .g-side{grid-template-columns:minmax(0,1fr) 360px; align-items:start;}
  .sec{margin-top:24px;}
  .sec > .t-label{display:block; margin-bottom:10px;}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px;}
  .tile .k{font-size:12.5px; font-weight:400; color:var(--ink-2);}
  .tile .v{font-size:30px; font-weight:300; letter-spacing:-.02em; line-height:1.15; margin-top:6px; font-variant-numeric:tabular-nums;}
  .tile .v small{font-size:15px; color:var(--ink-3); font-weight:400;}
  .tile .d{font-size:12.5px; font-weight:400; color:var(--ink-3); margin-top:4px;}
  .tile .d .up{color:var(--success);} .tile .d .down{color:var(--danger);}
  .tile .v.att{color:var(--champ-ink);}
  /* the overview's joined strip of numbers */
  .strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);}
  .strip .tile{border:0; border-radius:0; background:none; padding:24px; border-left:1px solid var(--line);}
  .strip .tile:first-child{border-left:0;}
  .strip .tile .v{font-size:36px;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; min-width:0; box-shadow:none;}
  .panel-h{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .panel-h h2{font-size:16px; font-weight:600; letter-spacing:-.01em; margin:0;}
  .panel-h p{margin:2px 0 0; font-size:12.5px; color:var(--ink-3); font-weight:400;}
  .panel-h .grow{flex:1; min-width:0;}
  .panel-h .aside-note{font-size:12.5px; color:var(--ink-3);}
  .panel.flush{padding:0; overflow:hidden;}
  .panel.flush .panel-h{padding:18px 20px 0; margin-bottom:12px;}
  .mini{border:1px solid #D8D0C1; background:transparent; border-radius:999px; min-height:28px;
    padding:0 11px; font-size:12px; font-weight:500; color:var(--ink-2); cursor:pointer; white-space:nowrap;}
  .mini:hover{border-color:var(--ink);}
  .mini:disabled{opacity:.45; cursor:default;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 8px; padding:0; list-style:none; font-size:12.5px; color:var(--ink-2);}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
  .chart-box{position:relative; height:260px;}
  .chart-box.sm{height:180px;}

  /* ---- tables ---- */
  table.t{width:100%; border-collapse:collapse; font-size:13.5px;}
  .t th{text-align:left; font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--surface);}
  .t td{padding:11px 12px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
  .t tr:last-child td{border-bottom:0;}
  .t td.n,.t th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .t tr.click{cursor:pointer;}
  .t tr.click:hover td{background:var(--surface-2);}
  .t tr.sel td{background:var(--surface-2);}
  .t .muted{color:var(--ink-3);}
  .tbl-wrap{overflow:auto; max-height:560px; margin:0 -4px; padding:0 4px;}
  .panel.flush .tbl-wrap{margin:0; padding:0;}
  .panel.flush .t th:first-child,.panel.flush .t td:first-child{padding-left:20px;}
  .panel.flush .t th:last-child,.panel.flush .t td:last-child{padding-right:20px;}
  .clip{max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* horizontal bar lists: a single series, one hue, value labels outside the bar */
  .bars{display:flex; flex-direction:column; gap:8px;}
  .bar-row{display:grid; grid-template-columns:minmax(90px,38%) 1fr auto; gap:10px; align-items:center; font-size:13px;}
  .bar-row .lab{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2);}
  .bar-row .trk{height:10px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .bar-row .fill{display:block; height:100%; border-radius:0 4px 4px 0; background:var(--ink); min-width:2px;}
  .bar-row .val{font-variant-numeric:tabular-nums; font-weight:500; min-width:46px; text-align:right;}
  .bar-row .val small{color:var(--ink-3); font-weight:400; margin-left:4px;}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px;
    font-weight:500; background:var(--surface-2); color:var(--ink-2); white-space:nowrap;}
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9;}
  .badge.good{background:var(--mint-soft); color:var(--success);} .badge.good::before{background:var(--good);}
  .badge.warn{background:var(--warning-soft); color:var(--warning);} .badge.warn::before{background:var(--warn);}
  .badge.crit{background:var(--danger-soft); color:var(--danger);} .badge.crit::before{background:var(--crit);}
  .badge.plain::before{display:none;}
  .badge.line{background:transparent; border:1px solid #D8D0C1; color:var(--ink-2); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 7px;}
  .badge.line::before{display:none;}
  .meter{height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; min-width:56px;}
  .meter > span{display:block; height:100%; border-radius:0 3px 3px 0; background:var(--ink);}
  .meter.warn > span{background:var(--warn);} .meter.crit > span{background:var(--crit);}

  .ret td.c{text-align:center; font-variant-numeric:tabular-nums; font-weight:500; border-left:2px solid var(--surface);}
  .map{height:380px; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
  .toolbar .input{min-height:40px; max-width:340px;}
  .toolbar .find{width:320px;}
  .pager{display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:14px; font-size:13px; color:var(--ink-2);}
  pre.json{background:var(--surface-2); border-radius:10px; padding:12px; font-size:12px; overflow:auto; max-height:320px;
    margin:0; white-space:pre-wrap; word-break:break-word;}
  .skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2)); background-size:200% 100%; border-radius:16px;}

  /* ---- review queue rows (overview + Review queue page) ---- */
  .q-row{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr) auto; gap:16px; align-items:center;
    padding:12px 20px; border-top:1px solid var(--line-2);}
  .q-head{border-top:1px solid var(--line); padding-top:11px; padding-bottom:11px;}
  .q-head span{font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);}
  .q-head span:last-child{text-align:right;}
  .q-what{display:flex; gap:14px; align-items:center; min-width:0;}
  .q-ph{width:56px; height:56px; border-radius:10px; flex:none; background:var(--surface-3) center/cover no-repeat;
    display:grid; place-items:center; color:var(--ink-3);}
  .q-ph .ph{font-size:20px;}
  .q-what div{min-width:0;}
  .q-kind{display:block; font-size:10.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--champ-ink);}
  .q-what b{display:block; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .q-what small,.q-from small{display:block; font-size:12.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .q-from{font-size:13.5px; min-width:0;}
  .q-sig{font-size:13.5px; color:var(--ink-2); min-width:0;}
  .q-acts{display:flex; gap:8px; justify-content:flex-end;}
  .q-acts .btn{min-height:34px; padding:0 14px; font-size:13.5px;}
  .q-empty{padding:28px 20px; border-top:1px solid var(--line-2); color:var(--ink-3); font-size:13.5px;}

  /* plans by start time */
  .hours{display:flex; align-items:flex-end; gap:5px; height:132px; margin-top:6px;}
  .hours i{flex:1; min-width:0; border-radius:4px 4px 0 0; background:#E4DDD0; min-height:2px; position:relative;}
  .hours i.hi{background:var(--ink);} .hours i.peak{background:var(--champ);}
  .hours-x{display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; color:var(--ink-3);}
  .hours-note{margin:16px 0 0; font-size:13px; color:var(--ink-2);}
  /* most added tonight */
  .rank{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .rank li{display:grid; grid-template-columns:18px 40px minmax(0,1fr) auto; gap:12px; align-items:center; font-size:14px;}
  .rank .i{color:var(--ink-3); font-size:13px;}
  .rank .ph-img{width:40px; height:40px; border-radius:8px; background:var(--surface-3) center/cover no-repeat;}
  .rank b{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank .c{font-variant-numeric:tabular-nums; color:var(--ink-2);}

  /* ---- users (6c): table + a detail panel beside it ---- */
  .users-wrap{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:0; align-items:start; margin-right:-36px;}
  .users-main{padding-right:28px; min-width:0;}
  .u-cell{display:flex; align-items:center; gap:12px; min-width:0;}
  .u-av{width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:600;}
  .u-cell b{font-weight:500; font-size:14px;}

  .rv-quote{padding:10px 0; border-top:1px solid var(--line-2);} .rv-quote:first-child{border-top:0; padding-top:0;}
  .rv-quote p{margin:4px 0 2px; font-size:14px;}

    .strip .tile:nth-child(3){border-left:0;} .strip .tile:nth-child(n+3){border-top:1px solid var(--line);} }
  @media (max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr);}
    .aside{min-width:0;}

    .nav{flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:4px; flex:none;}
    .nav .grp,.nav .soon,.aside-foot{display:none;}

    .topbar{position:static;}

    .q-what b{white-space:normal;}
    .kv{grid-template-columns:1fr;} .kv dt{margin-top:6px;}
    .bar-row{grid-template-columns:minmax(80px,40%) 1fr auto;}

    .strip{grid-template-columns:1fr;} .strip .tile{border-left:0; border-top:1px solid var(--line);} .strip .tile:first-child{border-top:0;}

</style>

<body>
<div id="app"><div class="center-msg"><p class="t-meta">Loading the admin dashboard…</p></div></div>

<script>
const API = window.API_BASE;
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem('rova_token');
const authHeaders = () => token() ? { 'Authorization': 'Bearer ' + token() } : {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat();
const fmt = n => n == null ? '—' : nf.format(Math.round(n));
const pct = (n, digits = 1) => n == null ? '—' : (n * 100).toFixed(digits).replace(/\.0$/, '') + '%';
const ms = n => n == null ? '—' : n >= 1000 ? (n / 1000).toFixed(1) + ' s' : Math.round(n) + ' ms';
const dshort = s => new Date(s + (s.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' });
const dtime = s => s ? new Date(s).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '—';
const ago = s => {
  if (!s) return 'never';
  const sec = (Date.now() - new Date(s)) / 1000;
  if (sec < 90) return 'just now';
  if (sec < 5400) return Math.round(sec / 60) + ' min ago';
  if (sec < 129600) return Math.round(sec / 3600) + ' h ago';
  return Math.round(sec / 86400) + ' days ago';
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('admin_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('admin_' + k, JSON.stringify(v)); }catch(e){} },
};

const state = { days: store.get('days', 30), includeTest: store.get('includeTest', false), me: null, hours: 24 };
let charts = [], maps = [];

// ---------------------------------------------------------------- API
async function api(path, opts = {}){
  const r = await apiFetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({ 'Content-Type':'application/json' }, authHeaders(), opts.headers || {}) }), 45000);
  if (r.status === 401){ localStorage.removeItem('rova_token'); location.replace('auth.html?redirect=admin.html'); throw new Error('Signed out'); }
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok){
    const detail = Array.isArray(d.detail)        // a form check: "starts_at: …"
      ? d.detail.map(x => `${(x.loc || []).slice(-1)[0]}: ${String(x.msg || '').replace(/^Value error, /, '')}`).join('; ')
      : d.detail;
    throw new Error(detail || `Request failed (${r.status})`);
  }
  return d;
}
const q = (extra = {}) => '?' + new URLSearchParams(Object.assign(
  { days: state.days, include_test: state.includeTest }, extra)).toString();

async function download(path, name){
  const r = await apiFetch(API + path, { headers: authHeaders() }, 120000);
  if (!r.ok){ toast('Export failed (' + r.status + ')'); return; }
  const blob = await r.blob();
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function toast(msg){
  let t = $('toast');
  if (!t){ t = Object.assign(document.createElement('div'), { id:'toast', className:'toast' });
    t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>`; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200);
}

// ---------------------------------------------------------------- charts
Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.font.size = 12;
Chart.defaults.color = '#6E685C';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = () => [css('--s1c'), css('--s2c'), css('--s3c'), css('--s4c')];

function axes(stacked = false, yFmt){
  return {
    x: { stacked, grid:{ display:false }, border:{ color: css('--viz-axis') },
         ticks:{ maxRotation:0, autoSkipPadding:14 } },
    y: { stacked, beginAtZero:true, grid:{ color: css('--viz-grid') }, border:{ display:false },
         ticks:{ precision:0, callback: yFmt || (v => nf.format(v)) } },
  };
}

// A chart card: legend (>=2 series), the canvas, and a table view of the same data.
function chartCard({ id, title, sub, series, small }){
  const legend = series.length > 1
    ? `<ul class="legend">${series.map((s, i) => `<li><i style="background:${s.color || SERIES()[i]}"></i>${esc(s.label)}</li>`).join('')}</ul>` : '';
  return `<div class="panel"><div class="panel-h"><div class="grow"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
    <button class="mini" data-table-toggle="${id}">Table</button></div>${legend}
    <div class="chart-box ${small ? 'sm' : ''}" id="${id}-box"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div>
    <div class="tbl-wrap hidden" id="${id}-tbl"></div></div>`;
}

function drawChart(id, { type = 'bar', labels, series, stacked = false, yFmt, tipFmt }){
  const el = $(id); if (!el) return;
  const colors = SERIES();
  const datasets = series.map((s, i) => {
    const c = s.color || colors[i];
    return type === 'line'
      ? { label: s.label, data: s.data, borderColor: c, backgroundColor: c, borderWidth: 2,
          // isolated readings (e.g. one awake hour) would be invisible as a 0-length line
          pointRadius: s.data.filter(v => v != null).length <= 3 ? 4 : 0,
          pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: css('--viz-surface'), tension: .25, spanGaps: false }
      : { label: s.label, data: s.data, backgroundColor: c, borderRadius: { topLeft:4, topRight:4 }, borderSkipped:'start',
          borderColor: css('--viz-surface'), borderWidth: stacked ? { top:2 } : 0,
          barPercentage: .82, categoryPercentage: .86, maxBarThickness: 26 };
  });
  charts.push(new Chart(el, {
    type, data: { labels: labels.map(l => l.display ?? l), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: '#161513', padding: 10, cornerRadius: 10, boxPadding: 4, usePointStyle: true,
          callbacks: { label: c => ` ${c.dataset.label}: ${(tipFmt || fmt)(c.parsed.y)}` } } },
      scales: axes(stacked, yFmt),
    },
  }));
  // table view
  const tbl = $(id + '-tbl');
  tbl.innerHTML = `<table class="t"><thead><tr><th></th>${series.map(s => `<th class="n">${esc(s.label)}</th>`).join('')}</tr></thead><tbody>${
    labels.map((l, i) => `<tr><td>${esc(l.display ?? l)}</td>${series.map(s => `<td class="n">${(tipFmt || fmt)(s.data[i])}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
}

function barList(rows, { label = r => r.key, value = r => r.count, total, empty = 'No data yet.' } = {}){
  if (!rows || !rows.length) return `<p class="t-meta">${esc(empty)}</p>`;
  const max = Math.max(...rows.map(value), 1);
  const sum = total ?? rows.reduce((a, r) => a + value(r), 0);
  return `<div class="bars">${rows.map(r => {
    const v = value(r);
    return `<div class="bar-row" title="${esc(label(r))}: ${fmt(v)}"><span class="lab">${esc(label(r))}</span>
      <span class="trk"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span>
      <span class="val">${fmt(v)}${sum ? `<small>${pct(v / sum, 0)}</small>` : ''}</span></div>`;
  }).join('')}</div>`;
}

const tile = (k, v, d = '') => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
const panel = (title, body, sub = '', right = '') => `<div class="panel"><div class="panel-h"><div class="grow"><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${right}</div>${body}</div>`;
const notice = (title, text, kind = 'warn') => `<div class="notice ${kind}"><span class="n-ic" aria-hidden="true">!</span><div><b>${esc(title)}</b><p>${esc(text)}</p></div></div>`;
const statusBadge = (ok, okText = 'OK', badText = 'Down') => ok ? `<span class="badge good">${okText}</span>` : `<span class="badge crit">${badText}</span>`;
const table = (cols, rows, opts = {}) => `<div class="tbl-wrap" ${opts.full ? 'style="max-height:none"' : ''}><table class="t"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.hRaw ?? esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
  rows.length ? rows.map(r => `<tr ${opts.rowAttr ? opts.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''} ${c.cls || ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')
  : `<tr><td colspan="${cols.length}" class="muted">${esc(opts.empty || 'Nothing here yet.')}</td></tr>`}</tbody></table></div>`;

function webBlock(web, render){
  if (!web) return '';
  if (!web.connected) return notice('Google Analytics isn’t connected',
    (web.error || 'GA4 settings are missing on the API server.') +
    ' These are read from the Render API service’s Environment; after changing them, the service must redeploy.');
  if (web.error) return notice('Couldn’t load Google Analytics', web.error, 'err');
  return render(web);
}

// ---------------------------------------------------------------- sections
const SECTIONS = [
  { id:'overview', title:'Overview', group:'Summary', icon:'squares-four', render: renderOverview },
  { id:'activity', title:'Users & retention', group:'People', icon:'chart-line-up', render: renderActivity },
  { id:'funnel', title:'Sign-up funnel', group:'People', icon:'funnel', render: renderFunnel },
  { id:'traffic', title:'Traffic sources', group:'Reach', icon:'signpost', render: renderTraffic },
  { id:'geo', title:'Where users are', group:'Reach', icon:'globe-hemisphere-west', render: renderGeo },
  { id:'planner', title:'Planner', group:'Product', icon:'path', render: renderPlanner },
  { id:'reviews', title:'Plan reviews', group:'Product', icon:'star', render: renderReviews },
  { id:'taste', title:'Taste insights', group:'Product', icon:'sparkle', render: renderTaste },
  { id:'queue', title:'Review queue', group:'Content', icon:'tray', render: renderQueue },
  { soon:true, title:'Venues', group:'Content', icon:'storefront' },
  { id:'events', title:'Nightlife events', group:'Content', icon:'ticket', render: renderEvents },
  { soon:true, title:'Curated nights', group:'Content', icon:'book-open' },
  { id:'health', title:'Server health', group:'Systems', icon:'heartbeat', render: renderHealth },
  { id:'apis', title:'Outside APIs', group:'Systems', icon:'plugs', render: renderApis },
  { id:'users', title:'Users', group:'Manage', icon:'users', render: renderUsers },
  { id:'waitlist', title:'Waitlist', group:'Manage', icon:'hourglass', render: renderWaitlist },
  { soon:true, title:'Reports', group:'Manage', icon:'flag' },
  { id:'audit', title:'Admin activity', group:'Manage', icon:'clock-counter-clockwise', render: renderAudit },
];
const RANGES = [[7,'7d'],[30,'30d'],[90,'90d'],[365,'1y']];
const usesRange = new Set(['activity','funnel','traffic','geo','planner','reviews','apis']);
const usesTestToggle = new Set(['overview','activity','funnel','geo','planner','reviews','taste']);

function shell(){
  let groups = '', last = null;
  for (const s of SECTIONS){
    if (s.group !== last){ groups += `<span class="grp">${esc(s.group)}</span>`; last = s.group; }
    groups += s.soon
      ? `<span class="soon" aria-disabled="true" title="Coming soon"><i class="ph ph-${s.icon}" aria-hidden="true"></i>${esc(s.title)}<span class="new">Soon</span></span>`
      : `<a href="#${s.id}" data-sec="${s.id}"><i class="ph ph-${s.icon}" aria-hidden="true"></i>${esc(s.title)}${s.id === 'queue' ? '<span class="count" id="qCount" hidden></span>' : ''}</a>`;
  }
  const me = state.me, init = String(me.display_name || me.username || '?').trim()[0].toUpperCase();
  $('app').innerHTML = `<div class="shell">
    <aside class="aside"><a class="logo on-dark" href="rova.html" aria-label="Rova admin"><svg class="wordmark" viewBox="385 108 651 160" width="98" height="24" aria-hidden="true" focusable="false"><defs><linearGradient id="rvwm-admin" gradientUnits="userSpaceOnUse" x1="815" y1="222" x2="928" y2="112"><stop offset="0" stop-color="#BC956C"/><stop offset=".15" stop-color="#D6B38A"/><stop offset=".55" stop-color="#C29C71"/><stop offset="1" stop-color="#A8835A"/></linearGradient></defs><g fill="currentColor"><path d="M389 159H402V262.5H389Z"/><path d="M389 159H468.5A30.5 30.5 0 0 1 468.5 220H464L509.7 262.5H491L427.7 205H468.5A15.5 15.5 0 0 0 468.5 174H389Z"/><path d="M567 212a60 54 0 1 0 120 0a60 54 0 1 0 -120 0Z M580 211a47 44 0 1 1 94 0a47 44 0 1 1 -94 0Z"/><path d="M744.7 162H760.7L819.5 252L811.5 265Z"/><path d="M901.5 262.5L967 159.3L1032.5 262.5H1016.6L966.8 182.8L916.4 262.5Z"/></g><path d="M864 186L830.5 236L827.5 241L823 234.5Z" fill="#7A5C3C"/><path d="M928 112L811 217L823 234.5Z" fill="url(#rvwm-admin)"/></svg><small>Admin</small></a>
      <nav class="nav" aria-label="Dashboard sections">${groups}</nav>
      <div class="aside-foot"><span class="av" aria-hidden="true">${esc(init)}</span><div style="min-width:0"><b>@${esc(me.username)}</b><small>Admin</small></div>
        <a class="out" href="rova.html" title="Back to the app" aria-label="Back to the app"><i class="ph ph-sign-out" aria-hidden="true"></i></a></div></aside>
    <main class="content"><div class="topbar"><div class="ttl"><span class="kick" id="secKick"></span><h1 id="secTitle">Overview</h1><span class="sub" id="secSub"></span></div>
      <form class="find hidden" id="findBox" role="search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <input id="findQ" type="search" placeholder="Find a person by email or name" aria-label="Find a person" autocomplete="off"></form>
      <div class="seg" id="rangeSeg" role="group" aria-label="Date range">${RANGES.map(([d, l]) =>
        `<button data-days="${d}" aria-pressed="${state.days === d}">${l}</button>`).join('')}</div>
      <label class="tog" id="testTog"><button class="switch" role="switch" id="testSwitch" aria-checked="${state.includeTest}" aria-label="Include test accounts"></button>Test accounts</label>
      <div class="dd"><button class="btn btn-ghost btn-sm" id="exportBtn" aria-haspopup="menu" aria-expanded="false"><i class="ph ph-download-simple" aria-hidden="true"></i> Export CSV</button>
        <div class="dd-menu hidden" id="exportMenu" role="menu">
          <button role="menuitem" data-export="users">All users</button>
          <button role="menuitem" data-export="waitlist">Waitlist</button>
          <button role="menuitem" data-export="plans">Plan logs (selected range)</button>
          <button role="menuitem" data-export="reviews">Plan reviews (selected range)</button></div></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh"><i class="ph ph-arrows-clockwise" aria-hidden="true"></i></button></div>
      <div id="sec"></div></main></div>`;

  $('findBox').onsubmit = e => { e.preventDefault(); uState.q = $('findQ').value.trim(); uState.page = 1; uState.filter = 'all';
    if (location.hash === '#users') route(); else location.hash = '#users'; };
  $('rangeSeg').onclick = e => { const b = e.target.closest('[data-days]'); if (!b) return;
    state.days = +b.dataset.days; store.set('days', state.days);
    $('rangeSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); route(); };
  $('testSwitch').onclick = () => { state.includeTest = !state.includeTest; store.set('includeTest', state.includeTest);
    $('testSwitch').setAttribute('aria-checked', state.includeTest); route(); };
  $('refreshBtn').onclick = () => { route(); queueCount(); };
  $('exportBtn').onclick = e => { e.stopPropagation(); const m = $('exportMenu'); m.classList.toggle('hidden');
    $('exportBtn').setAttribute('aria-expanded', !m.classList.contains('hidden')); };
  document.addEventListener('click', () => { $('exportMenu').classList.add('hidden'); $('exportBtn').setAttribute('aria-expanded', 'false'); });
  $('exportMenu').onclick = e => { const b = e.target.closest('[data-export]'); if (!b) return;
    const k = b.dataset.export, stamp = new Date().toISOString().slice(0, 10);
    download(`/admin/export/${k}.csv${k === 'plans' || k === 'reviews' ? '?days=' + state.days : ''}`, `rova-${k}-${stamp}.csv`); };

const clock = h => `${h % 12 || 12}${h < 12 ? 'am' : 'pm'}`;
/* Today's plans by the hour they start: one series, the peak in champagne, the busy
   hours in charcoal, the rest light. Each bar names its hour and count on hover. */
function hoursChart(rows){
  const total = rows.reduce((a, r) => a + r.count, 0);
  // show the evening at least (noon to 2am), widened to any hour that has plans
  let lo = rows.findIndex(r => r.hour === 12), hi = rows.findIndex(r => r.hour === 2);
  rows.forEach((r, i) => { if (r.count){ lo = Math.min(lo, i); hi = Math.max(hi, i); } });
  const shown = rows.slice(lo, hi + 1), max = Math.max(...shown.map(r => r.count), 1);
  const peak = shown.reduce((a, r) => r.count > a.count ? r : a, shown[0]);
  const label = r => `${clock(r.hour)}: ${r.count} plan${r.count === 1 ? '' : 's'}`;
  const ticks = [0, Math.round((shown.length - 1) / 3), Math.round((shown.length - 1) * 2 / 3), shown.length - 1];
  return `<div class="hours" role="img" aria-label="${esc(shown.filter(r => r.count).map(label).join(', ') || 'No plans yet today')}">${shown.map(r =>
      `<i class="${r.count && r === peak ? 'peak' : r.count >= max * .6 ? 'hi' : ''}" style="height:${Math.max(2, r.count / max * 100)}%" title="${esc(label(r))}"></i>`).join('')}</div>
    <div class="hours-x">${ticks.map(i => `<span>${clock(shown[i].hour)}</span>`).join('')}</div>
    <p class="hours-note">${total ? `Peak is ${clock(peak.hour)}, with ${fmt(peak.count)} of today's ${fmt(total)} plan${total === 1 ? '' : 's'}.` : 'No plans yet today.'}</p>`;
}
function rankList(rows){
  if (!rows.length) return '<p class="t-meta">No plans yet today.</p>';
  return `<ol class="rank">${rows.slice(0, 5).map((r, i) => `<li><span class="i">${i + 1}</span>
    <span class="ph-img" style="${r.image ? `background-image:url('${esc(safeImg(r.image))}')` : ''}"></span>
    <b>${esc(r.name)}</b><span class="c">${fmt(r.count)}</span></li>`).join('')}</ol>`;
}
const safeImg = u => /^https:\/\//i.test(String(u || '')) ? String(u).replace(/'/g, '%27') : '';

/* Review queue rows: event submissions to approve or decline, low ratings to read. */
function queueRows(items, empty){
  const head = `<div class="q-row q-head"><span>Submission</span><span>From</span><span>Signal</span><span>Decision</span></div>`;
  if (!items.length) return head + `<div class="q-empty">${esc(empty)}</div>`;
  return head + items.map(i => {
    const img = safeImg(i.image);
    const ph = `<span class="q-ph" style="${img ? `background-image:url('${esc(img)}')` : ''}">${img ? '' : `<i class="ph ph-${i.kind === 'event' ? 'ticket' : 'star'}" aria-hidden="true"></i>`}</span>`;
    const acts = !i.pending
      ? `<span class="badge ${i.status === 'approved' ? 'good' : i.status === 'rejected' ? 'crit' : 'plain'}">${esc(i.status)}</span>`
      : i.kind === 'event'
        ? `<button class="btn btn-ghost" data-q-act="rejected" data-q-id="${i.id}">Decline</button>
           <button class="btn btn-primary" data-q-act="approved" data-q-id="${i.id}"><i class="ph ph-check" aria-hidden="true"></i> Approve</button>`
        : `<button class="btn btn-ghost" data-q-open="${i.id}">Open</button>
           <button class="btn btn-primary" data-q-act="read" data-q-id="${i.id}"><i class="ph ph-check" aria-hidden="true"></i> Mark read</button>`;
    return `<div class="q-row"><div class="q-what">${ph}<div><span class="q-kind">${esc(i.label)}</span><b title="${esc(i.title)}">${esc(i.title)}</b><small>${esc(i.sub)}</small></div></div>
      <div class="q-from">${esc(i.from)}<small>${esc(ago(i.at))}</small></div>
      <div class="q-sig">${i.stars ? starsHtml(i.stars) : esc(i.signal)}</div>
      <div class="q-acts">${acts}</div></div>`;
  }).join('');
}
function wireQueue(box){
  if (!box) return;
  box.onclick = async e => {
    const open = e.target.closest('[data-q-open]'); if (open){ openReview(open.dataset.qOpen); return; }
    const b = e.target.closest('[data-q-act]'); if (!b) return;
    b.disabled = true;
    try{
      if (b.dataset.qAct === 'read'){
        await api(`/admin/reviews/${b.dataset.qId}/reviewed`, { method:'POST', body: JSON.stringify({ value: true }) });
        toast('Marked as read');
      } else {
        await api(`/admin/events/${b.dataset.qId}/status`, { method:'POST', body: JSON.stringify({ status: b.dataset.qAct }) });
        toast(b.dataset.qAct === 'approved' ? 'Approved: it’s live in Nightlife' : 'Declined');
      }
      route(); queueCount();
    }catch(err){ b.disabled = false; toast(err.message); }
  };
}

/* What people keep and drop (backend services/feedback.py): the venues with the strongest
   lean either way, and the nudge each one now gets in the planner's ranking. */
function learnedPanel(l){
  if (!l) return '';
  const cols = [{ h:'Place', cls:'clip', f: r => esc(r.name) }, { h:'Saw', n:1, f: r => fmt(r.users) },
    { h:'Kept', n:1, f: r => fmt(r.kept) }, { h:'Dropped', n:1, f: r => fmt(r.dropped) },
    { h:'Nudge', n:1, f: r => (r.bonus > 0 ? '+' : '') + r.bonus }];
  const body = l.counting
    ? `<p class="t-meta">Kept most</p>${table(cols, l.top)}<p class="t-meta" style="margin-top:12px">Dropped most</p>${table(cols, l.bottom)}`
    : `<p class="t-meta">No place has been seen by ${l.min_users} people yet, so nothing is nudged. ${fmt(l.venues)} places have some feedback.</p>`;
  return panel('What people keep', body, l.weight ? `Counts people, not clicks · a place counts once ${l.min_users} people have seen it` : 'Switched off (SIGNAL_WEIGHT = 0)');
}

function overlay(html, kind = 'modal'){
  closeOverlay();
  const scrim = Object.assign(document.createElement('div'), { className:'scrim', id:'scrim' });
  const box = Object.assign(document.createElement('div'), { className: kind, id:'overlay' });
  box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
  box.innerHTML = html;
  scrim.onclick = closeOverlay;
  document.body.append(scrim, box);
  box.querySelector('[data-close]')?.focus();
  return box;
}
function closeOverlay(){ $('scrim')?.remove(); $('overlay')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeOverlay(); });

// ---- health
const HOURS = [[6,'6h'],[24,'24h'],[168,'7d'],[720,'30d'],[2160,'90d']];
async function renderHealth(seq){
  const h = await api('/admin/health?hours=' + state.hours);
  if (stale(seq)) return;
  const st = h.status;
  // Lay out every bucket in the window so sleep/no-traffic shows as a gap.
  const UNIT = { minute: 6e4, hour: 36e5, day: 864e5 }[h.unit];
  const byT = new Map(h.series.map(r => [Date.parse(r.t + 'Z'), r]));
  const end = Math.floor(Date.now() / UNIT) * UNIT;
  const s = [];
  for (let t = end - Math.ceil(state.hours * 36e5 / UNIT - 1) * UNIT; t <= end; t += UNIT)
    s.push(byT.get(t) || { t, requests: null, '4xx': null, '5xx': null, p95_ms: null, empty: true });
  const lab = t => { const d = new Date(typeof t === 'number' ? t : Date.parse(t + 'Z')); return h.unit === 'day' ? d.toLocaleDateString(undefined, { month:'short', day:'numeric' })
    : h.unit === 'hour' && state.hours > 24 ? d.toLocaleString(undefined, { weekday:'short', hour:'numeric' })
    : d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }); };
  const tot = s.reduce((a, r) => a + (r.requests || 0), 0), e5 = s.reduce((a, r) => a + (r['5xx'] || 0), 0);
  const er = tot ? e5 / tot : null;
  $('secSub').textContent = 'Saved once a minute while the server is awake';
  $('sec').innerHTML = `
    <div class="toolbar"><div class="seg" id="hoursSeg" role="group" aria-label="Time window">${HOURS.map(([v, l]) =>
      `<button data-hours="${v}" aria-pressed="${state.hours === v}">${l}</button>`).join('')}</div>
      <span class="t-meta">${esc(h.note)}</span></div>
    <div class="grid g-tiles">
      ${tile('Database', statusBadge(st.database.ok), st.database.ok ? ms(st.database.ms) + ' to answer' : esc(st.database.error))}
      ${tile('Redis', statusBadge(st.redis.ok), st.redis.ok ? ms(st.redis.ms) + ' to answer' : esc(st.redis.error))}
      ${tile('Up for', upFor(st.uptime_s), 'since the last restart or wake-up')}
      ${tile('Requests', fmt(tot))}
      ${tile('Server errors', pct(er, 2), `${fmt(e5)} 5xx responses`)}
      ${tile('Cold starts', fmt(h.cold_starts.length), h.cold_starts[0] ? 'latest ' + ago(h.cold_starts[0]) : 'none in this window')}
    </div>
    <div class="sec">${chartCard({ id:'hReq', title:'Requests', sub:`Per ${h.unit}`, series:[{ label:'Requests' }] })}</div>
    <div class="grid g-2 sec">
      ${chartCard({ id:'hLat', title:'Response time (p95)', sub:'Slowest 5% of requests took at least this long', small:true, series:[{ label:'p95' }] })}
      ${chartCard({ id:'hErr', title:'Server errors (5xx)', small:true, series:[{ label:'5xx errors', color: css('--crit') }] })}
    </div>
    <div class="sec">${panel('By route', table([
      { h:'Route', cls:'clip', f: r => `<code>${esc(r.route)}</code>` },
      { h:'Requests', n:1, f: r => fmt(r.requests) }, { h:'4xx', n:1, f: r => fmt(r['4xx']) },
      { h:'5xx', n:1, f: r => r['5xx'] ? `<span class="badge crit">${fmt(r['5xx'])}</span>` : '0' },
      { h:'p95 (avg)', n:1, f: r => ms(r.p95_ms) }, { h:'Worst p95', n:1, f: r => ms(r.worst_p95_ms) }], h.routes),
      '“unmatched” = requests to URLs that don’t exist (often bots)')}</div>`;
  $('hoursSeg').onclick = e => { const b = e.target.closest('[data-hours]'); if (!b) return; state.hours = +b.dataset.hours; route(); };
  const labels = s.map(r => ({ display: lab(r.t) }));
  drawChart('hReq', { labels, series:[{ label:'Requests', data: s.map(r => r.requests) }] });
  drawChart('hLat', { type:'line', labels, series:[{ label:'p95', data: s.map(r => r.p95_ms) }], yFmt: v => ms(v), tipFmt: ms });
  drawChart('hErr', { labels, series:[{ label:'5xx errors', color: css('--crit'), data: s.map(r => r['5xx']) }] });
}

function guardCell(r){
  const q = r.quota;
  if (!q) return `<span class="badge good">free</span>`;
  if (r.status === 'disabled') return `<span class="badge plain">off: paid product</span><div class="t-meta">switched off in code, never called</div>`;
  if (r.status === 'unguarded') return `<span class="badge crit">not guarded</span><div class="t-meta">FREE_TIER_ONLY is off</div>`;

  const used = q.used ?? 0, pctUsed = q.cap ? used / q.cap : 0;
  const cls = r.status === 'capped' ? 'crit' : r.status === 'near' ? 'warn' : '';
  const tok = q.tokens_cap ? `<div class="t-meta">${q.tokens_used == null ? '?' : fmt(q.tokens_used)} / ${fmt(q.tokens_cap)} tokens today</div>` : '';
  return `<div style="display:flex;gap:8px;align-items:center"><div class="meter ${cls}" style="flex:1"><span style="width:${Math.min(100, pctUsed * 100).toFixed(1)}%"></span></div>

    ${r.status === 'capped' ? `<div class="t-meta">Paused until the ${q.period === 'day' ? 'day' : 'month'} resets${q.blocked ? ` · ${fmt(q.blocked)} turned away` : ''}</div>` : ''}`;
}

/* The account actions, for the side panel and the drawer alike. */
function wireUserActions(box, u, after){
  box.onclick = async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    try{
      if (act === 'disabled' || act === 'test'){
        await api(`/admin/users/${u.id}/${act}`, { method:'POST', body: JSON.stringify({ value: b.dataset.v === 'true' }) });
        toast('Saved'); after();
      } else if (act === 'reset'){
        await api(`/admin/users/${u.id}/reset-password`, { method:'POST' }); toast('Reset email sent');
      } else if (act === 'delete'){
        const typed = prompt(`This permanently deletes @${u.username}, their survey and their plan history.\nType the username to confirm:`);
        if (typed !== u.username){ if (typed != null) toast('Username didn’t match — nothing deleted'); return; }
        await api(`/admin/users/${u.id}`, { method:'DELETE' });
        closeOverlay(); toast(`Deleted @${u.username}`); uState.sel = null; route();
      }
    }catch(err){ toast(err.message); }
  };
}

/* Event times are Toronto times, whatever the browser's zone. */
function torontoInput(s){
  if (!s) return '';
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Toronto', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date(s));
  const g = t => parts.find(p => p.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}T${g('hour')}:${g('minute')}`;
}
const torontoTime = s => s ? new Date(s).toLocaleString(undefined, { timeZone:'America/Toronto', weekday:'short', month:'short',
  day:'numeric', hour:'numeric', minute:'2-digit' }) : '—';
const evPrice = e => e.free ? 'Free' : e.price_min != null ? `$${fmt(e.price_min)}${e.price_max ? '–' + fmt(e.price_max) : ''}` : '—';

  $('sec').querySelectorAll('[data-evtab]').forEach(b => b.onclick = () => { evState.tab = b.dataset.evtab; route(); });
  $('evNew').onclick = () => eventForm(null);
  $('sec').querySelectorAll('[data-ev-act]').forEach(b => b.onclick = async () => {
    const e = rows.find(r => String(r.id) === b.dataset.id), act = b.dataset.evAct;
    if (act === 'edit') return eventForm(e);
    if (act === 'delete' && !confirm(`Delete “${e.title}”? This can't be undone.`)) return;
    b.disabled = true;
    try{
      if (act === 'delete') await api(`/admin/events/${e.id}`, { method:'DELETE' });
      else await api(`/admin/events/${e.id}/status`, { method:'POST', body: JSON.stringify({ status: act }) });
      toast(act === 'approved' ? 'Approved — it\'s live in the Nightlife tab' : act === 'rejected' ? 'Rejected' : 'Deleted');
      route(); queueCount();
    }catch(err){ b.disabled = false; toast(err.message); }
  });
}

function eventForm(e){
  const v = e || { kind:'club_night', status:'approved' };
  const opt = (list, cur) => list.map(([k, l]) => `<option value="${esc(k)}" ${k === (cur || '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const box = overlay(xHead(esc(e ? 'Edit event' : 'Add an event')) + `
    <label class="field">Event name<input class="input" id="efTitle" maxlength="160" value="${esc(v.title || '')}"></label>
    <label class="field sec">Venue <span class="t-meta">(search the map, or type a name)</span>
      <input class="input" id="efVenue" maxlength="160" autocomplete="off" value="${esc(v.venue_name || '')}">
      <span class="t-meta" id="efLinked">${v.venue_id ? 'Linked to the map ✓' : ''}</span></label>
    <div id="efVenues" class="sec" style="display:grid;gap:6px"></div>
    <div class="sec" style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
      <label class="field">Starts (Toronto time)<input class="input" id="efStart" type="datetime-local" value="${esc(torontoInput(v.starts_at))}"></label>
      <label class="field">Ends <span class="t-meta">(optional)</span><input class="input" id="efEnd" type="datetime-local" value="${esc(torontoInput(v.ends_at))}"></label>
      <label class="field">Kind<select class="input" id="efKind">${opt(EV_KINDS, v.kind)}</select></label>
      <label class="field">Special day<select class="input" id="efDay">${opt(EV_DAYS, v.special_day)}</select></label>
      <label class="field">From ($)<input class="input" id="efMin" type="number" min="0" value="${v.price_min ?? ''}"></label>
      <label class="field">Up to ($)<input class="input" id="efMax" type="number" min="0" value="${v.price_max ?? ''}"></label>
    </div>
    <label class="field sec" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="efFree" ${v.free ? 'checked' : ''}> Free entry</label>
    <label class="field sec">Tickets / info link<input class="input" id="efUrl" type="url" maxlength="500" value="${esc(v.url || '')}"></label>
    <label class="field sec">Description<textarea class="input" id="efDesc" maxlength="500" rows="3" style="padding:12px 16px;min-height:90px">${esc(v.description || '')}</textarea></label>
    ${e ? '' : `<label class="field sec" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="efLive" checked> Show it in the app right away</label>`}
    <div class="acts"><button class="btn btn-primary" id="efSave">${e ? 'Save' : 'Add event'}</button><button class="btn btn-ghost" data-close>Cancel</button></div>`);
  let venueId = v.venue_id || null, t;
  const venue = box.querySelector('#efVenue'), list = box.querySelector('#efVenues');
  venue.oninput = () => {
    venueId = null; box.querySelector('#efLinked').textContent = '';
    clearTimeout(t);
    const q = venue.value.trim();
    if (q.length < 2){ list.innerHTML = ''; return; }
    t = setTimeout(async () => {
      try{
        const found = await api('/admin/venues/search?' + new URLSearchParams({ q }));
        list.innerHTML = found.map((x, i) => `<button class="btn btn-ghost btn-sm" style="justify-content:flex-start" data-pick="${i}">${esc(x.name)}
          <span class="t-meta">${esc([x.category, x.address].filter(Boolean).join(' · '))}</span></button>`).join('');
        list.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
          const x = found[+b.dataset.pick];
          venue.value = x.name; venueId = x.id; list.innerHTML = '';
          box.querySelector('#efLinked').textContent = 'Linked to the map ✓';
        });
      }catch(err){ list.innerHTML = ''; }
    }, 250);
  };
  box.querySelector('#efSave').onclick = async ev => {
    const val = id => box.querySelector(id).value.trim(), num = id => val(id) === '' ? null : Number(val(id));
    const free = box.querySelector('#efFree').checked;
    const body = { title: val('#efTitle'), venue_name: val('#efVenue'), starts_at: val('#efStart'), ends_at: val('#efEnd') || null,
      kind: val('#efKind'), special_day: val('#efDay') || null, free: free || null,
      price_min: free ? null : num('#efMin'), price_max: free ? null : num('#efMax'),
      url: val('#efUrl') || null, description: val('#efDesc') || null };
    if (venueId || e) body.venue_id = venueId;     // editing: null unlinks (re-matched by name)
    if (!e) body.status = box.querySelector('#efLive').checked ? 'approved' : 'pending';
    if (!body.title || !body.venue_name || !body.starts_at){ toast('Add a name, a venue and a start time'); return; }
    ev.target.disabled = true;
    try{
      await api(e ? `/admin/events/${e.id}` : '/admin/events', { method: e ? 'PATCH' : 'POST', body: JSON.stringify(body) });
      closeOverlay(); toast(e ? 'Saved' : 'Event added'); route();
    }catch(err){ ev.target.disabled = false; toast(err.message); }
  };
}

// ---- audit
const ACTIONS = { disable:'Disabled account', enable:'Enabled account', delete_user:'Deleted account', send_reset:'Sent password reset',
  mark_test:'Marked as test', unmark_test:'Counted in stats', invite:'Sent waitlist invites', mark_invited:'Marked invited',
  export:'Exported CSV', grant_admin:'Made admin', revoke_admin:'Removed admin',
  event_create:'Added event', event_edit:'Edited event', event_approved:'Approved event', event_rejected:'Rejected event',
  event_pending:'Moved event back to review', event_delete:'Deleted event' };
async function renderAudit(seq){
  const rows = await api('/admin/audit?limit=200');
  if (stale(seq)) return;
  $('secSub').textContent = 'Every change made from this dashboard';
  $('sec').innerHTML = panel('Recent admin actions', table([
    { h:'When', f: r => esc(dtime(r.created_at)) },
    { h:'Who', f: r => r.admin ? '@' + esc(r.admin) : '<span class="t-meta">script</span>' },
    { h:'Action', f: r => esc(ACTIONS[r.action] || r.action) },
    { h:'On', cls:'clip', f: r => esc(r.target || '') },
    { h:'Details', cls:'clip', f: r => r.details ? `<span class="t-meta">${esc(Object.entries(r.details).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.length : v}`).join(', '))}</span>` : '' }],
    rows, { empty:'No admin actions yet.' }));
}

// ---------------------------------------------------------------- boot
(async function boot(){
  if (!token()){ location.replace('auth.html?redirect=admin.html'); return; }
  try{ state.me = await api('/users/me'); }
  catch(e){ $('app').innerHTML = `<div class="center-msg">${notice('Couldn’t reach the server', e.message, 'err')}</div>`; return; }
  if (!state.me.is_admin){
    $('app').innerHTML = `<div class="center-msg"><div class="empty"><div class="e-art" aria-hidden="true">🔒</div>
      <h3>Admins only</h3><p>You're signed in as @${esc(state.me.username)}, which isn't an admin account.</p>
      <a class="btn btn-dark" href="rova.html">Back to Rova</a></div></div>`;
    return;
  }
  shell();
  route();
})();
</script>
