name: Keep API warm

on:
  schedule:
    # Every 10 minutes — comfortably inside Render free tier's ~15min idle
    # spin-down window, so /health never has to cold-start a real user.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          # A cold start can take over a minute, so allow 90s and retry once.
          for attempt in 1 2; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://trekrank.onrender.com/health)
            echo "attempt $attempt status: $status"
            [ "$status" = "200" ] && exit 0
          done
          # Fail the run (not just warn) so an outage triggers GitHub's failure email.
          echo "::error::Health check returned $status after 2 attempts — the API is down"
          exit 1
