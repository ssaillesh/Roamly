name: Refresh venues

# Reloads the stored venue list the planner picks from (backend/scripts/load_venues.py):
# Overture Maps places + Wikidata (how well known) + OpenStreetMap opening hours, all
# free open data. Monthly is plenty: Overture publishes about once a month.
# Photos, only real photos of the place: the venue website's own (each one downloaded
# and checked to be a photo, not a logo or text card), else a Wikimedia Commons photo
# (from Wikidata, or geotagged at the venue and named for it). Websites: up to 10 min;
# Commons: up to 4 min. Sites already checked keep last month's result.
# Run it by hand with "recheck photos" ticked to re-check every stored photo once.
# Needs migration 0015_venue_images on the database (the API runs it on deploy).
#
# Needs one repository secret, VENUES_DATABASE_URL = the production database's
# connection string (Neon → project → Connect, the same one as DATABASE_URL on Render). The loader
# refuses to write if the download looks broken, so a bad month keeps last month's list.
on:
  schedule:
    - cron: "41 8 26 * *"       # the 26th, 08:41 UTC
  workflow_dispatch:
    inputs:
      recheck_photos:
        description: "Re-check every stored photo and drop the ones that aren't real photos"
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-24.04
    # ~3 min download + up to 8 min for opening hours (the public OSM servers are often slow)
    # + up to 10 min for website photos (+ up to 10 more re-checking them, when asked)
    # + up to 4 min for Commons photos
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-venues.txt
      - run: pip install -r requirements.txt -r requirements-venues.txt
      - name: Load Toronto
        env:
          DATABASE_URL: ${{ secrets.VENUES_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the VENUES_DATABASE_URL repository secret (the database's External URL)"
            exit 1
          fi
          python -m scripts.load_venues --city toronto ${{ inputs.recheck_photos && '--recheck-photos' || '' }}
