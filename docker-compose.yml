# Full stack via Docker (requires Docker Desktop / Colima).
# See backend/run_local.sh for the native (no-Docker) path.
services:
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sway:sway@db:5432/sway
      REDIS_URL: redis://redis:6379/0
      # Dev only. Generate a real value for anything internet-facing.
      JWT_SECRET: dev-secret-change-me
      LLM_API_KEY: "${LLM_API_KEY:-}"
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sway
      POSTGRES_PASSWORD: sway
      POSTGRES_DB: sway
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
