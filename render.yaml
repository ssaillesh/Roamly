# Render Blueprint — Sway planner backend.
#
# One web service. The planner runs in-request (external venue APIs + a Redis
# cache), so there is no background worker and no shared disk to coordinate.
#
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.

databases:
  - name: sway-db
    databaseName: sway
    user: sway
    plan: free

services:
  - type: keyvalue            # Render's managed Redis (venue/geocode cache + rate limiting)
    name: sway-redis
    plan: free
    ipAllowList: []           # internal-only
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: sway-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh   # runs migrations + uvicorn
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sway-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Nominatim asks for a descriptive UA with contact info — set your email.
      - key: GEOCODE_USER_AGENT
        value: "Sway/1.0 (your-email@example.com)"
      # Planner brain. Without it the deterministic planner still works.
      - key: LLM_API_KEY
        sync: false
      # Password reset cannot deliver without these — see the README.
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional venue sources; unset => OpenStreetMap only.
      - key: YELP_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
