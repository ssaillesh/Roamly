# Render Blueprint — TrekRank backend.
#
# One web service runs the API (backend/start.sh: migrations, then uvicorn).
# NOTE: the live service is Docker-runtime (backend/Dockerfile) and isn't managed
# by this Blueprint — see CLEANUP.md before relying on this file.
#
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.

# The database is on Neon (neon.tech, free plan with a monthly allowance, no expiry),
# not Render: Render's free Postgres is deleted 30 days after it's created.

services:
  - type: keyvalue            # Render's managed Redis (broker + cache)
    name: trekrank-redis
    plan: free
    ipAllowList: []           # internal-only
    maxmemoryPolicy: noeviction

  - type: web
    # Renamed from trekrank-api. Render keeps a service's original subdomain on
    # rename, so the public URL is still https://trekrank.onrender.com.
    name: roamly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh   # runs migrations + uvicorn
    healthCheckPath: /health
    envVars:
      # Neon → your project → Connect → the direct (not "-pooler") connection string,
      # ending in ?sslmode=require. Set it in the Render dashboard; never commit it.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trekrank-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Required in production: the live https web app (reset-email links + CORS).
      - key: FRONTEND_BASE_URL
        sync: false
      # Nominatim asks for a descriptive UA with contact info — set your email.
      - key: GEOCODE_USER_AGENT
        value: "TrekRank/1.0 (your-email@example.com)"
