# Render Blueprint — TrekRank backend.
#
# One web service runs the API (backend/start.sh: migrations, then uvicorn).
# NOTE: the live service is Docker-runtime (backend/Dockerfile) and isn't managed
# by this Blueprint — see CLEANUP.md before relying on this file.
#
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.

databases:
  - name: roamly-db
    databaseName: trekrank
    user: trek
    plan: free

services:
  - type: keyvalue            # Render's managed Redis (broker + cache)
    name: trekrank-redis
    plan: free
    ipAllowList: []           # internal-only
    maxmemoryPolicy: noeviction

  - type: web
    # Renamed from trekrank-api. Render keeps a service's original subdomain on
    # rename, so the public URL is still https://trekrank.onrender.com.
    name: roamly-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh   # runs migrations + uvicorn
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roamly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trekrank-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Nominatim asks for a descriptive UA with contact info — set your email.
      - key: GEOCODE_USER_AGENT
        value: "TrekRank/1.0 (your-email@example.com)"
